<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Digital Home · Xinyuan’s Secret Garden</title>
<link rel="stylesheet" href="/xwei/xwei.css">
<style>
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px;align-items:start}
.room{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.room h3{margin:0 0 6px;display:flex;align-items:center;gap:8px}
.room h3 input{border:none;font-size:17px;font-weight:700;padding:2px;width:auto;flex:1}
.room h3 input:focus{outline:none;border-bottom:1px dashed var(--sky)}
.room textarea{min-height:74px;border:none;background:var(--warm);border-radius:10px}
.room textarea:focus{outline:1px solid var(--sky)}
.room .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--soft);margin:12px 0 4px}
.want{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line)}
.want span{flex:1}
.want button{background:none;border:none;color:#b3402e;cursor:pointer;font-size:15px}
.wantadd{display:flex;gap:8px;margin-top:10px}
.wantadd input{flex:1}
.roomdel{margin-top:12px}
.panel3d{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:0 0 22px}
.panel3d h2{margin:0 0 6px;font-size:1.15em}
.panel3d .steps{margin:8px 0 12px;padding-left:20px}
.panel3d .steps li{margin:4px 0}
.linkrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;align-items:center}
.linkrow input{flex:1;min-width:220px}
.viewframe{width:100%;aspect-ratio:16/10;border:1px solid var(--line);border-radius:12px;background:#f7f5f0}
</style>
</head>
<body>
<div id="gate"></div>
<div id="app" style="display:none"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<script src="/xwei/xwei.js"></script>
<script>
var house = {rooms: []}, saveT = null;
var $ = function(s){ return document.querySelector(s); };

function buildUI(){
  $("#app").innerHTML =
    '<div class="topbar"><div class="wrap" style="padding-top:0;padding-bottom:0">' +
      '<a href="/xwei/" style="text-decoration:none">← Secret Garden</a>' +
      '<span class="brand">🏠 Digital Home</span><span class="sp"></span>' +
      '<span class="saved" id="saved"></span>' +
      '<button class="linkbtn" id="signOut">Sign out</button>' +
    '</div></div>' +
    '<div class="wrap">' +
      '<h1 class="page">My Future Home</h1>' +
      '<p class="sub">No need to figure it all out at once. Write a little about each room, and add wishes as they come — a small blueprint for future me.</p>' +
      '<div id="rulesHint" class="rules-hint" style="display:none">' +
        '<b>One last step:</b> the database rules don’t include this garden yet, so nothing can be saved. ' +
        'Open the Firebase console → project x-planner-99dd3 → Firestore Database → Rules, replace the rules with the version below, click Publish, then come back and refresh:' +
        '<pre>rules_version = \'2\';\n' +
        'service cloud.firestore {\n' +
        '  match /databases/{database}/documents {\n' +
        '    match /planners/{uid} {\n' +
        '      allow read, write: if request.auth != null &amp;&amp; request.auth.uid == uid;\n' +
        '    }\n' +
        '    match /eatwell/{uid} {\n' +
        '      allow read, write: if request.auth != null &amp;&amp; request.auth.uid == uid;\n' +
        '    }\n' +
        '    // Public per-university visit counters. Docs may ONLY contain {visits}.\n' +
        '    match /uni_visits/{slug} {\n' +
        '      allow read: if true;\n' +
        '      allow create: if request.resource.data.keys().hasOnly([\'visits\']) &amp;&amp; (request.resource.data.visits == 0 || request.resource.data.visits == 1);\n' +
        '      allow update: if request.resource.data.keys().hasOnly([\'visits\']) &amp;&amp; request.resource.data.visits == resource.data.visits + 1;\n' +
        '    }\n' +
        '    match /xwei/{uid} {\n' +
        '      allow read, write: if request.auth != null &amp;&amp; request.auth.uid == uid;\n' +
        '    }\n' +
        '  }\n' +
        '}</pre>' +
      '</div>' +
      '<div id="house3d"></div>' +
      '<div class="rooms" id="rooms"></div>' +
      '<div style="margin-top:18px">' +
        '<button class="btn primary small" id="addRoom" style="width:auto">+  Add room</button>' +
      '</div>' +
    '</div>';
}

function stamp(ts){
  var d = new Date(ts);
  return d.getHours() + ":" + String(d.getMinutes()).padStart(2,"0");
}
function persist(){
  clearTimeout(saveT);
  saveT = setTimeout(function(){
    XW.save("house", house).then(function(){
      $("#saved").textContent = "Saved ✓ " + stamp(Date.now());
    }).catch(function(){
      $("#saved").textContent = "Couldn’t save (see the note above)";
    });
  }, 700);
}

function extractUrl(raw){
  if(!raw) return "";
  var m = String(raw).match(/src\s*=\s*"([^"]+)"/i) || String(raw).match(/src\s*=\s*'([^']+)'/i);
  var u = (m ? m[1] : String(raw)).trim();
  return /^https?:\/\//i.test(u) ? u : "";
}

/* Floorplanner: the viewable embed lives at <project-url>/embed.
   Given any project/editor/embed link, derive clean viewer + editor
   URLs. Any token query (a manage-capable credential) is stripped and
   never stored — the page keeps only the plain project address. */
function deriveModel(u){
  var view = u, edit = u;
  try{
    var a = new URL(u);
    if(/(^|\.)floorplanner\.com$/i.test(a.hostname)){
      var m = a.pathname.match(/^\/projects\/(\d+)(?:-[^\/]*)?(?:\/(editor|embed))?\/?$/);
      if(m){
        view = a.origin + "/projects/" + m[1] + "/embed";
        edit = a.origin + "/projects/" + m[1] + "/editor";
      }else{
        a.search = "";
        view = a.origin + a.pathname;
        edit = view;
      }
    }
  }catch(e){}
  return {view: view, edit: edit};
}

function renderModel(editing){
  var box = $("#house3d"); if(!box) return;
  box.innerHTML = "";
  var panel = document.createElement("div"); panel.className = "panel3d";
  var h = document.createElement("h2"); h.textContent = "🏠 My 3D House";
  panel.appendChild(h);

  if(house.modelUrl && !editing){
    var f = document.createElement("iframe");
    f.className = "viewframe"; f.src = house.modelUrl;
    f.setAttribute("allowfullscreen", ""); f.setAttribute("loading", "lazy");
    f.title = "My 3D house (Floorplanner)";
    panel.appendChild(f);
    var row = document.createElement("div"); row.className = "linkrow";
    var open = document.createElement("a");
    open.className = "btn primary small"; open.style.width = "auto";
    open.style.textDecoration = "none"; open.target = "_blank"; open.rel = "noopener";
    open.href = house.modelEdit || house.modelUrl;
    open.textContent = "Open designer ↗";
    var change = document.createElement("button");
    change.className = "btn ghost small"; change.style.width = "auto";
    change.textContent = "Change link";
    change.addEventListener("click", function(){ renderModel(true); });
    var remove = document.createElement("button");
    remove.className = "linkbtn"; remove.textContent = "Remove";
    remove.style.color = "#b3402e";
    remove.addEventListener("click", function(){
      if(!confirm("Remove the 3D house from this page? Your design itself stays untouched on Floorplanner.")) return;
      house.modelUrl = ""; house.modelEdit = "";
      renderModel(false); persist();
    });
    row.appendChild(open); row.appendChild(change); row.appendChild(remove);
    panel.appendChild(row);
    var live = document.createElement("p"); live.className = "sub";
    live.style.marginBottom = "0";
    live.textContent = "Live from Floorplanner — save a change there and it shows up here. If the frame stays blank, the project may need to be shared/published first; the Open designer button always works.";
    panel.appendChild(live);
  }else{
    var intro = document.createElement("p"); intro.className = "sub";
    intro.textContent = "Design your future home in 3D, step by step, and keep it right here on this page.";
    panel.appendChild(intro);
    var ol = document.createElement("ol"); ol.className = "steps";
    [
      "Create a free account at floorplanner.com (the free Basic plan is plenty: full editor, up to 5 projects).",
      "Design your house there — walls, rooms, furniture — a little at a time, whenever you feel like it.",
      "In Floorplanner, open the project’s Share menu and choose “Embed project”. Copy the embed code (or simply the project link) and paste it below."
    ].forEach(function(t){
      var li = document.createElement("li"); li.textContent = t; ol.appendChild(li);
    });
    panel.appendChild(ol);
    var row2 = document.createElement("div"); row2.className = "linkrow";
    var inp = document.createElement("input");
    inp.type = "text";
    inp.placeholder = "Paste the Floorplanner embed code or project link here";
    inp.value = house.modelEdit || house.modelUrl || "";
    var btn = document.createElement("button");
    btn.className = "btn primary small"; btn.style.width = "auto";
    btn.textContent = house.modelUrl ? "Update link" : "Show my house";
    var msg = document.createElement("span"); msg.className = "saved";
    btn.addEventListener("click", function(){
      var u = extractUrl(inp.value);
      if(!u){ msg.textContent = "That doesn’t look like a link — paste the embed code or the project URL."; return; }
      var d = deriveModel(u);
      house.modelUrl = d.view; house.modelEdit = d.edit;
      persist(); renderModel(false);
    });
    row2.appendChild(inp); row2.appendChild(btn); row2.appendChild(msg);
    panel.appendChild(row2);
    var note = document.createElement("p"); note.className = "sub";
    note.style.marginBottom = "0";
    note.textContent = "Free to design and to view. The design link works like an unlisted link — anyone who has it can open it — and on this page it sits behind your login.";
    panel.appendChild(note);
  }
  box.appendChild(panel);
}

function render(){
  var box = $("#rooms"); box.innerHTML = "";
  house.rooms.forEach(function(room){
    var card = document.createElement("div"); card.className = "room";
    var h = document.createElement("h3");
    var nameIn = document.createElement("input");
    nameIn.type = "text"; nameIn.value = room.name || "";
    nameIn.placeholder = "Room name";
    nameIn.addEventListener("input", function(){ room.name = nameIn.value; persist(); });
    h.appendChild(nameIn);
    card.appendChild(h);

    var l1 = document.createElement("div"); l1.className = "lbl"; l1.textContent = "What I imagine";
    card.appendChild(l1);
    var desc = document.createElement("textarea");
    desc.value = room.desc || "";
    desc.placeholder = "e.g. Bright sunlight, a cozy corner for reading…";
    desc.addEventListener("input", function(){ room.desc = desc.value; persist(); });
    card.appendChild(desc);

    var l2 = document.createElement("div"); l2.className = "lbl"; l2.textContent = "Wish list";
    card.appendChild(l2);
    var wl = document.createElement("div");
    (room.wants || []).forEach(function(w, wi){
      var row = document.createElement("div"); row.className = "want";
      var s = document.createElement("span"); s.textContent = "· " + w;
      var x = document.createElement("button"); x.textContent = "×"; x.title = "Remove";
      x.addEventListener("click", function(){ room.wants.splice(wi, 1); render(); persist(); });
      row.appendChild(s); row.appendChild(x);
      wl.appendChild(row);
    });
    card.appendChild(wl);
    var wa = document.createElement("div"); wa.className = "wantadd";
    var win = document.createElement("input"); win.type = "text"; win.placeholder = "Something I want — press Enter";
    var wbtn = document.createElement("button"); wbtn.className = "btn primary small"; wbtn.textContent = "Add";
    function addWant(){
      var v = win.value.trim(); if(!v) return;
      room.wants = room.wants || []; room.wants.push(v);
      render(); persist();
    }
    wbtn.addEventListener("click", addWant);
    win.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); addWant(); } });
    wa.appendChild(win); wa.appendChild(wbtn);
    card.appendChild(wa);

    var del = document.createElement("button");
    del.className = "linkbtn roomdel"; del.textContent = "Delete this room";
    del.style.color = "#b3402e";
    del.addEventListener("click", function(){
      if(!confirm("Delete “" + (room.name || "this room") + "”? Everything in it will be deleted too.")) return;
      house.rooms = house.rooms.filter(function(r){ return r !== room; });
      render(); persist();
    });
    card.appendChild(del);
    box.appendChild(card);
  });
}

XW.boot(function(){
  buildUI();
  XW.load().then(function(data){
    if(data.house && Array.isArray(data.house.rooms) && data.house.rooms.length){
      house = data.house;
    }else{
      house = {rooms: [
        {name: "Living Room", desc: "Light colors, clean, spacious, full of sunlight.", wants: []},
        {name: "Master Bedroom 1", desc: "Walk-in closet. Light and sun-filled.", wants: []},
        {name: "Master Bedroom 2", desc: "Walk-in closet. Light and sun-filled.", wants: []},
        {name: "Guest Bedroom", desc: "", wants: []},
        {name: "Study 1", desc: "Spacious and bright.", wants: []},
        {name: "Study 2", desc: "Spacious and bright.", wants: []},
        {name: "Kitchen", desc: "Spacious and bright.", wants: []},
        {name: "Tea Room", desc: "", wants: []},
        {name: "Gym", desc: "", wants: []},
        {name: "Storage Room", desc: "", wants: []},
        {name: "Garage", desc: "Room for two cars. Connected to the house by a covered corridor, but separate from the main building.", wants: []},
        {name: "Elevator", desc: "Internal elevator for all three floors.", wants: []}
      ].map(function(r){ return {id: XW.uid(), name: r.name, desc: r.desc, wants: r.wants}; })};
    }
    render();
    renderModel(false);
  }).catch(function(){
    $("#saved").textContent = "Couldn’t load (see the note above)";
    render();
    renderModel(false);
  });
  $("#addRoom").addEventListener("click", function(){
    house.rooms.push({id: XW.uid(), name: "New Room", desc: "", wants: []});
    render(); persist();
  });
});
</script>
</body>
</html>
