<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>My Life in a Few Years? · Xinyuan’s Secret Garden</title>
<link rel="stylesheet" href="/xwei/xwei.css">
<style>
.sec{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:16px 0}
.sec h3{margin:0 0 2px;font-size:1.05em}
.sec .hint{color:var(--soft);font-size:13px;margin:0 0 8px}
.sec textarea{min-height:88px;border:none;background:#fdfcf9;border-radius:10px}
.sec textarea:focus{outline:1px solid var(--sky)}
.oneliner{font-size:17px}
</style>
</head>
<body>
<div id="gate"></div>
<div id="app" style="display:none"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<script src="/xwei/xwei.js"></script>
<script>
var SECTIONS = [
  {k: "work",     t: "Work",              h: "The kind of work I want to do, the people I want to work with, the career I want to live"},
  {k: "rhythm",   t: "Daily Rhythm",      h: "How a day, and a week, should go — when to be busy, when to slow down"},
  {k: "home",     t: "Home",              h: "Which city, what kind of home (this pairs with the Digital Home page)"},
  {k: "health",   t: "Body",              h: "The energy and health I want to keep, and how I take care of myself"},
  {k: "people",   t: "People Around Me",  h: "Who I share my life with, and how we treat each other — friends and family included"},
  {k: "places",   t: "Places to See",     h: "Places I want to go, lives I want to glimpse"},
  {k: "become",   t: "Who I Want to Become", h: "Beyond titles and achievements — the person I want to be"},
  {k: "tenYears", t: "In Ten Years",      h: "An ordinary morning, ten years from now: where am I, and what do I do first?"}
];
var life = {oneLiner: "", sections: {}}, saveT = null;
var $ = function(s){ return document.querySelector(s); };

function buildUI(){
  $("#app").innerHTML =
    '<div class="topbar"><div class="wrap" style="padding-top:0;padding-bottom:0">' +
      '<a href="/xwei/" style="text-decoration:none">← Secret Garden</a>' +
      '<span class="brand">🌿 My Life in a Few Years?</span><span class="sp"></span>' +
      '<span class="saved" id="saved"></span>' +
      '<button class="linkbtn" id="signOut">Sign out</button>' +
    '</div></div>' +
    '<div class="wrap">' +
      '<h1 class="page">A Sketch of the Life I Want</h1>' +
      '<p class="sub">It doesn’t have to be complete, or even clear. Add to it whenever a piece comes into focus — this portrait grows slowly, in its own time.</p>' +
      '<div id="rulesHint" class="rules-hint" style="display:none">' +
        '<b>One last step:</b> the database rules don’t include this garden yet, so nothing can be saved. ' +
        'Open the Firebase console → project x-planner-99dd3 → Firestore Database → Rules, replace the rules with the version below, click Publish, then come back and refresh:' +
        '<pre>rules_version = \'2\';\n' +
        'service cloud.firestore {\n' +
        '  match /databases/{database}/documents {\n' +
        '    match /planners/{uid} {\n' +
        '      allow read, write: if request.auth != null &amp;&amp; request.auth.uid == uid;\n' +
        '    }\n' +
        '    match /eatwell/{uid} {\n' +
        '      allow read, write: if request.auth != null &amp;&amp; request.auth.uid == uid;\n' +
        '    }\n' +
        '    // Public per-university visit counters. Docs may ONLY contain {visits}.\n' +
        '    match /uni_visits/{slug} {\n' +
        '      allow read: if true;\n' +
        '      allow create: if request.resource.data.keys().hasOnly([\'visits\']) &amp;&amp; (request.resource.data.visits == 0 || request.resource.data.visits == 1);\n' +
        '      allow update: if request.resource.data.keys().hasOnly([\'visits\']) &amp;&amp; request.resource.data.visits == resource.data.visits + 1;\n' +
        '    }\n' +
        '    match /xwei/{uid} {\n' +
        '      allow read, write: if request.auth != null &amp;&amp; request.auth.uid == uid;\n' +
        '    }\n' +
        '  }\n' +
        '}</pre>' +
      '</div>' +
      '<div class="sec">' +
        '<h3>The One-Sentence Version</h3>' +
        '<p class="hint">If it had to be one sentence: the life I want is…</p>' +
        '<input type="text" class="oneliner" id="oneLiner" placeholder="Write it here">' +
      '</div>' +
      '<div id="sections"></div>' +
      '<footer>No deadline. This portrait takes as long as it takes.</footer>' +
    '</div>';
}

function persist(){
  clearTimeout(saveT);
  saveT = setTimeout(function(){
    XW.save("life", life).then(function(){
      $("#saved").textContent = "Saved ✓";
    }).catch(function(){
      $("#saved").textContent = "Couldn’t save (see the note above)";
    });
  }, 700);
}

function render(){
  $("#oneLiner").value = life.oneLiner || "";
  var box = $("#sections"); box.innerHTML = "";
  SECTIONS.forEach(function(s){
    var d = document.createElement("div"); d.className = "sec";
    var h = document.createElement("h3"); h.textContent = s.t;
    var p = document.createElement("p"); p.className = "hint"; p.textContent = s.h;
    var ta = document.createElement("textarea");
    ta.value = (life.sections && life.sections[s.k]) || "";
    ta.placeholder = "Write whatever comes — it doesn’t have to be complete…";
    ta.addEventListener("input", function(){
      life.sections = life.sections || {};
      life.sections[s.k] = ta.value; persist();
    });
    d.appendChild(h); d.appendChild(p); d.appendChild(ta);
    box.appendChild(d);
  });
}

XW.boot(function(){
  buildUI();
  XW.load().then(function(data){
    if(data.life) life = data.life;
    life.sections = life.sections || {};
    render();
  }).catch(function(){
    $("#saved").textContent = "Couldn’t load (see the note above)";
    render();
  });
  $("#oneLiner").addEventListener("input", function(){
    life.oneLiner = $("#oneLiner").value; persist();
  });
});
</script>
</body>
</html>
