<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Xinyuan’s Secret Garden</title>
<link rel="stylesheet" href="/xwei/xwei.css">
</head>
<body>
<div id="gate"></div>
<div id="app" style="display:none"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<script src="/xwei/xwei.js"></script>
<script>
XW.boot(function(){
  var cards = XW.hubCards().map(function(c){
    return '<a class="xcard" href="' + c.href + '">' +
      '<div class="em">' + c.em + '</div>' +
      '<h3>' + XW.esc(c.name) + '</h3>' +
      '<p>' + XW.esc(c.desc) + '</p></a>';
  }).join("");
  document.querySelector("#app").innerHTML =
    '<div class="topbar"><div class="wrap" style="padding-top:0;padding-bottom:0">' +
      '<span class="brand">🏡 Xinyuan’s Secret Garden</span><span class="sp"></span>' +
      '<button class="linkbtn" id="signOut">Sign out</button>' +
    '</div></div>' +
    '<div class="wrap">' +
      '<h1 class="page">Xinyuan’s Secret Garden</h1>' +
      '<div class="cards">' + cards + '</div>' +
      '<footer>Xinyuan’s Secret Garden · this page only exists after you sign in</footer>' +
    '</div>';
});
</script>
</body>
</html>
