<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Digital Twins · Xinyuan’s Secret Garden</title>
<link rel="stylesheet" href="/xwei/xwei.css">
<style>
.swrap{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}
@media (max-width:820px){.swrap{grid-template-columns:1fr}}
.srow{display:flex;gap:10px;align-items:center;margin:12px 0;flex-wrap:wrap}
.srow label{font-size:13px;font-weight:700;color:var(--soft)}
.gifimg{max-width:320px;border:1px solid var(--line);border-radius:12px}
.savedgrid{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px}
.saveditem{text-align:center;width:110px}
.saveditem .thumb{width:110px;height:110px}
.saveditem .ops{font-size:12px;margin-top:4px}
</style>
</head>
<body>
<div id="gate"></div>
<div id="app" style="display:none"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
<script src="/xwei/xwei.js"></script>
<script>
var $ = function(s){ return document.querySelector(s); };
var SIZE = 320, srcCanvas = null, gifBlob = null, myStickers = [];

function buildUI(){
  $("#app").innerHTML =
    '<div class="topbar"><div class="wrap" style="padding-top:0;padding-bottom:0">' +
      '<a href="/xwei/" style="text-decoration:none">← Secret Garden</a>' +
      '<span class="brand">👯 Digital Twins</span><span class="sp"></span>' +
      '<span class="saved" id="saved"></span>' +
      '<button class="linkbtn" id="signOut">Sign out</button>' +
    '</div></div>' +
    '<div class="wrap">' +
      '<h1 class="page">My Digital Twins</h1>' +
      '<p class="sub">Pick a photo, add a caption, choose a motion — out comes an animated GIF twin. Your photo is processed right here on your device; nothing is uploaded unless you tap Save.</p>' +
      '<div id="rulesHint" class="rules-hint" style="display:none">' +
        '<b>One last step:</b> the database rules don’t include this garden yet, so nothing can be saved. ' +
        'Open the Firebase console → project x-planner-99dd3 → Firestore Database → Rules, replace the rules with the version below, click Publish, then come back and refresh:' +
        '<pre>rules_version = \'2\';\n' +
        'service cloud.firestore {\n' +
        '  match /databases/{database}/documents {\n' +
        '    match /planners/{uid} {\n' +
        '      allow read, write: if request.auth != null &amp;&amp; request.auth.uid == uid;\n' +
        '    }\n' +
        '    match /eatwell/{uid} {\n' +
        '      allow read, write: if request.auth != null &amp;&amp; request.auth.uid == uid;\n' +
        '    }\n' +
        '    // Public per-university visit counters. Docs may ONLY contain {visits}.\n' +
        '    match /uni_visits/{slug} {\n' +
        '      allow read: if true;\n' +
        '      allow create: if request.resource.data.keys().hasOnly([\'visits\']) &amp;&amp; (request.resource.data.visits == 0 || request.resource.data.visits == 1);\n' +
        '      allow update: if request.resource.data.keys().hasOnly([\'visits\']) &amp;&amp; request.resource.data.visits == resource.data.visits + 1;\n' +
        '    }\n' +
        '    match /xwei/{uid} {\n' +
        '      allow read, write: if request.auth != null &amp;&amp; request.auth.uid == uid;\n' +
        '    }\n' +
        '  }\n' +
        '}</pre>' +
      '</div>' +
      '<div class="swrap">' +
        '<div class="panel" style="margin-top:0">' +
          '<div class="srow">' +
            '<label for="file">Photo</label>' +
            '<input type="file" id="file" accept="image/*" style="flex:1">' +
          '</div>' +
          '<canvas id="cv" class="sticker" width="320" height="320"></canvas>' +
          '<div class="srow">' +
            '<label for="cap">Caption</label>' +
            '<input type="text" id="cap" placeholder="e.g. Got it!">' +
          '</div>' +
          '<div class="srow">' +
            '<label for="anim">Motion</label>' +
            '<select id="anim" style="width:auto;flex:1">' +
              '<option value="bounce">Bounce</option>' +
              '<option value="wiggle">Wiggle</option>' +
              '<option value="breathe">Breathe (scale)</option>' +
              '<option value="spin">Spin</option>' +
            '</select>' +
          '</div>' +
          '<div class="srow">' +
            '<button class="btn primary small" id="gen" style="width:auto">Generate GIF</button>' +
            '<span class="saved" id="genMsg"></span>' +
          '</div>' +
          '<div id="result" style="display:none">' +
            '<img id="gifImg" class="gifimg" alt="Your digital twin">' +
            '<div class="srow">' +
              '<a class="btn primary small" id="dl" download="my-twin.gif" style="text-decoration:none;width:auto">Download GIF</a>' +
              '<button class="btn ghost small" id="saveGif" style="width:auto">Save to My Twins</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div>' +
          '<h3 style="margin-top:0">My Saved Twins</h3>' +
          '<p class="sub" id="noneSaved">None saved yet. Make one and tap “Save to My Twins” — it will be here on any device you sign in with.</p>' +
          '<div class="savedgrid" id="savedGrid"></div>' +
        '</div>' +
      '</div>' +
    '</div>';
}

function fitSource(img){
  var c = document.createElement("canvas");
  var scale = Math.min(1, 480 / Math.max(img.naturalWidth, img.naturalHeight));
  c.width = Math.round(img.naturalWidth * scale);
  c.height = Math.round(img.naturalHeight * scale);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c;
}

function drawFrame(ctx, phase){
  ctx.clearRect(0, 0, SIZE, SIZE);
  ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, SIZE, SIZE);
  if(!srcCanvas){
    ctx.fillStyle = "#93a3b8"; ctx.font = "600 17px sans-serif"; ctx.textAlign = "center";
    ctx.fillText("Pick a photo first", SIZE/2, SIZE/2 - 6);
    ctx.font = "13px sans-serif";
    ctx.fillText("It will appear here — moving", SIZE/2, SIZE/2 + 20);
    return;
  }
  var anim = $("#anim").value;
  ctx.save();
  ctx.translate(SIZE/2, SIZE/2);
  if(anim === "bounce") ctx.translate(0, -Math.abs(Math.sin(phase * Math.PI * 2)) * 16);
  if(anim === "wiggle") ctx.rotate(Math.sin(phase * Math.PI * 2) * 0.09);
  if(anim === "breathe"){ var s = 1 + Math.sin(phase * Math.PI * 2) * 0.05; ctx.scale(s, s); }
  if(anim === "spin") ctx.rotate(phase * Math.PI * 2);
  var sc = Math.max(SIZE / srcCanvas.width, SIZE / srcCanvas.height) * 1.02;
  // spinning needs headroom so corners don't show
  if(anim === "spin") sc *= 1.45;
  ctx.drawImage(srcCanvas, -srcCanvas.width * sc / 2, -srcCanvas.height * sc / 2,
    srcCanvas.width * sc, srcCanvas.height * sc);
  ctx.restore();
  var cap = $("#cap").value.trim();
  if(cap){
    ctx.font = "700 30px sans-serif"; ctx.textAlign = "center";
    ctx.lineWidth = 7; ctx.strokeStyle = "rgba(0,0,0,.75)";
    ctx.strokeText(cap, SIZE/2, SIZE - 18);
    ctx.fillStyle = "#fff"; ctx.fillText(cap, SIZE/2, SIZE - 18);
  }
}

function makeGif(){
  var msg = $("#genMsg");
  if(!srcCanvas){ msg.textContent = "Pick a photo before generating."; return; }
  if(typeof GIF === "undefined"){
    msg.textContent = "The GIF maker didn’t load — check your connection and refresh.";
    return;
  }
  msg.textContent = "Generating…";
  $("#gen").disabled = true;
  fetch("https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js")
    .then(function(r){ return r.text(); })
    .then(function(code){
      var wurl = URL.createObjectURL(new Blob([code], {type: "application/javascript"}));
      var gif = new GIF({workers: 2, quality: 12, width: SIZE, height: SIZE, workerScript: wurl});
      var off = document.createElement("canvas");
      off.width = SIZE; off.height = SIZE;
      var octx = off.getContext("2d");
      var FRAMES = 16;
      for(var i = 0; i < FRAMES; i++){
        drawFrame(octx, i / FRAMES);
        gif.addFrame(octx, {copy: true, delay: 70});
      }
      gif.on("finished", function(blob){
        gifBlob = blob;
        $("#gifImg").src = URL.createObjectURL(blob);
        $("#dl").href = $("#gifImg").src;
        $("#result").style.display = "";
        $("#gen").disabled = false;
        msg.textContent = "Done! Download it, or save it to your twins.";
        URL.revokeObjectURL(wurl);
      });
      gif.render();
    })
    .catch(function(){
      $("#gen").disabled = false;
      msg.textContent = "The GIF maker couldn’t load — check your connection and try again.";
    });
}

function renderSaved(){
  var grid = $("#savedGrid"); grid.innerHTML = "";
  $("#noneSaved").style.display = myStickers.length ? "none" : "";
  myStickers.slice().reverse().forEach(function(s){
    var d = document.createElement("div"); d.className = "saveditem";
    var im = document.createElement("img");
    im.className = "thumb"; im.src = s.url; im.alt = "My digital twin";
    var ops = document.createElement("div"); ops.className = "ops";
    var a = document.createElement("a");
    a.href = s.url; a.download = "twin.gif"; a.textContent = "Download";
    var del = document.createElement("button");
    del.className = "linkbtn"; del.textContent = "Delete"; del.style.color = "#b3402e";
    del.addEventListener("click", function(){
      if(!confirm("Delete this twin?")) return;
      myStickers = myStickers.filter(function(x){ return x.id !== s.id; });
      XW.save("stickers", myStickers).then(renderSaved);
      try{ XW.storage().ref(s.path).delete(); }catch(e){}
    });
    ops.appendChild(a); ops.appendChild(document.createTextNode(" · ")); ops.appendChild(del);
    d.appendChild(im); d.appendChild(ops);
    grid.appendChild(d);
  });
}

XW.boot(function(){
  buildUI();

  var cv = $("#cv"), ctx = cv.getContext("2d");
  (function loop(ts){
    drawFrame(ctx, ((ts || 0) % 1400) / 1400);
    requestAnimationFrame(loop);
  })(0);

  $("#file").addEventListener("change", function(){
    var f = $("#file").files[0]; if(!f) return;
    var img = new Image();
    img.onload = function(){
      srcCanvas = fitSource(img);
      URL.revokeObjectURL(img.src);
    };
    img.src = URL.createObjectURL(f);
  });
  $("#gen").addEventListener("click", makeGif);

  $("#saveGif").addEventListener("click", function(){
    if(!gifBlob) return;
    var btn = $("#saveGif"); btn.disabled = true;
    var id = XW.uid();
    var path = "users/" + XW.user().uid + "/stickers/" + id + ".gif";
    XW.storage().ref(path).put(gifBlob)
      .then(function(snap){ return snap.ref.getDownloadURL(); })
      .then(function(url){
        myStickers.push({id: id, url: url, path: path, created: Date.now()});
        return XW.save("stickers", myStickers);
      })
      .then(function(){
        btn.disabled = false;
        renderSaved();
        $("#saved").textContent = "Saved ✓ — here on any device you sign in with";
      })
      .catch(function(){
        btn.disabled = false;
        $("#saved").textContent = "Couldn’t save (see the note above, or check your connection)";
      });
  });

  XW.load().then(function(data){
    myStickers = Array.isArray(data.stickers) ? data.stickers : [];
    renderSaved();
  }).catch(function(){
    $("#saved").textContent = "Couldn’t load (see the note above)";
  });
});
</script>
</body>
</html>
