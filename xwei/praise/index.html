<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>赞美日记 · Xinyuan’s Secret Garden</title>
<link rel="stylesheet" href="/xwei/xwei.css">
<style>
.dnav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 4px}
.dnav input[type=date]{width:auto;padding:7px 10px;font-size:13.5px}
.dateTitle{font-size:1.55em;margin:.15em 0 .05em}
.verse{background:var(--warm);border:1px solid #f0e2c8;border-radius:14px;padding:16px 18px;margin:14px 0}
.verse .vlab{font-size:12px;font-weight:700;letter-spacing:.08em;color:#b07a2a;margin-bottom:6px}
.verse .vtext{font-size:16.5px;line-height:1.8}
.verse .vref{text-align:right;color:var(--soft);font-size:13.5px;margin-top:6px}
.peditor{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}
.peditor textarea{min-height:260px;border:none;padding:6px 2px;font-size:15.5px}
.peditor textarea:focus{outline:none}
.prow{display:flex;gap:10px;align-items:center;margin-top:10px}
.plist{margin-top:8px}
.pitem{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;font-family:inherit;margin-bottom:8px}
.pitem:hover{background:#fffaf2}
.pitem.on{border-color:#e8cf9f;background:#fffaf2}
.pitem b{font-size:14px;color:var(--ink)}
.pitem span{display:block;font-size:12.5px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
</style>
</head>
<body>
<div id="gate"></div>
<div id="app" style="display:none"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<script src="/xwei/xwei.js"></script>
<script>
/* 每日经文（NIV 英文）。按日期取一节：同一天打开都是同一节，第二天换新的一节。 */
var VERSES = [
  {t:"The Lord has done it this very day; let us rejoice today and be glad.", r:"Psalm 118:24"},
  {t:"I will extol the Lord at all times; his praise will always be on my lips.", r:"Psalm 34:1"},
  {t:"Enter his gates with thanksgiving and his courts with praise; give thanks to him and praise his name.", r:"Psalm 100:4"},
  {t:"The Lord is my shepherd, I lack nothing.", r:"Psalm 23:1"},
  {t:"God is our refuge and strength, an ever-present help in trouble.", r:"Psalm 46:1"},
  {t:"Let the morning bring me word of your unfailing love, for I have put my trust in you. Show me the way I should go, for to you I entrust my life.", r:"Psalm 143:8"},
  {t:"I lift up my eyes to the mountains— where does my help come from? My help comes from the Lord, the Maker of heaven and earth.", r:"Psalm 121:1-2"},
  {t:"You make known to me the path of life; you will fill me with joy in your presence, with eternal pleasures at your right hand.", r:"Psalm 16:11"},
  {t:"Take delight in the Lord, and he will give you the desires of your heart.", r:"Psalm 37:4"},
  {t:"I praise you because I am fearfully and wonderfully made; your works are wonderful, I know that full well.", r:"Psalm 139:14"},
  {t:"That person is like a tree planted by streams of water, which yields its fruit in season and whose leaf does not wither— whatever they do prospers.", r:"Psalm 1:3"},
  {t:"The Lord is my light and my salvation— whom shall I fear? The Lord is the stronghold of my life— of whom shall I be afraid?", r:"Psalm 27:1"},
  {t:"You crown the year with your bounty, and your carts overflow with abundance.", r:"Psalm 65:11"},
  {t:"Teach us to number our days, that we may gain a heart of wisdom.", r:"Psalm 90:12"},
  {t:"May these words of my mouth and this meditation of my heart be pleasing in your sight, Lord, my Rock and my Redeemer.", r:"Psalm 19:14"},
  {t:"So do not fear, for I am with you; do not be dismayed, for I am your God. I will strengthen you and help you; I will uphold you with my righteous right hand.", r:"Isaiah 41:10"},
  {t:"But those who hope in the Lord will renew their strength. They will soar on wings like eagles; they will run and not grow weary, they will walk and not be faint.", r:"Isaiah 40:31"},
  {t:"For I know the plans I have for you, declares the Lord, plans to prosper you and not to harm you, plans to give you hope and a future.", r:"Jeremiah 29:11"},
  {t:"Trust in the Lord with all your heart and lean not on your own understanding.", r:"Proverbs 3:5"},
  {t:"Commit to the Lord whatever you do, and he will establish your plans.", r:"Proverbs 16:3"},
  {t:"Have I not commanded you? Be strong and courageous. Do not be afraid; do not be discouraged, for the Lord your God will be with you wherever you go.", r:"Joshua 1:9"},
  {t:"The Lord himself goes before you and will be with you; he will never leave you nor forsake you. Do not be afraid; do not be discouraged.", r:"Deuteronomy 31:8"},
  {t:"Come to me, all you who are weary and burdened, and I will give you rest.", r:"Matthew 11:28"},
  {t:"But seek first his kingdom and his righteousness, and all these things will be given to you as well.", r:"Matthew 6:33"},
  {t:"And we know that in all things God works for the good of those who love him, who have been called according to his purpose.", r:"Romans 8:28"},
  {t:"Be joyful in hope, patient in affliction, faithful in prayer.", r:"Romans 12:12"},
  {t:"I can do all this through him who gives me strength.", r:"Philippians 4:13"},
  {t:"Do not be anxious about anything, but in every situation, by prayer and petition, with thanksgiving, present your requests to God. And the peace of God, which transcends all understanding, will guard your hearts and your minds in Christ Jesus.", r:"Philippians 4:6-7"},
  {t:"Being confident of this, that he who began a good work in you will carry it on to completion until the day of Christ Jesus.", r:"Philippians 1:6"},
  {t:"Rejoice always, pray continually, give thanks in all circumstances; for this is God's will for you in Christ Jesus.", r:"1 Thessalonians 5:16-18"},
  {t:"But he said to me, My grace is sufficient for you, for my power is made perfect in weakness.", r:"2 Corinthians 12:9"},
  {t:"So whether you eat or drink or whatever you do, do it all for the glory of God.", r:"1 Corinthians 10:31"},
  {t:"Now faith is confidence in what we hope for and assurance about what we do not see.", r:"Hebrews 11:1"},
  {t:"We love because he first loved us.", r:"1 John 4:19"},
  {t:"For God so loved the world that he gave his one and only Son, that whoever believes in him shall not perish but have eternal life.", r:"John 3:16"},
  {t:"I am the vine; you are the branches. If you remain in me and I in you, you will bear much fruit; apart from me you can do nothing.", r:"John 15:5"},
  {t:"Every good and perfect gift is from above, coming down from the Father of the heavenly lights, who does not change like shifting shadows.", r:"James 1:17"},
  {t:"He has shown you, O mortal, what is good. And what does the Lord require of you? To act justly and to love mercy and to walk humbly with your God.", r:"Micah 6:8"},
  {t:"Create in me a pure heart, O God, and renew a steadfast spirit within me.", r:"Psalm 51:10"},
  {t:"Yet I will rejoice in the Lord, I will be joyful in God my Savior.", r:"Habakkuk 3:18"},
  {t:"He has made everything beautiful in its time. He has also set eternity in the human heart.", r:"Ecclesiastes 3:11"},
  {t:"But the fruit of the Spirit is love, joy, peace, forbearance, kindness, goodness, faithfulness, gentleness and self-control.", r:"Galatians 5:22-23"}
];

var praise = {}, curKey = "", saveT = null;
var $ = function(s){ return document.querySelector(s); };
var WK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];

function pad(n){ return String(n).padStart(2,"0"); }
function keyOf(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
function todayKey(){ return keyOf(new Date()); }
function parseKey(k){ var p = k.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function shiftKey(k, days){ var d = parseKey(k); d.setDate(d.getDate()+days); return keyOf(d); }
function fmtTitle(k){
  var d = parseKey(k);
  return d.getFullYear() + "年" + (d.getMonth()+1) + "月" + d.getDate() + "日 · " + WK[d.getDay()];
}
function fmtShort(k){
  var d = parseKey(k);
  return (d.getMonth()+1) + "月" + d.getDate() + "日 · " + WK[d.getDay()];
}
function stamp(ts){
  var d = new Date(ts);
  return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate() + " " +
    String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}
function verseFor(k){
  var h = 0;
  for(var i = 0; i < k.length; i++){ h = (h * 31 + k.charCodeAt(i)) >>> 0; }
  return VERSES[h % VERSES.length];
}

function buildUI(){
  $("#app").innerHTML =
    '<div class="topbar"><div class="wrap" style="padding-top:0;padding-bottom:0">' +
      '<a href="/xwei/" style="text-decoration:none">← Secret Garden</a>' +
      '<span class="brand">🙏 赞美日记</span><span class="sp"></span>' +
      '<span class="saved" id="saved"></span>' +
      '<button class="linkbtn" id="signOut">Sign out</button>' +
    '</div></div>' +
    '<div class="wrap">' +
      '<div id="rulesHint" class="rules-hint" style="display:none">' +
        '<b>One last step:</b> the database rules don’t include this garden yet, so nothing can be saved. ' +
        'Open the Firebase console → project x-planner-99dd3 → Firestore Database → Rules, replace the rules with the version below, click Publish, then come back and refresh:' +
        '<pre>rules_version = \'2\';\n' +
        'service cloud.firestore {\n' +
        '  match /databases/{database}/documents {\n' +
        '    match /planners/{uid} {\n' +
        '      allow read, write: if request.auth != null &amp;&amp; request.auth.uid == uid;\n' +
        '    }\n' +
        '    match /eatwell/{uid} {\n' +
        '      allow read, write: if request.auth != null &amp;&amp; request.auth.uid == uid;\n' +
        '    }\n' +
        '    // Public per-university visit counters. Docs may ONLY contain {visits}.\n' +
        '    match /uni_visits/{slug} {\n' +
        '      allow read: if true;\n' +
        '      allow create: if request.resource.data.keys().hasOnly([\'visits\']) &amp;&amp; (request.resource.data.visits == 0 || request.resource.data.visits == 1);\n' +
        '      allow update: if request.resource.data.keys().hasOnly([\'visits\']) &amp;&amp; request.resource.data.visits == resource.data.visits + 1;\n' +
        '    }\n' +
        '    match /xwei/{uid} {\n' +
        '      allow read, write: if request.auth != null &amp;&amp; request.auth.uid == uid;\n' +
        '    }\n' +
        '  }\n' +
        '}</pre>' +
      '</div>' +
      '<h1 class="page">🙏 赞美日记</h1>' +
      '<p class="sub">每天打开，都是新的一页。</p>' +
      '<div class="dnav">' +
        '<button class="btn small" id="prevDay">‹ 前一天</button>' +
        '<button class="btn small" id="todayBtn">回到今天</button>' +
        '<button class="btn small" id="nextDay">后一天 ›</button>' +
        '<input type="date" id="datePick">' +
      '</div>' +
      '<div class="dateTitle" id="dateTitle"></div>' +
      '<div class="verse" id="verseBox"></div>' +
      '<div class="peditor">' +
        '<textarea id="diaryText" placeholder="今天，值得赞美的事是……"></textarea>' +
        '<div class="prow">' +
          '<button class="btn primary small" id="saveBtn" style="width:auto">保存</button>' +
          '<span class="saved" id="saveState"></span>' +
        '</div>' +
      '</div>' +
      '<h3 style="margin:26px 0 6px">往日日记</h3>' +
      '<div class="plist" id="pastList"></div>' +
      '<p class="sub" id="pastEmpty">还没有写过日记。今天就是第一天。</p>' +
    '</div>';
}

function renderPast(){
  var keys = Object.keys(praise).filter(function(k){
    return praise[k] && (praise[k].text || "").trim();
  }).sort().reverse();
  var box = $("#pastList"); box.innerHTML = "";
  $("#pastEmpty").style.display = keys.length ? "none" : "";
  keys.forEach(function(k){
    var b = document.createElement("button");
    b.className = "pitem" + (k === curKey ? " on" : "");
    b.innerHTML = "<b>" + fmtShort(k) + (k === todayKey() ? "（今天）" : "") + "</b><span>" +
      XW.esc((praise[k].text || "").split("\n")[0].slice(0, 60)) + "</span>";
    b.addEventListener("click", function(){ goDay(k); });
    box.appendChild(b);
  });
}
function render(){
  var v = verseFor(curKey);
  $("#dateTitle").textContent = fmtTitle(curKey);
  $("#verseBox").innerHTML =
    '<div class="vlab">今日经文</div>' +
    '<div class="vtext">' + XW.esc(v.t) + '</div>' +
    '<div class="vref">—— ' + XW.esc(v.r) + ' (NIV)</div>';
  var e = praise[curKey];
  $("#diaryText").value = e ? (e.text || "") : "";
  $("#datePick").value = curKey;
  $("#datePick").max = todayKey();
  $("#nextDay").disabled = curKey >= todayKey();
  $("#todayBtn").disabled = curKey === todayKey();
  $("#saveState").textContent = e && e.updated ? "上次保存 " + stamp(e.updated) : "";
  renderPast();
}
function goDay(k){ curKey = k; render(); window.scrollTo({top: 0, behavior: "smooth"}); }

function persist(now){
  var doSave = function(){
    XW.save("praise", praise).then(function(){
      $("#saved").textContent = "Saved ✓ " + stamp(Date.now());
      $("#saveState").textContent = "已保存 ✓ " + stamp(Date.now());
    }).catch(function(){
      $("#saved").textContent = "没存上 — 检查一下网络";
      $("#saveState").textContent = "没存上 — 检查一下网络，再点一次保存";
    });
  };
  if(now){ clearTimeout(saveT); doSave(); return; }
  clearTimeout(saveT);
  saveT = setTimeout(doSave, 900);
}

XW.boot(function(){
  curKey = todayKey();
  buildUI();
  XW.load().then(function(data){
    praise = (data && data.praise && typeof data.praise === "object") ? data.praise : {};
    render();
  }).catch(function(){
    $("#saved").textContent = "没加载出来 — 检查一下网络";
    render();
  });
  $("#diaryText").addEventListener("input", function(){
    praise[curKey] = { text: $("#diaryText").value, updated: Date.now() };
    renderPast();
    persist(false);
  });
  $("#saveBtn").addEventListener("click", function(){
    praise[curKey] = { text: $("#diaryText").value, updated: Date.now() };
    persist(true);
  });
  $("#prevDay").addEventListener("click", function(){ goDay(shiftKey(curKey, -1)); });
  $("#nextDay").addEventListener("click", function(){ if(curKey < todayKey()) goDay(shiftKey(curKey, 1)); });
  $("#todayBtn").addEventListener("click", function(){ goDay(todayKey()); });
  $("#datePick").addEventListener("change", function(){
    var v = $("#datePick").value;
    if(v && v <= todayKey()) goDay(v);
  });
});
</script>
</body>
</html>
