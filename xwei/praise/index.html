<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>赞美日记 · Xinyuan’s Secret Garden</title>
<link rel="stylesheet" href="/xwei/xwei.css">
<style>
.dnav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 4px}
.dnav input[type=date]{width:auto;padding:7px 10px;font-size:13.5px}
.dateTitle{font-size:1.55em;margin:.15em 0 .05em}
.verse{background:var(--warm);border:1px solid #f0e2c8;border-radius:14px;padding:16px 18px;margin:14px 0}
.verse .vlab{font-size:12px;font-weight:700;letter-spacing:.08em;color:#b07a2a;margin-bottom:6px}
.verse .vtext{font-size:16.5px;line-height:1.8}
.verse .vref{text-align:right;color:var(--soft);font-size:13.5px;margin-top:6px}
.peditor{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}
.peditor textarea{min-height:260px;border:none;padding:6px 2px;font-size:15.5px}
.peditor textarea:focus{outline:none}
.prow{display:flex;gap:10px;align-items:center;margin-top:10px}
.plist{margin-top:8px}
.pitem{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;font-family:inherit;margin-bottom:8px}
.pitem:hover{background:#fffaf2}
.pitem.on{border-color:#e8cf9f;background:#fffaf2}
.pitem b{font-size:14px;color:var(--ink)}
.pitem span{display:block;font-size:12.5px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
</style>
</head>
<body>
<div id="gate"></div>
<div id="app" style="display:none"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<script src="/xwei/xwei.js"></script>
<script>
/* 每日经文（和合本）。按日期取一节：同一天打开都是同一节，第二天换新的一节。 */
var VERSES = [
  {t:"这是耶和华所定的日子，我们在其中要高兴欢喜！", r:"诗篇 118:24"},
  {t:"我要时时称颂耶和华；赞美他的话必常在我口中。", r:"诗篇 34:1"},
  {t:"当称谢进入他的门；当赞美进入他的院。当感谢他，称颂他的名！", r:"诗篇 100:4"},
  {t:"耶和华是我的牧者，我必不致缺乏。", r:"诗篇 23:1"},
  {t:"神是我们的避难所，是我们的力量，是我们在患难中随时的帮助。", r:"诗篇 46:1"},
  {t:"求你使我清晨得听你慈爱之言，因为我倚靠你；求你使我知道当行的路，因我的心仰望你。", r:"诗篇 143:8"},
  {t:"我要向山举目；我的帮助从何而来？我的帮助从造天地的耶和华而来。", r:"诗篇 121:1-2"},
  {t:"你必将生命的道路指示我。在你面前有满足的喜乐；在你右手中有永远的福乐。", r:"诗篇 16:11"},
  {t:"又要以耶和华为乐，他就将你心里所求的赐给你。", r:"诗篇 37:4"},
  {t:"我要称谢你，因我受造，奇妙可畏；你的作为奇妙，这是我心深知道的。", r:"诗篇 139:14"},
  {t:"要像一棵树栽在溪水旁，按时候结果子，叶子也不枯干。凡他所做的尽都顺利。", r:"诗篇 1:3"},
  {t:"耶和华是我的亮光，是我的拯救，我还怕谁呢？耶和华是我性命的保障，我还惧谁呢？", r:"诗篇 27:1"},
  {t:"你以恩典为年岁的冠冕；你的路径都滴下脂油。", r:"诗篇 65:11"},
  {t:"求你指教我们怎样数算自己的日子，好叫我们得着智慧的心。", r:"诗篇 90:12"},
  {t:"耶和华我的磐石，我的救赎主啊，愿我口中的言语、心里的意念在你面前蒙悦纳。", r:"诗篇 19:14"},
  {t:"你不要害怕，因为我与你同在；不要惊惶，因为我是你的神。我必坚固你，我必帮助你，我必用我公义的右手扶持你。", r:"以赛亚书 41:10"},
  {t:"但那等候耶和华的必重新得力。他们必如鹰展翅上腾；他们奔跑却不困倦，行走却不疲乏。", r:"以赛亚书 40:31"},
  {t:"耶和华说：我知道我向你们所怀的意念，是赐平安的意念，不是降灾祸的意念，要叫你们末后有指望。", r:"耶利米书 29:11"},
  {t:"你要专心仰赖耶和华，不可倚靠自己的聪明。", r:"箴言 3:5"},
  {t:"你所做的，要交托耶和华，你所谋的，就必成立。", r:"箴言 16:3"},
  {t:"我岂没有吩咐你吗？你当刚强壮胆！不要惧怕，也不要惊惶，因为你无论往哪里去，耶和华你的神必与你同在。", r:"约书亚记 1:9"},
  {t:"耶和华必在你前面行；他必与你同在，必不撇下你，也不丢弃你。不要惧怕，也不要惊惶。", r:"申命记 31:8"},
  {t:"凡劳苦担重担的人可以到我这里来，我就使你们得安息。", r:"马太福音 11:28"},
  {t:"你们要先求他的国和他的义，这些东西都要加给你们了。", r:"马太福音 6:33"},
  {t:"我们晓得万事都互相效力，叫爱神的人得益处，就是按他旨意被召的人。", r:"罗马书 8:28"},
  {t:"在指望中要喜乐，在患难中要忍耐，祷告要恒切。", r:"罗马书 12:12"},
  {t:"我靠着那加给我力量的，凡事都能做。", r:"腓立比书 4:13"},
  {t:"应当一无挂虑，只要凡事藉着祷告、祈求，和感谢，将你们所要的告诉神。神所赐、出人意外的平安必在基督耶稣里保守你们的心怀意念。", r:"腓立比书 4:6-7"},
  {t:"我深信那在你们心里动了善工的，必成全这工，直到耶稣基督的日子。", r:"腓立比书 1:6"},
  {t:"要常常喜乐，不住地祷告，凡事谢恩；因为这是神在基督耶稣里向你们所定的旨意。", r:"帖撒罗尼迦前书 5:16-18"},
  {t:"他对我说：我的恩典够你用的，因为我的能力是在人的软弱上显得完全。", r:"哥林多后书 12:9"},
  {t:"所以，你们或吃或喝，无论做什么，都要为荣耀神而行。", r:"哥林多前书 10:31"},
  {t:"信就是所望之事的实底，是未见之事的确据。", r:"希伯来书 11:1"},
  {t:"我们爱，因为神先爱我们。", r:"约翰一书 4:19"},
  {t:"神爱世人，甚至将他的独生子赐给他们，叫一切信他的，不至灭亡，反得永生。", r:"约翰福音 3:16"},
  {t:"我是葡萄树，你们是枝子。常在我里面的，我也常在他里面，这人就多结果子；因为离了我，你们就不能做什么。", r:"约翰福音 15:5"},
  {t:"各样美善的恩赐和各样全备的赏赐都是从上头来的，从众光之父那里降下来的。", r:"雅各书 1:17"},
  {t:"世人哪，耶和华已指示你何为善。他向你所要的是什么呢？只要你行公义，好怜悯，存谦卑的心，与你的神同行。", r:"米迦书 6:8"},
  {t:"神啊，求你为我造清洁的心，使我里面重新有正直的灵。", r:"诗篇 51:10"},
  {t:"然而，我要因耶和华欢欣，因救我的神喜乐。", r:"哈巴谷书 3:18"},
  {t:"神造万物，各按其时成为美好，又将永生安置在世人心里。", r:"传道书 3:11"},
  {t:"圣灵所结的果子，就是仁爱、喜乐、和平、忍耐、恩慈、良善、信实、温柔、节制。", r:"加拉太书 5:22-23"}
];

var praise = {}, curKey = "", saveT = null;
var $ = function(s){ return document.querySelector(s); };
var WK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];

function pad(n){ return String(n).padStart(2,"0"); }
function keyOf(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
function todayKey(){ return keyOf(new Date()); }
function parseKey(k){ var p = k.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function shiftKey(k, days){ var d = parseKey(k); d.setDate(d.getDate()+days); return keyOf(d); }
function fmtTitle(k){
  var d = parseKey(k);
  return d.getFullYear() + "年" + (d.getMonth()+1) + "月" + d.getDate() + "日 · " + WK[d.getDay()];
}
function fmtShort(k){
  var d = parseKey(k);
  return (d.getMonth()+1) + "月" + d.getDate() + "日 · " + WK[d.getDay()];
}
function stamp(ts){
  var d = new Date(ts);
  return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate() + " " +
    String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}
function verseFor(k){
  var h = 0;
  for(var i = 0; i < k.length; i++){ h = (h * 31 + k.charCodeAt(i)) >>> 0; }
  return VERSES[h % VERSES.length];
}

function buildUI(){
  $("#app").innerHTML =
    '<div class="topbar"><div class="wrap" style="padding-top:0;padding-bottom:0">' +
      '<a href="/xwei/" style="text-decoration:none">← Secret Garden</a>' +
      '<span class="brand">🙏 赞美日记</span><span class="sp"></span>' +
      '<span class="saved" id="saved"></span>' +
      '<button class="linkbtn" id="signOut">Sign out</button>' +
    '</div></div>' +
    '<div class="wrap">' +
      '<div id="rulesHint" class="rules-hint" style="display:none">' +
        '<b>One last step:</b> the database rules don’t include this garden yet, so nothing can be saved. ' +
        'Open the Firebase console → project x-planner-99dd3 → Firestore Database → Rules, replace the rules with the version below, click Publish, then come back and refresh:' +
        '<pre>rules_version = \'2\';\n' +
        'service cloud.firestore {\n' +
        '  match /databases/{database}/documents {\n' +
        '    match /planners/{uid} {\n' +
        '      allow read, write: if request.auth != null &amp;&amp; request.auth.uid == uid;\n' +
        '    }\n' +
        '    match /eatwell/{uid} {\n' +
        '      allow read, write: if request.auth != null &amp;&amp; request.auth.uid == uid;\n' +
        '    }\n' +
        '    // Public per-university visit counters. Docs may ONLY contain {visits}.\n' +
        '    match /uni_visits/{slug} {\n' +
        '      allow read: if true;\n' +
        '      allow create: if request.resource.data.keys().hasOnly([\'visits\']) &amp;&amp; (request.resource.data.visits == 0 || request.resource.data.visits == 1);\n' +
        '      allow update: if request.resource.data.keys().hasOnly([\'visits\']) &amp;&amp; request.resource.data.visits == resource.data.visits + 1;\n' +
        '    }\n' +
        '    match /xwei/{uid} {\n' +
        '      allow read, write: if request.auth != null &amp;&amp; request.auth.uid == uid;\n' +
        '    }\n' +
        '  }\n' +
        '}</pre>' +
      '</div>' +
      '<h1 class="page">🙏 赞美日记</h1>' +
      '<p class="sub">每天打开，都是新的一页。</p>' +
      '<div class="dnav">' +
        '<button class="btn small" id="prevDay">‹ 前一天</button>' +
        '<button class="btn small" id="todayBtn">回到今天</button>' +
        '<button class="btn small" id="nextDay">后一天 ›</button>' +
        '<input type="date" id="datePick">' +
      '</div>' +
      '<div class="dateTitle" id="dateTitle"></div>' +
      '<div class="verse" id="verseBox"></div>' +
      '<div class="peditor">' +
        '<textarea id="diaryText" placeholder="今天，值得赞美的事是……"></textarea>' +
        '<div class="prow">' +
          '<button class="btn primary small" id="saveBtn" style="width:auto">保存</button>' +
          '<span class="saved" id="saveState"></span>' +
        '</div>' +
      '</div>' +
      '<h3 style="margin:26px 0 6px">往日日记</h3>' +
      '<div class="plist" id="pastList"></div>' +
      '<p class="sub" id="pastEmpty">还没有写过日记。今天就是第一天。</p>' +
    '</div>';
}

function renderPast(){
  var keys = Object.keys(praise).filter(function(k){
    return praise[k] && (praise[k].text || "").trim();
  }).sort().reverse();
  var box = $("#pastList"); box.innerHTML = "";
  $("#pastEmpty").style.display = keys.length ? "none" : "";
  keys.forEach(function(k){
    var b = document.createElement("button");
    b.className = "pitem" + (k === curKey ? " on" : "");
    b.innerHTML = "<b>" + fmtShort(k) + (k === todayKey() ? "（今天）" : "") + "</b><span>" +
      XW.esc((praise[k].text || "").split("\n")[0].slice(0, 60)) + "</span>";
    b.addEventListener("click", function(){ goDay(k); });
    box.appendChild(b);
  });
}
function render(){
  var v = verseFor(curKey);
  $("#dateTitle").textContent = fmtTitle(curKey);
  $("#verseBox").innerHTML =
    '<div class="vlab">今日经文</div>' +
    '<div class="vtext">' + XW.esc(v.t) + '</div>' +
    '<div class="vref">—— ' + XW.esc(v.r) + '（和合本）</div>';
  var e = praise[curKey];
  $("#diaryText").value = e ? (e.text || "") : "";
  $("#datePick").value = curKey;
  $("#datePick").max = todayKey();
  $("#nextDay").disabled = curKey >= todayKey();
  $("#todayBtn").disabled = curKey === todayKey();
  $("#saveState").textContent = e && e.updated ? "上次保存 " + stamp(e.updated) : "";
  renderPast();
}
function goDay(k){ curKey = k; render(); window.scrollTo({top: 0, behavior: "smooth"}); }

function persist(now){
  var doSave = function(){
    XW.save("praise", praise).then(function(){
      $("#saved").textContent = "Saved ✓ " + stamp(Date.now());
      $("#saveState").textContent = "已保存 ✓ " + stamp(Date.now());
    }).catch(function(){
      $("#saved").textContent = "没存上 — 检查一下网络";
      $("#saveState").textContent = "没存上 — 检查一下网络，再点一次保存";
    });
  };
  if(now){ clearTimeout(saveT); doSave(); return; }
  clearTimeout(saveT);
  saveT = setTimeout(doSave, 900);
}

XW.boot(function(){
  curKey = todayKey();
  buildUI();
  XW.load().then(function(data){
    praise = (data && data.praise && typeof data.praise === "object") ? data.praise : {};
    render();
  }).catch(function(){
    $("#saved").textContent = "没加载出来 — 检查一下网络";
    render();
  });
  $("#diaryText").addEventListener("input", function(){
    praise[curKey] = { text: $("#diaryText").value, updated: Date.now() };
    renderPast();
    persist(false);
  });
  $("#saveBtn").addEventListener("click", function(){
    praise[curKey] = { text: $("#diaryText").value, updated: Date.now() };
    persist(true);
  });
  $("#prevDay").addEventListener("click", function(){ goDay(shiftKey(curKey, -1)); });
  $("#nextDay").addEventListener("click", function(){ if(curKey < todayKey()) goDay(shiftKey(curKey, 1)); });
  $("#todayBtn").addEventListener("click", function(){ goDay(todayKey()); });
  $("#datePick").addEventListener("change", function(){
    var v = $("#datePick").value;
    if(v && v <= todayKey()) goDay(v);
  });
});
</script>
</body>
</html>
