var GUIDE_HTML = "<div class=\"toc\"><a href=\"#part-1-choosing-the-research-problem-and\">Part 1</a><a href=\"#part-2-preparing-to-write\">Part 2</a><a href=\"#part-3-the-anatomy-of-a-research-paper\">Part 3</a><a href=\"#part-4-polish-cite-and-stay-honest\">Part 4</a><a href=\"#part-5-common-assignment-types\">Part 5</a><a href=\"#part-6-from-my-secret-garden-resources-a\">Part 6</a><a href=\"#sources-and-links\">Sources and links</a></div>\n<h1 class=\"page\">Writing Guide: Organizing and Writing a Research Paper</h1>\n<p class=\"wg-p\">Compiled on October 8, 2026 from two university library guides (USC Libraries and Sacred Heart University) plus resources saved in Xinyuan's Secret Garden. Everything here is a synthesis in the compiler's own words; each sub-section ends with a link to the original guide page, where the complete original guidance lives. One rule sits above all of this: the requirements of your professor, your target journal, and your institution always win over general advice.</p>\n<h2 class=\"wg-h2\" id=\"part-1-choosing-the-research-problem-and\">Part 1 \u00b7 Choosing the research problem and design</h2>\n<h3 class=\"wg-h3\">From topic to research problem</h3>\n<ul class=\"wg-ul\"><li>A <strong>topic</strong> names an area; a <strong>research problem</strong> names something in that area that needs investigation. A topic is not a problem until it answers \"so what?\" \u2014 why it matters, what would change if it were solved.</li><li>A good problem statement has clarity, defined boundaries, identified key concepts and variables, stated significance, and some generalizability. Avoid value-laden language and unexplained jargon.</li><li>Problem types: difference (comparing groups), descriptive (portraying a situation), relational (how variables move together), and casuist (case-based reasoning).</li><li>Where problems come from: theory, other disciplines, practitioners, personal experience, and \u2014 most often \u2014 gaps spotted in the literature.</li><li><strong>Original page:</strong> <a href=\"https://libguides.usc.edu/writingguide/researchproblem\" target=\"_blank\" rel=\"noopener\">1. Choosing a Research Problem</a> \u00b7 <a href=\"https://libguides.usc.edu/writingguide/introduction/researchproblem\" target=\"_blank\" rel=\"noopener\">The Research Problem/Question</a></li></ul>\n<h3 class=\"wg-h3\">Narrowing a topic that is too broad</h3>\n<ul class=\"wg-ul\"><li>Too-broad topics produce an unmanageable number of sources. Narrow by: one aspect or component of the topic; a place (geography); a relationship between elements; a time period; or a type of source or population.</li><li>Apply one narrowing strategy first, check the result, and only then narrow further \u2014 stacking every move at once over-narrows.</li><li><strong>Original page:</strong> <a href=\"https://libguides.usc.edu/writingguide/narrowtopic\" target=\"_blank\" rel=\"noopener\">Narrowing a Topic Idea</a></li></ul>\n<h3 class=\"wg-h3\">Broadening a topic that is too narrow</h3>\n<ul class=\"wg-ul\"><li>Too-narrow topics yield too little material to write about. Broaden by asking who / what / where / when / how / why around the topic to surface related angles, run a quick initial literature scan, then re-narrow to a workable middle.</li><li><strong>Original page:</strong> <a href=\"https://libguides.usc.edu/writingguide/broadentopic\" target=\"_blank\" rel=\"noopener\">Broadening a Topic Idea</a></li></ul>\n<h3 class=\"wg-h3\">Extending the timeliness of a topic</h3>\n<ul class=\"wg-ul\"><li>Very current events have news coverage but almost no scholarly coverage. Ground them with: comparable historical cases; expert commentary; research-centre reports (watch for institutional bias); congressional hearings and government reports. Pre-prints are not authoritative sources.</li><li><strong>Original page:</strong> <a href=\"https://libguides.usc.edu/writingguide/timelinesstopic\" target=\"_blank\" rel=\"noopener\">Extending the Timeliness of a Topic Idea</a></li></ul>\n<h3 class=\"wg-h3\">Types of research designs</h3>\n<ul class=\"wg-ul\"><li>Let the research problem drive the design, not the other way round. A sound design states the problem, reviews prior literature, states hypotheses or questions, specifies what data are needed and how they will be obtained, and describes the analysis plan.</li><li>The main families: action (practitioner solves a local problem); case study (one case in depth); causal (cause\u2013effect); cohort (a group followed over time); cross-sectional (one snapshot in time); descriptive (portray what is); experimental (manipulate a variable under control); exploratory (early look at a poorly understood problem); field research (study people in natural settings); historical (past records); longitudinal (repeated measures over time); meta-analysis (statistically combine prior studies); mixed-method (qualitative + quantitative); observational (watch without intervening); philosophical (argument and conceptual analysis); photovoice (participants document their world in photos); sequential (one phase builds on the previous); systematic review (exhaustive, protocol-driven literature synthesis).</li><li><strong>Original page:</strong> <a href=\"https://libguides.usc.edu/writingguide/researchdesigns\" target=\"_blank\" rel=\"noopener\">Types of Research Designs</a></li></ul>\n<h3 class=\"wg-h3\">Design flaws to avoid</h3>\n<ul class=\"wg-ul\"><li>Check your design against this list before committing: vagueness in the design itself; an ill-defined problem; a missing theoretical framework; unclear significance; merely summarizing prior work instead of building on it; a narrow, provincial scope; convenience sampling presented as if representative; unclear instruments or statistics; unexplained jargon; unaddressed ethical issues; unstated limitations.</li><li><strong>Original page:</strong> <a href=\"https://libguides.usc.edu/writingguide/designflaws\" target=\"_blank\" rel=\"noopener\">Design Flaws to Avoid</a></li></ul>\n<h3 class=\"wg-h3\">Theoretical framework and hypotheses</h3>\n<ul class=\"wg-ul\"><li>The framework is the theory (or set of theories) that explains why your problem exists. Select it by reviewing the problem, listing the key variables, and comparing candidate theories.</li><li>Make your assumptions explicit; link the framework to your hypotheses and methods; note the framework's own limits; and keep using it through the analysis and discussion \u2014 a framework quoted in the introduction and then abandoned is decoration.</li><li>A hypothesis is a specific, testable prediction; a theory is broader and more established. Not every study needs a hypothesis (descriptive and exploratory work may use research questions instead), but every study needs a framework or an explicit reason for not having one.</li><li><strong>Original page:</strong> <a href=\"https://libguides.usc.edu/writingguide/theoreticalframework\" target=\"_blank\" rel=\"noopener\">Theoretical Framework</a></li></ul>\n<h3 class=\"wg-h3\">Independent and dependent variables</h3>\n<ul class=\"wg-ul\"><li>Independent variable: the presumed cause \u2014 what you manipulate or what varies on its own. Dependent variable: the presumed effect \u2014 what you measure.</li><li>Name both in the introduction; define and operationalize them in the Methodology (exactly how each is measured) so the study is clear and replicable. A quick test: insert your variables into \"changes in X cause changes in Y\" and check the sentence is sensible.</li><li><strong>Original page:</strong> <a href=\"https://libguides.usc.edu/writingguide/variables\" target=\"_blank\" rel=\"noopener\">Independent and Dependent Variables</a></li></ul>\n<h3 class=\"wg-h3\">Background information</h3>\n<ul class=\"wg-ul\"><li>Include just enough context for the reader to grasp the problem: historical, cultural, economic, political, social, and temporal background, plus the foundational prior findings. Background is briefer and more contextual than the literature review \u2014 its job is orientation, not evidence.</li><li><strong>Original page:</strong> <a href=\"https://libguides.usc.edu/writingguide/background\" target=\"_blank\" rel=\"noopener\">Background Information</a></li></ul>\n<h2 class=\"wg-h2\" id=\"part-2-preparing-to-write\">Part 2 \u00b7 Preparing to write</h2>\n<h3 class=\"wg-h3\">Plan and schedule</h3>\n<ul class=\"wg-ul\"><li>Work backwards from the due date and schedule the stages: searching, reading, outlining, drafting, revising, proofreading. Start early; the stages that feel compressible (revision) are where quality is made.</li><li>Read the assignment's framing before writing: is it comparison, definition, descriptive, evaluative, exploratory, interpretive, narrative, persuasive, or a policy memo? The framing decides your structure.</li><li>Default formatting unless told otherwise: 12-point common font, double spacing, 1-inch margins, page numbers.</li><li><strong>Original page:</strong> <a href=\"https://libguides.usc.edu/writingguide/preparingtowrite\" target=\"_blank\" rel=\"noopener\">2. Preparing to Write</a></li></ul>\n<h3 class=\"wg-h3\">Academic writing style</h3>\n<ul class=\"wg-ul\"><li>Formal, third-person, precise, thesis-driven, and evidence-based. Prefer the active voice (passive is fine when the actor genuinely does not matter \u2014 check instructor/journal preference).</li><li>Define abbreviations at first use; avoid contractions, slang, superlatives, vague referents (\"this\", \"it\" with no clear antecedent), wordiness, anecdote-as-evidence, and mere description without analysis. Present opposing views fairly and use jargon accurately and sparingly.</li><li>Tense: present tense for accepted facts (\"prior research shows\u2026\"), past tense for your own results (\"we found\u2026\").</li><li>Keep one main point per paragraph; every paragraph must tie back to the research problem.</li><li><strong>Original page:</strong> <a href=\"https://libguides.usc.edu/writingguide/academicwriting\" target=\"_blank\" rel=\"noopener\">Academic Writing Style</a></li></ul>\n<h3 class=\"wg-h3\">Choosing a title</h3>\n<ul class=\"wg-ul\"><li>Draft a working title early \u2014 it focuses the writing \u2014 but finalize it only after the paper is done. A good title is specific, about 10\u201315 substantive words, names the key variables and scope, and uses current field terminology.</li><li>Avoid abbreviations and filler openings (\"A study of\u2026\", \"An investigation into\u2026\"). If you need a geographic, temporal, or population qualifier, put it in a subtitle after a colon.</li><li><strong>Original page:</strong> <a href=\"https://libguides.usc.edu/writingguide/title\" target=\"_blank\" rel=\"noopener\">Choosing a Title</a></li></ul>\n<h3 class=\"wg-h3\">Making an outline</h3>\n<ul class=\"wg-ul\"><li>An outline tests logical flow and whether you have enough evidence before you invest in prose. Choose a topic outline (phrases) or a sentence outline (full sentences) \u2014 one or the other, not a mix.</li><li>Build it as: problem, then main categories, then supporting sub-points under each. Stay flexible; the outline is a plan, not a contract.</li><li><strong>Reverse outline:</strong> for an existing draft, write one line per paragraph summarizing what it actually says. Mis-ordered or duplicated lines expose the disorganization instantly.</li><li><strong>Original page:</strong> <a href=\"https://libguides.usc.edu/writingguide/outline\" target=\"_blank\" rel=\"noopener\">Making an Outline</a></li></ul>\n<h3 class=\"wg-h3\">Paragraph development</h3>\n<ul class=\"wg-ul\"><li>One controlling idea per paragraph: a topic sentence that states it, evidence and analysis that develop it, and a concluding or transition sentence. A paragraph must be unified (one idea), coherent (sentences connect), tied to the research problem, and adequately developed \u2014 split any paragraph that starts carrying a second idea, and use explicit transitions between paragraphs.</li><li><strong>Original page:</strong> <a href=\"https://libguides.usc.edu/writingguide/paragraph\" target=\"_blank\" rel=\"noopener\">Paragraph Development</a></li></ul>\n<h3 class=\"wg-h3\">Reading research effectively</h3>\n<ul class=\"wg-ul\"><li>Read strategically, not linearly: title, abstract, headings, tables and figures first; then introduction and discussion; methods last unless you are evaluating them. Check author expertise and venue; identify each paper's line of argument; take margin or note-form dialogue with the text (agreements, gaps, \"use for my lit review\"); and periodically review your notes and start writing from them. The point is to extract problem, argument, evidence, and gaps for your own project.</li><li><strong>Original page:</strong> <a href=\"https://libguides.usc.edu/writingguide/readingresearch\" target=\"_blank\" rel=\"noopener\">Reading Research Effectively</a></li></ul>\n<h3 class=\"wg-h3\">Applying critical thinking</h3>\n<ul class=\"wg-ul\"><li>Evaluate claims, evidence quality, and hidden assumptions rather than summarizing uncritically. Question and reflect in the writing itself; consider alternative interpretations of the same evidence; synthesize across the literature instead of stacking summaries; and watch for fallacious reasoning (in sources and in your own draft).</li><li><strong>Original page:</strong> <a href=\"https://libguides.usc.edu/writingguide/criticalthinking\" target=\"_blank\" rel=\"noopener\">Applying Critical Thinking</a></li></ul>\n<h3 class=\"wg-h3\">Writing concisely</h3>\n<ul class=\"wg-ul\"><li>In the final pass: cut wordiness and redundancy, prefer clear precise wording and strong verbs, keep sentences direct, and remove filler phrases while preserving meaning and formal tone.</li><li><strong>Original page:</strong> <a href=\"https://libguides.usc.edu/writingguide/writingconcisely\" target=\"_blank\" rel=\"noopener\">Writing Concisely</a></li></ul>\n<h2 class=\"wg-h2\" id=\"part-3-the-anatomy-of-a-research-paper\">Part 3 \u00b7 The anatomy of a research paper</h2>\n<h3 class=\"wg-h3\">The abstract</h3>\n<ul class=\"wg-ul\"><li>One paragraph, usually 300 words or fewer, with four elements in order: (1) purpose or problem, (2) basic design, (3) major findings, (4) brief interpretation or conclusions.</li><li>Types: informative (the standard research abstract), descriptive (says what the paper covers, not what it found), critical (adds evaluation), and highlight (teaser-style).</li><li>Write it last. Use past tense and concise, complete sentences. Exclude lengthy background, citations, abbreviations and jargon, incomplete sentences, and figures or tables. And never cite a source based only on its abstract.</li><li><strong>Original page:</strong> <a href=\"https://libguides.usc.edu/writingguide/abstract\" target=\"_blank\" rel=\"noopener\">3. The Abstract</a></li></ul>\n<h3 class=\"wg-h3\">Executive summary</h3>\n<ul class=\"wg-ul\"><li>A stand-alone mini-paper (about 1\u201310 pages, or 10% or less of the full report) written for decision-making audiences: it foregrounds explicit recommendations with their justification, which an abstract never does.</li><li>Write it after reading the full document: isolate the major points of each section, combine them, then re-read after a break. Avoid cut-and-paste assembly, excess length, an unclear audience, and weak, hedged language.</li><li><strong>Original page:</strong> <a href=\"https://libguides.usc.edu/writingguide/executivesummary\" target=\"_blank\" rel=\"noopener\">Executive Summary</a></li></ul>\n<h3 class=\"wg-h3\">The introduction</h3>\n<ul class=\"wg-ul\"><li>Move from general to specific: establish the topic's importance, summarize what is known, identify the gap or niche, state your purpose, hypothesis or question with its rationale and method, preview outcomes, and end with a roadmap of the paper's structure.</li><li>State your delimitations (the boundaries you chose: population, place, period). Use the title's keywords early. One engaging device (a question, an example, a short anecdote) is enough; avoid opening with a dictionary definition.</li><li>Many writers finish the introduction late in the drafting process, when they know exactly what the paper delivers.</li><li><strong>The CARS model</strong> (Swales) organizes this into three moves: Move 1 \u2014 establish the territory (show the topic matters, make topic generalizations, review prior research); Move 2 \u2014 establish the niche (a counter-claim, an indicated gap, a question raised, or a tradition continued); Move 3 \u2014 occupy the niche (state your purpose, announce the present research and its findings, preview the paper's structure). The USC page adds sentence-level strategies, verb-tense guidance, problems to avoid, and an outline worksheet for the model.</li><li><strong>Original pages:</strong> <a href=\"https://libguides.usc.edu/writingguide/introduction\" target=\"_blank\" rel=\"noopener\">4. The Introduction</a> \u00b7 <a href=\"https://libguides.usc.edu/writingguide/CARS\" target=\"_blank\" rel=\"noopener\">The C.A.R.S. Model</a></li></ul>\n<h3 class=\"wg-h3\">The literature review</h3>\n<ul class=\"wg-ul\"><li>A literature review surveys, summarizes, <strong>and critically evaluates</strong> the scholarly sources to show how your study fits the field \u2014 it is summary plus synthesis, not an annotated list.</li><li>Types: argumentative (builds a position), integrative (synthesizes a mature topic), historical (traces an idea over time), methodological (compares how studies were done), systematic (protocol-driven, exhaustive), theoretical (examines the theories around an issue).</li><li>Process: formulate the problem, search the literature, evaluate each source's contribution, then analyse and interpret across sources.</li><li>Organize chronologically, thematically, or methodologically. Evaluate sources on provenance, objectivity, persuasiveness, and value.</li><li>Avoid unrelated sources, uncritical acceptance of claims, secondary-only coverage, and excluding contrary results. Stop searching when findings and citations start repeating \u2014 saturation is the signal.</li><li><strong>Original page:</strong> <a href=\"https://libguides.usc.edu/writingguide/literaturereview\" target=\"_blank\" rel=\"noopener\">5. The Literature Review</a></li></ul>\n<h3 class=\"wg-h3\">Searching the literature</h3>\n<ul class=\"wg-ul\"><li>Treat searching as deliberate and methodical, not first-results browsing. Steps: identify your key concepts; choose controlled vocabulary vs. free keywords; decide catalog vs. database; do background reading first; choose databases; then search with Boolean AND / OR / NOT, phrase searching (quotation marks), truncation and wildcards, proximity operators, and filters or limits.</li><li>Grow the set with \"pearl growing\": mine one good paper's references and subject terms for more. Save your searches so the strategy is reproducible, and ask a librarian when stuck.</li><li><strong>Original page:</strong> <a href=\"https://libguides.usc.edu/writingguide/LiteratureSearching\" target=\"_blank\" rel=\"noopener\">Search Strategies for Literature Reviews</a></li></ul>\n<h3 class=\"wg-h3\">Citation tracking and content alerts</h3>\n<ul class=\"wg-ul\"><li><strong>Citation tracking:</strong> follow who has cited a landmark article or author (the \"cited by\" features in databases and Google Scholar) to find newer work and gauge impact. Mind author-name variants and the limits of database coverage.</li><li><strong>Content alerts:</strong> set table-of-contents alerts for key journals, saved-search alerts in databases, and topic alerts on publisher sites, so new articles reach you while the review is in progress.</li><li><strong>Original pages:</strong> <a href=\"https://libguides.usc.edu/writingguide/citationtracking\" target=\"_blank\" rel=\"noopener\">Citation Tracking</a> \u00b7 <a href=\"https://libguides.usc.edu/writingguide/contentalert\" target=\"_blank\" rel=\"noopener\">Content Alert Services</a></li></ul>\n<h3 class=\"wg-h3\">Evaluating sources, and source types</h3>\n<ul class=\"wg-ul\"><li>For each source assess: author credentials, date and currency, edition, publisher, and journal type; and for content: intended audience, objectivity, coverage, style, and independent reviews. For websites add: sourcing of claims, site maintenance, working links, contact information, and domain. Bias warning signs: loaded language, one-sided evidence, no verifiable references.</li><li><strong>Primary sources</strong> are original, uninterpreted records from the time or the participants: diaries, letters, speeches, official records, artifacts, interviews, contemporaneous news. (Whether something is \"primary\" depends on your research question.)</li><li><strong>Secondary sources</strong> are later interpretations of primary material \u2014 most journal articles, books, and commentaries. They form the bulk of a literature review; they are positions to engage, not objects of analysis.</li><li><strong>Tertiary sources</strong> compile, summarize, and index: encyclopedias, dictionaries, bibliographies, almanacs, handbooks, textbooks, databases. Starting points and pointers \u2014 generally not core evidence.</li><li><strong>Scholarly vs. popular:</strong> scholarly work is peer-reviewed, written by credentialed authors, fully referenced, and structured for specialists; popular and trade publications are editor-reviewed, journalist-written, sparsely referenced, and aimed at general or industry audiences.</li><li><strong>Original pages:</strong> <a href=\"https://libguides.usc.edu/writingguide/evaluatesources\" target=\"_blank\" rel=\"noopener\">Evaluating Sources</a> \u00b7 <a href=\"https://libguides.usc.edu/writingguide/primarysources\" target=\"_blank\" rel=\"noopener\">Primary Sources</a> \u00b7 <a href=\"https://libguides.usc.edu/writingguide/secondarysources\" target=\"_blank\" rel=\"noopener\">Secondary Sources</a> \u00b7 <a href=\"https://libguides.usc.edu/writingguide/tiertiarysources\" target=\"_blank\" rel=\"noopener\">Tertiary Sources</a> \u00b7 <a href=\"https://libguides.usc.edu/writingguide/scholarly\" target=\"_blank\" rel=\"noopener\">Scholarly vs. Popular</a></li></ul>\n<h3 class=\"wg-h3\">The methodology</h3>\n<ul class=\"wg-ul\"><li>Write it in the past tense with replication-level detail: the overall approach and its fit to the problem and design; data-collection methods; the analysis approach; the sampling rationale; and anticipated limitations and confounds with how you handled them. Organize chronologically where sensible, and cite sources for your method choices.</li><li>Avoid irrelevant detail, tutorial-style explanations of standard methods, and \u2014 worst of all \u2014 ignoring problems you actually encountered.</li><li><strong>Original page:</strong> <a href=\"https://libguides.usc.edu/writingguide/methodology\" target=\"_blank\" rel=\"noopener\">6. The Methodology</a></li></ul>\n<h3 class=\"wg-h3\">Qualitative methods</h3>\n<ul class=\"wg-ul\"><li>Qualitative work studies meaning, process, and context through words and observation. It is naturalistic, emergent, and holistic; sampling is purposive (chosen for information richness, not representativeness); analysis is inductive, with the researcher's reflexivity made explicit.</li><li>Design elements to specify: goals, conceptual framework, research questions, methods, and validity threats with your countermeasures.</li><li>Human-subjects research typically requires Institutional Review Board (IRB) review and informed consent (see Part 5).</li><li><strong>Insiderness:</strong> studying a group or setting you belong to brings access and trust but risks bias, over-rapport, and assuming you already understand. It requires reflexivity, an explicit position statement, safeguards, and careful interpretation.</li><li><strong>Original pages:</strong> <a href=\"https://libguides.usc.edu/writingguide/qualitative\" target=\"_blank\" rel=\"noopener\">Qualitative Methods</a> \u00b7 <a href=\"https://libguides.usc.edu/writingguide/insiderness\" target=\"_blank\" rel=\"noopener\">Insiderness</a></li></ul>\n<h3 class=\"wg-h3\">Quantitative methods</h3>\n<ul class=\"wg-ul\"><li>Quantitative work measures numerically and analyses statistically, with larger, representative samples and structured instruments. Descriptive designs can show associations; only experimental designs support causal claims \u2014 never claim causality from a non-experimental design.</li><li>Report: data cleaning, missing-data handling, the choice of statistical tests and their assumptions, descriptive statistics, and effect sizes / test values with significance levels.</li><li>Use tables for exact values and figures for patterns.</li><li><strong>Original page:</strong> <a href=\"https://libguides.usc.edu/writingguide/quantitative\" target=\"_blank\" rel=\"noopener\">Quantitative Methods</a></li></ul>\n<h3 class=\"wg-h3\">The results</h3>\n<ul class=\"wg-ul\"><li>Past tense, no interpretation. Restate the problem briefly, then present the key results in logical order (usually the order of the Methodology), with numbered figures and tables.</li><li>Do not put raw data here (that belongs in appendices), do not repeat the same data in text and table, do not speculate \u2014 and do not omit negative results.</li><li><strong>Original page:</strong> <a href=\"https://libguides.usc.edu/writingguide/results\" target=\"_blank\" rel=\"noopener\">7. The Results</a></li></ul>\n<h3 class=\"wg-h3\">Using non-textual elements</h3>\n<ul class=\"wg-ul\"><li>Charts, graphs, tables, maps, figures, and photos should clarify or summarize, used sparingly. Every element is numbered, captioned, referenced in the text in order, placed consistently, understandable on its own, and sourced if adapted from elsewhere.</li><li><strong>Original page:</strong> <a href=\"https://libguides.usc.edu/writingguide/nontextual\" target=\"_blank\" rel=\"noopener\">Using Non-Textual Elements</a></li></ul>\n<h3 class=\"wg-h3\">The discussion</h3>\n<ul class=\"wg-ul\"><li>Interpret the findings: restate the problem and major findings; explain expected and unexpected results; compare with prior studies; consider alternative explanations seriously; state the implications and deductions; and propose any new hypothesis the results suggest.</li><li>Mirror the order of the Results. Avoid introducing new results, merely restating results, over-interpreting, or speculating without flagging it as speculation.</li><li><strong>Original page:</strong> <a href=\"https://libguides.usc.edu/writingguide/discussion\" target=\"_blank\" rel=\"noopener\">8. The Discussion</a></li></ul>\n<h3 class=\"wg-h3\">Limitations of the study</h3>\n<ul class=\"wg-ul\"><li>Limitations are the design and method constraints on generalizability and interpretation: sample size, missing or unreliable data, lack of prior research, measurement problems, self-reported data; and on the practical side: access, time, language, and bias.</li><li>Place them at the start or the end of the Discussion. For each limitation: describe it, explain why it was unavoidable, and assess its actual impact on the conclusions.</li><li>Negative results are findings, not limitations \u2014 do not file them here.</li><li><strong>Original page:</strong> <a href=\"https://libguides.usc.edu/writingguide/limitations\" target=\"_blank\" rel=\"noopener\">Limitations of the Study</a></li></ul>\n<h3 class=\"wg-h3\">The conclusion</h3>\n<ul class=\"wg-ul\"><li>Synthesize, do not merely summarize: restate the argument, place the findings in the larger field, note the significance and promising future research. Move from the specific back to the general, and answer \"so what?\"</li><li>No new information, no apologies, no stock closing sentences. Keep it concise.</li><li><strong>Original page:</strong> <a href=\"https://libguides.usc.edu/writingguide/conclusion\" target=\"_blank\" rel=\"noopener\">9. The Conclusion</a></li></ul>\n<h3 class=\"wg-h3\">Appendices</h3>\n<ul class=\"wg-ul\"><li>Appendices hold non-essential supplements: raw data, instruments, transcripts, detailed tables and figures. The paper must stand without them. One appendix per distinct topic, each titled, each starting on a new page, ordered as first referenced in the text, and listed in the table of contents.</li><li><strong>Original page:</strong> <a href=\"https://libguides.usc.edu/writingguide/appendices\" target=\"_blank\" rel=\"noopener\">Appendices</a></li></ul>\n<h2 class=\"wg-h2\" id=\"part-4-polish-cite-and-stay-honest\">Part 4 \u00b7 Polish, cite, and stay honest</h2>\n<h3 class=\"wg-h3\">Proofreading your paper</h3>\n<ul class=\"wg-ul\"><li>Revise big-picture first (structure, argument, evidence), proofread details last \u2014 after a break from the draft. Read aloud or on a printout; check one error type at a time; use search to hunt your personal error patterns; verify homonyms; get a second reader. Work in short, focused sessions.</li><li><strong>Original page:</strong> <a href=\"https://libguides.usc.edu/writingguide/proofreading\" target=\"_blank\" rel=\"noopener\">10. Proofreading Your Paper</a></li></ul>\n<h3 class=\"wg-h3\">Common grammar mistakes \u2014 the checklist</h3>\n<ul class=\"wg-ul\"><li>affect / effect; apostrophes (its / it's, plurals vs. possessives); capitalization; comma splices; dangling participles; sentence fragments; subject\u2013verb agreement; tense consistency; that vs. which; fewer vs. less; who vs. whom; vague \"this\" / \"it\" openings; semicolon misuse; clumsy quote integration; imprecise intensifiers (\"very\", \"really\").</li><li><strong>Original page:</strong> <a href=\"https://libguides.usc.edu/writingguide/grammar\" target=\"_blank\" rel=\"noopener\">Common Grammar Mistakes</a></li></ul>\n<h3 class=\"wg-h3\">Citing sources</h3>\n<ul class=\"wg-ul\"><li>Cite every borrowed idea, fact, quotation, and paraphrase, in the required style (APA, MLA, Chicago\u2026), applied consistently. Common knowledge is the exception; when in doubt, cite.</li><li>Why it matters: it shows an informed review of the field, lets readers verify your evidence, and protects your credibility.</li><li><strong>Original page:</strong> <a href=\"https://libguides.usc.edu/writingguide/citingsources\" target=\"_blank\" rel=\"noopener\">11. Citing Sources</a></li></ul>\n<h3 class=\"wg-h3\">Avoiding plagiarism</h3>\n<ul class=\"wg-ul\"><li>Plagiarism includes copying text, submitting another's work as yours, pasting without attribution, and fabricating sources or data. Credit: others' ideas and theories, non-common-knowledge facts and visuals, all quotations, and paraphrases (restating in your own words still requires a citation).</li><li><strong>Original page:</strong> <a href=\"https://libguides.usc.edu/writingguide/plagiarism\" target=\"_blank\" rel=\"noopener\">Avoiding Plagiarism</a></li></ul>\n<h3 class=\"wg-h3\">Footnotes or endnotes</h3>\n<ul class=\"wg-ul\"><li>Footnotes are visible where they matter but clutter the page; endnotes keep pages clean but force the reader to flip. Either way: number consecutively (superscript), use notes only for supplementary material, follow the instructor's or style manual's rule, and use one system consistently.</li><li><strong>Original page:</strong> <a href=\"https://libguides.usc.edu/writingguide/notes\" target=\"_blank\" rel=\"noopener\">Footnotes or Endnotes?</a></li></ul>\n<h3 class=\"wg-h3\">Generative AI and writing</h3>\n<ul class=\"wg-ul\"><li>Use AI only within your professor's, institution's, and target journal's rules. Verify everything it produces (it can fabricate facts and references), disclose or cite AI assistance as required, and never submit AI-generated text as your own analysis.</li><li><strong>Original page:</strong> <a href=\"https://libguides.usc.edu/writingguide/AIwriting\" target=\"_blank\" rel=\"noopener\">Generative AI and Writing</a></li></ul>\n<h3 class=\"wg-h3\">Publishing your research</h3>\n<ul class=\"wg-ul\"><li>After the paper: select a venue that fits the contribution; prepare the manuscript exactly to the venue's requirements; treat peer review as an improvement process; revise and respond to reviewers carefully; and build your scholarly profile as you go.</li><li><strong>Original page:</strong> <a href=\"https://libguides.usc.edu/writingguide/publishing\" target=\"_blank\" rel=\"noopener\">Publishing Your Research</a> \u2014 and see the publication resources from the Secret Garden in Part 6.</li></ul>\n<h3 class=\"wg-h3\">Going further</h3>\n<ul class=\"wg-ul\"><li>The guides close with further readings, a research-process video series, a glossary of research terms, and a \"last word\" of encouragement.</li><li><strong>Original pages:</strong> <a href=\"https://libguides.usc.edu/writingguide/furtherreadings\" target=\"_blank\" rel=\"noopener\">Further Readings</a> \u00b7 <a href=\"https://libguides.usc.edu/writingguide/researchvideos\" target=\"_blank\" rel=\"noopener\">Research Process Video Series</a> \u00b7 <a href=\"https://libguides.usc.edu/writingguide/researchglossary\" target=\"_blank\" rel=\"noopener\">Glossary of Research Terms</a> \u00b7 <a href=\"https://libguides.usc.edu/writingguide/lastword\" target=\"_blank\" rel=\"noopener\">Last Word</a></li></ul>\n<h2 class=\"wg-h2\" id=\"part-5-common-assignment-types\">Part 5 \u00b7 Common assignment types</h2>\n<ul class=\"wg-ul\"><li><strong>Annotated bibliography.</strong> A citation list where each source gets an annotation \u2014 descriptive (what it says), summative (its main findings), or evaluative (the most commonly assigned: its argument, method, evidence, limitations, and usefulness to your project). Begin with a brief introduction explaining how sources were selected and excluded. Scope the set by aspect, time period, geography, relationship, or type. Annotations run about 300 words each unless the assignment specifies otherwise. <strong><a href=\"https://libguides.usc.edu/writingguide/assignments/annotatedbibliography\" target=\"_blank\" rel=\"noopener\">Original page</a></strong></li><li><strong>Analyzing a scholarly journal article.</strong> Choose an empirical article (not mainly theoretical, a review, or a legal commentary). Structure: a brief introduction (problem; design; subjects and measures for quantitative work or data sources for qualitative work; author credentials); critical analysis of its literature review (currency, relevance, gaps, objectivity); its methods (design appropriateness, sampling, measurement, reliability and validity, ethics, replicability, statistics and visuals); results (accuracy, tables and figures, alternative interpretations); discussion and conclusion (meaning of findings, generalizability, interpretation bias); writing style and organization; and an overall evaluation. Avoid quoting \u2014 critical analysis shows in the depth of what you examine, not in retelling findings. <strong><a href=\"https://libguides.usc.edu/writingguide/assignments/AnalyzingJournal\" target=\"_blank\" rel=\"noopener\">Original page</a></strong></li><li><strong>Creating a podcast.</strong> A podcast is storytelling: determine the purpose and length, target audience, point of view, narrative story, place, and themes. Steps: research the topic and audience, understand the technology, develop the idea, draft an outline or script, plan production, record, post-produce, publish. Practical notes: 15\u201325 minutes of focused content, few voices, conversational delivery (talk, do not read), a good microphone, scripted intro and outro, and copyright awareness for music, images, and video. <strong><a href=\"https://libguides.usc.edu/writingguide/assignments/podcast\" target=\"_blank\" rel=\"noopener\">Original page</a></strong></li><li><strong>Case analysis paper.</strong> Not a case study: you analyze a case or scenario that already exists (a published business case, a film, a novel) and recommend a resolution. Focus on causes and consequences, the decision-maker's perspective, the underlying social, political, and economic issues, and stakeholder traits and conflicts. Structure: background; evaluation of the case with the major problems prioritized; proposed solutions; recommendations with an action and implementation plan. There is usually no literature review or methods section of your own \u2014 you apply class theory to the case facts. Keep problem statements specific and evidence-supported; avoid flowery writing, mere summary, and anything defamatory. <strong><a href=\"https://libguides.usc.edu/writingguide/assignments/caseanalysis\" target=\"_blank\" rel=\"noopener\">Original page</a></strong></li><li><strong>Case study paper.</strong> A research paper examining a person, place, event, condition, or phenomenon in depth. Choose the case because it is unusual or atypical, illuminates a hidden problem, challenges prevailing assumptions, supports action, or opens a new research direction. Structure follows the standard paper: Introduction (who or what is studied, why it matters, what was known, how the study advances knowledge); Literature Review (sources placed by contribution, support for using this case, resolved conflicts, exposed gaps, locating your research); Method (justify the case selection \u2014 it must not appear random); Discussion (reiterate problem and findings, explain meaning and importance, relate to similar studies, alternatives, limitations, further research); Conclusion (main argument and significance, from detailed to general). Avoid overgeneralization, undocumented limitations, and unexplored implications. <strong><a href=\"https://libguides.usc.edu/writingguide/assignments/casestudy\" target=\"_blank\" rel=\"noopener\">Original page</a></strong></li><li><strong>Field report.</strong> Links theory to observed practice. Plan what, where, and how to observe under an explicit theoretical framework; record with notes, audio, video, or drawings; sample purposively until saturation. Write in the past tense: introduction (objective, theory, setting, methods, literature), description, interpretation grounded in theory and observed evidence only, conclusion and recommendations with limitations, appendix, references. <strong><a href=\"https://libguides.usc.edu/writingguide/assignments/fieldreport\" target=\"_blank\" rel=\"noopener\">Original page</a></strong></li><li><strong>Writing field notes.</strong> Keep two parts separate: the descriptive part (setting, participants and roles, interactions, behaviour, near-verbatim remarks, your own impact on the scene) and the reflective part (impressions, questions, emerging interpretations). Write promptly after observing; descriptions concrete rather than evaluative; analyse as you go. <strong><a href=\"https://libguides.usc.edu/writingguide/assignments/fieldnotes\" target=\"_blank\" rel=\"noopener\">Original page</a></strong></li><li><strong>Informed consent.</strong> Consent must be voluntary, informed, and documented, given after plain-language disclosure, with the right to withdraw at any time and no waiver of legal rights. Observation in public spaces may be exempt \u2014 but check your Institutional Review Board's rules before, not after. <strong><a href=\"https://libguides.usc.edu/writingguide/assignments/informedconsent\" target=\"_blank\" rel=\"noopener\">Original page</a></strong></li><li><strong>Policy memo.</strong> A decision document for a named audience, not a thesis paper: headings, plain professional language, evidence-based options, cost\u2013benefit thinking, feasibility, stakeholder effects, measurable success criteria, and honest limitations. Structure: cover page; problem definition; brief methods; issue analysis; proposed solutions; strategic recommendations (who does what by when, plus the consequences of inaction); limitations; an optional cost\u2013benefit summary. <strong><a href=\"https://libguides.usc.edu/writingguide/assignments/policymemo\" target=\"_blank\" rel=\"noopener\">Original page</a></strong></li><li><strong>Research proposal.</strong> Justify a study not yet run, typically 10\u201315 pages: introduction; background and significance; literature review organized by theme (cite, compare, contrast, critique, connect); design and methods argued as the best fit; anticipated implications; brief conclusion; references. Delimit the boundaries, cite the landmark studies, stay focused. <strong><a href=\"https://libguides.usc.edu/writingguide/assignments/researchproposal\" target=\"_blank\" rel=\"noopener\">Original page</a></strong></li><li><strong>Book review.</strong> Usually critical, about 500\u20131,000 words. Identify the book's thesis, coverage and balance, evidence, structure, and method; evaluate whether it achieves its purpose, what it contributes, its objectivity, its omissions, and its usefulness \u2014 supported by textual evidence and comparison with related work. Focus on the book's treatment of the topic, not the topic itself. <strong><a href=\"https://libguides.usc.edu/writingguide/assignments/bookreview\" target=\"_blank\" rel=\"noopener\">Original page</a></strong></li><li><strong>Multiple book review essay.</strong> Review 2\u20136 related books as a compare-and-contrast essay unified by your own overarching thesis. Block method (one book at a time) suits shorter pieces; point-by-point suits longer ones. Evaluation should dominate summary, and the conclusion synthesizes without introducing new material. <strong><a href=\"https://libguides.usc.edu/writingguide/assignments/bookreview/multiple\" target=\"_blank\" rel=\"noopener\">Original page</a></strong></li><li><strong>Reviewing collected works (edited volumes).</strong> Identify the volume's type, overarching scope and purpose, and organizing logic. Analyse by themes across the essays rather than summarizing chapter by chapter; evaluate the selection and its omissions, the editor's framing, and whether the contributions advance the volume's purpose. <strong><a href=\"https://libguides.usc.edu/writingguide/assignments/bookreview/collected\" target=\"_blank\" rel=\"noopener\">Original page</a></strong></li><li><strong>Reflective paper.</strong> Examine an experience through your course's concepts: what happened, what it connects to, what you take forward. <strong><a href=\"https://libguides.usc.edu/writingguide/assignments/reflectionpaper\" target=\"_blank\" rel=\"noopener\">Original page</a></strong></li><li><strong>Giving an oral presentation.</strong> Plan for a listening audience: define the goal, keep a few key points, forecast\u2013present\u2013summarize, signpost your transitions, rehearse and time yourself. Use simple language, a varied audible voice, pauses, and eye contact; do not read an essay aloud and do not apologize. Prepare for questions. <strong><a href=\"https://libguides.usc.edu/writingguide/assignments/oralpresentation\" target=\"_blank\" rel=\"noopener\">Original page</a></strong> \u2014 for group presentations, coordinate roles and hand-offs explicitly <strong><a href=\"https://libguides.usc.edu/writingguide/assignments/grouppresentation\" target=\"_blank\" rel=\"noopener\">Original page</a></strong></li><li><strong>Dealing with nervousness.</strong> Preparation and organization are the main controls: rehearse repeatedly, order your notes and slides in advance, breathe and slow down, pause, smile. Do not announce your nervousness to the audience. <strong><a href=\"https://libguides.usc.edu/writingguide/assignments/nervousness\" target=\"_blank\" rel=\"noopener\">Original page</a></strong></li><li><strong>Using visual aids.</strong> Slides supplement the talk, never replace it: few points per slide, about 6 words per line and 6 lines per slide maximum, readable high-contrast design, minimal abbreviations. Pause so the audience can absorb each slide; do not block the screen; prepare a non-tech backup; check the room and lighting beforehand. <strong><a href=\"https://libguides.usc.edu/writingguide/assignments/visualaids\" target=\"_blank\" rel=\"noopener\">Original page</a></strong></li><li><strong>Grading someone else's paper (peer grading).</strong> Grade against the instructor's rubric: clarify who and what is being evaluated, the timing, the learning outcomes, and how much the grade counts. Report with specific examples in concise, non-subjective language. <strong><a href=\"https://libguides.usc.edu/writingguide/assignments/peergrading\" target=\"_blank\" rel=\"noopener\">Original page</a></strong></li><li><strong>Managing group projects.</strong> Stages: introductions, roles, and contact methods; shared goals and deadlines; dated, fairly distributed tasks with check-ins; frequent communication and support without doing others' work for them; finally, assemble and copyedit the whole for consistent style, transitions, and citations. Address non-contribution early, not at the deadline. Structured group activities and survival skills for difficult group dynamics are covered in the sub-pages. <strong><a href=\"https://libguides.usc.edu/writingguide/assignments/groupprojects\" target=\"_blank\" rel=\"noopener\">Original pages</a> \u00b7 <a href=\"https://libguides.usc.edu/writingguide/assignments/groupactivities\" target=\"_blank\" rel=\"noopener\">Types of Structured Group Activities</a> \u00b7 <a href=\"https://libguides.usc.edu/writingguide/assignments/survivalskills\" target=\"_blank\" rel=\"noopener\">Group Project Survival Skills</a></strong></li><li><strong>Leading a class discussion.</strong> Prepare framing questions, facilitate participation across the room (not just the keenest voices), and synthesize what was said rather than merely collecting opinions. <strong><a href=\"https://libguides.usc.edu/writingguide/assignments/leaddiscussion\" target=\"_blank\" rel=\"noopener\">Original page</a></strong></li><li><strong>Generative AI and writing (assignments).</strong> The same rule as in Part 4: work within your professor's and institution's rules, verify AI output, disclose as required, and never submit AI output as your own analysis. <strong><a href=\"https://libguides.usc.edu/writingguide/assignments/AIwriting\" target=\"_blank\" rel=\"noopener\">Original page</a></strong></li></ul>\n<h2 class=\"wg-h2\" id=\"part-6-from-my-secret-garden-resources-a\">Part 6 \u00b7 From my Secret Garden \u2014 resources already saved</h2>\n<p class=\"wg-p\">Drawn from the \"IS Study Resource\" note in the Secret Garden (itself gathered from the CDIN page https://www.cdin.net/f172) \u2014 the slices most relevant to designing, writing, and publishing research.</p>\n<h3 class=\"wg-h3\">MIS Reading List (Yihong Liu, UT Dallas)</h3>\n<ul class=\"wg-ul\"><li><a href=\"https://blog.yihong-liu.com/MISReadingList/intro/\" target=\"_blank\" rel=\"noopener\">MIS Reading List \u2014 Introduction</a> \u2014 Yihong Liu's openly licensed (CC BY-NC-SA 4.0) reading list for MIS PhD students, curated largely from UT Dallas's MIS7420 seminar: journals, conferences, books, papers, and topic reading lists. Mirror: https://liu-yihong.github.io/MISReadingList/</li></ul>\n<h3 class=\"wg-h3\">Methods training (GSU syllabi)</h3>\n<ul class=\"wg-ul\"><li><a href=\"https://www.cdin.net/s/ECON-9710-Econometrics-I.pdf\" target=\"_blank\" rel=\"noopener\">ECON 9710 Econometrics I</a> \u00b7 <a href=\"https://www.cdin.net/s/ECON-9720-Econometrics-II.pdf\" target=\"_blank\" rel=\"noopener\">ECON 9720 Econometrics II</a> \u00b7 <a href=\"https://www.cdin.net/s/ECON-9730-Advanced-Econometrics.pdf\" target=\"_blank\" rel=\"noopener\">ECON 9730 Advanced Econometrics</a></li><li><a href=\"https://www.cdin.net/s/ECON-8899-Causal-Inference-Syllabus-2022-Carattini.pdf\" target=\"_blank\" rel=\"noopener\">ECON 8899 Causal Inference (Carattini)</a> \u00b7 <a href=\"https://www.cdin.net/s/Econ9760-Syllabus-Spring2023.pdf\" target=\"_blank\" rel=\"noopener\">ECON 9760 (Spring 2023)</a></li><li><a href=\"https://www.cdin.net/s/MGT-9940-Design-of-Experiments.pdf\" target=\"_blank\" rel=\"noopener\">MGT 9940 Design of Experiments</a></li><li><a href=\"https://www.cdin.net/s/IFI-9000-Research-Methods-with-Analytics.pdf\" target=\"_blank\" rel=\"noopener\">IFI 9000 Research Methods with Analytics</a> \u00b7 <a href=\"https://www.cdin.net/s/IFI-9010-Advanced-Topics-in-Analytics.pdf\" target=\"_blank\" rel=\"noopener\">IFI 9010 Advanced Topics in Analytics</a></li><li><a href=\"https://www.cdin.net/s/BA-9260-Theory-Development.pdf\" target=\"_blank\" rel=\"noopener\">BA 9260 Theory Development</a> \u2014 directly useful for Part 1's theoretical-framework work.</li><li><a href=\"https://www.cdin.net/s/CIS-9200-Text-Analysis.pdf\" target=\"_blank\" rel=\"noopener\">CIS 9200 Text Analysis (Lin)</a></li></ul>\n<h3 class=\"wg-h3\">Books on the shelf</h3>\n<ul class=\"wg-ul\"><li><a href=\"https://mixtape.scunning.com/\" target=\"_blank\" rel=\"noopener\">Causal Inference: The Mixtape (Cunningham)</a> \u00b7 <a href=\"https://www.mostlyharmlesseconometrics.com/book-contents/\" target=\"_blank\" rel=\"noopener\">Mostly Harmless Econometrics</a> \u00b7 <a href=\"https://users.ssc.wisc.edu/~bhansen/econometrics/\" target=\"_blank\" rel=\"noopener\">Hansen, Econometrics</a></li><li><a href=\"https://www.amazon.com/Writing-Doctoral-Dissertation-Gordon-Davis/dp/0812098005/\" target=\"_blank\" rel=\"noopener\">Writing the Doctoral Dissertation (Davis)</a> \u2014 a systematic guide to dissertation writing.</li><li><a href=\"https://www.vvenkatesh.com/road-to-success\" target=\"_blank\" rel=\"noopener\">Road to Success (Venkatesh)</a> \u2014 succeeding in the PhD and beyond.</li></ul>\n<h3 class=\"wg-h3\">Craft of publishing</h3>\n<ul class=\"wg-ul\"><li><a href=\"https://www.apa.org/pubs/journals/features/apl-manuscript-checklist.pdf\" target=\"_blank\" rel=\"noopener\">JAP manuscript checklist (APA)</a> \u2014 a pre-submission checklist from the Journal of Applied Psychology.</li><li><a href=\"https://www.cdin.net/s/Qual-Zoom-for-Authors.pdf\" target=\"_blank\" rel=\"noopener\">MISQ Seminar: Qualitative Methods for IS (slides)</a></li><li><a href=\"https://www.cdin.net/s/The_Publication_Cycle_A_to_Z_CAM.pptx\" target=\"_blank\" rel=\"noopener\">The Publication Cycle A to Z (Robey, CIS 9390 Journal Club)</a> \u2014 how publishing works, end to end.</li><li><a href=\"https://libguides.usc.edu/writingguide/publishing\" target=\"_blank\" rel=\"noopener\">USC: Publishing Your Research</a> \u2014 venue choice, submission, peer review, revision.</li></ul>\n<h3 class=\"wg-h3\">Seminars and community</h3>\n<ul class=\"wg-ul\"><li><a href=\"https://sites.google.com/view/ocis/home\" target=\"_blank\" rel=\"noopener\">Causal Inference Seminar (OCIS)</a> \u00b7 <a href=\"https://www.janrecker.com/this-is-research-podcast/\" target=\"_blank\" rel=\"noopener\">\"this IS Research\" podcast (Recker)</a> \u00b7 <a href=\"https://www.aeaweb.org/resources/online-seminars\" target=\"_blank\" rel=\"noopener\">AEA online seminars</a></li></ul>\n<h3 class=\"wg-h3\">Venues and deadlines (from the CDIN page)</h3>\n<ul class=\"wg-ul\"><li>ICIS (December; papers due May 1) \u00b7 AMCIS (August; papers due March 1) \u00b7 CIST (October; deadline early-to-mid June) \u00b7 WITS (December, after ICIS; deadline early August) \u00b7 WISE (December; deadline August) \u00b7 AOM Annual Meeting (August; deadline around January 9\u201310, IS scholars usually in CTO or TIM). Doctoral consortiums run at ICIS, AMCIS, CIST, and AOM \u2014 ICIS's suits students who have proposed but not yet defended.</li></ul>\n<h3 class=\"wg-h3\">The theorizing canon (companion to Stage 2 of the Research Craft)</h3>\n<p class=\"wg-p\">The readings behind the theorizing chapters, grouped by problem. Links go to publisher/DOI records.</p>\n<ul class=\"wg-ul\"><li><strong>What theory is \u2014 and is not.</strong> A shared vocabulary for what makes an account a theory: <a href=\"https://doi.org/10.5465/amr.1989.4308374\" target=\"_blank\" rel=\"noopener\">Bacharach (1989)</a> \u00b7 <a href=\"https://doi.org/10.2307/2393788\" target=\"_blank\" rel=\"noopener\">Sutton &amp; Staw (1995)</a> \u00b7 <a href=\"https://doi.org/10.2307/2393789\" target=\"_blank\" rel=\"noopener\">Weick (1995)</a> \u00b7 <a href=\"https://doi.org/10.2307/2393790\" target=\"_blank\" rel=\"noopener\">DiMaggio (1995)</a> \u00b7 <a href=\"https://doi.org/10.5465/amr.1989.4308371\" target=\"_blank\" rel=\"noopener\">Whetten (1989)</a></li><li><strong>Finding the question.</strong> Surfacing assumptions worth challenging: <a href=\"https://doi.org/10.5465/amr.2011.59330882\" target=\"_blank\" rel=\"noopener\">Alvesson &amp; Sandberg (2011)</a> \u00b7 <a href=\"https://doi.org/10.1177/0149206307307636\" target=\"_blank\" rel=\"noopener\">Locke (2007)</a></li><li><strong>Building theory from cases and processes.</strong> Theorizing sequences and mechanisms: <a href=\"https://doi.org/10.2307/258557\" target=\"_blank\" rel=\"noopener\">Eisenhardt (1989)</a> \u00b7 <a href=\"https://doi.org/10.2307/259349\" target=\"_blank\" rel=\"noopener\">Langley (1999)</a> \u00b7 <a href=\"https://doi.org/10.5465/amr.1995.9508080329\" target=\"_blank\" rel=\"noopener\">Van de Ven &amp; Poole (1995)</a> \u00b7 <a href=\"https://doi.org/10.1287/orsc.14.5.528.16760\" target=\"_blank\" rel=\"noopener\">Pentland (2003)</a></li><li><strong>Constructs and measurement models.</strong> Reflective vs formative, multidimensional constructs: <a href=\"https://doi.org/10.1086/376806\" target=\"_blank\" rel=\"noopener\">Jarvis, MacKenzie &amp; Podsakoff (2003)</a> \u00b7 <a href=\"https://doi.org/10.2307/25148814\" target=\"_blank\" rel=\"noopener\">Petter, Straub &amp; Rai (2007)</a> \u00b7 <a href=\"https://doi.org/10.5465/amr.1998.1255636\" target=\"_blank\" rel=\"noopener\">Law, Wong &amp; Mobley (1998)</a> \u00b7 <a href=\"https://doi.org/10.1037/0021-9010.83.2.234\" target=\"_blank\" rel=\"noopener\">Chan (1998)</a>
