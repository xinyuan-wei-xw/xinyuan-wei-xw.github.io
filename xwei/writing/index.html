var GUIDE_HTML = "<div class=\"toc\"><a href=\"#part-1-start-with-the-research-problem\">Part 1</a><a href=\"#part-2-prepare-to-write\">Part 2</a><a href=\"#part-3-the-anatomy-of-a-research-paper\">Part 3</a><a href=\"#part-4-polish-cite-and-stay-honest\">Part 4</a><a href=\"#part-5-common-assignment-types\">Part 5</a><a href=\"#part-6-from-my-secret-garden-resources-a\">Part 6</a><a href=\"#sources\">Sources</a></div>\n<h1 class=\"page\">Writing Guide: Organizing and Writing a Research Paper</h1>\n<p class=\"wg-p\">Compiled on October 8, 2026 from two university library guides (USC Libraries and Sacred Heart University) and resources saved in Xinyuan's Secret Garden. One rule sits above everything in this guide: the requirements of your professor, your target journal, and your institution always win over general advice like this.</p>\n<h2 class=\"wg-h2\" id=\"part-1-start-with-the-research-problem\">Part 1 \u00b7 Start with the research problem</h2>\n<ul class=\"wg-ul\"><li><strong>A topic is not a problem.</strong> A topic names an area; a research problem names something in that area that needs investigation and can answer the question \"so what?\" Give the problem clear boundaries, define its key concepts and variables, and avoid value-laden or jargon-heavy wording.</li><li><strong>Narrow a broad topic</strong> by aspect, component, place, time period, relationship, or population \u2014 apply one narrowing move at a time so you do not overshoot. <strong>Broaden a thin topic</strong> with who / what / where / when / how / why questions to find neighbouring angles, then narrow again. If your topic is very current and lacks scholarly coverage, borrow grounding from comparable historical cases, expert commentary, and government or research-centre reports.</li><li><strong>Choose the design after the problem.</strong> The common menu: experimental, quasi-experimental, descriptive, causal-comparative, correlational, case study, ethnographic / field research, historical, longitudinal, cross-sectional, cohort, action, exploratory, philosophical, sequential, mixed-method, meta-analysis, systematic review, and photovoice. Each has different strengths; pick the one that fits the problem and say plainly what data you need and how you will analyse it.</li><li><strong>Design flaws to avoid:</strong> a vague or ill-defined problem, no theoretical framework, unclear significance, only summarizing prior work, a narrow provincial scope, convenience sampling, unclear instruments or statistics, unexplained jargon, unaddressed ethics, and unstated limitations.</li><li><strong>Theoretical framework:</strong> choose the theory (or theories) that explain why your problem exists, make your assumptions explicit, and carry the framework through the analysis and discussion \u2014 do not quote it in the introduction and abandon it. A hypothesis is a specific, testable prediction; a theory is broader and more established.</li><li><strong>Variables:</strong> the independent variable is the presumed cause (what varies or is manipulated); the dependent variable is the presumed effect (what you measure). Name both early, and define and operationalize them in the Methods so the study can be replicated.</li></ul>\n<h2 class=\"wg-h2\" id=\"part-2-prepare-to-write\">Part 2 \u00b7 Prepare to write</h2>\n<ul class=\"wg-ul\"><li><strong>Work backwards from the due date.</strong> Break the paper into stages (search, outline, draft, revise, proofread) and put each on the calendar.</li><li><strong>Outline before drafting.</strong> Use a topic outline (phrases) or a sentence outline \u2014 pick one and stay consistent. Structure it as problem, then main categories, then supporting points. A <strong>reverse outline</strong> (writing down what each finished paragraph actually says) is the fastest way to diagnose a disorganized draft.</li><li><strong>Choosing a title:</strong> draft a working title early, finalize it last. Aim for 10\u201315 substantive words that name the key variables and scope, use current field terminology, and skip abbreviations and filler openings. A subtitle can carry the geographic, temporal, or population qualifier.</li><li><strong>Academic style:</strong> formal, precise, thesis-driven, evidence-based. Prefer the active voice; define abbreviations at first use; avoid contractions, slang, and superlatives; present opposing views fairly; use jargon accurately and sparingly. Passive voice is acceptable when the actor does not matter (check your instructor's or journal's preference). Present tense states accepted facts; past tense reports your own results.</li><li><strong>Paragraphs:</strong> one controlling idea each \u2014 topic sentence, evidence or analysis, concluding or transition sentence. Split paragraphs that carry two ideas; make sure each ties back to the research problem.</li><li><strong>Reading research effectively:</strong> skim strategically (title, abstract, headings, figures) before deep reading; check author expertise; track each paper's problem, argument, evidence, and gaps in margin notes \u2014 you are harvesting material for your own project, not just \"understanding\" the paper.</li><li><strong>Critical thinking:</strong> evaluate claims, evidence, and assumptions instead of summarizing uncritically; consider alternative interpretations; synthesize across sources; watch for fallacious reasoning.</li><li><strong>Write concisely:</strong> cut redundancy and filler, prefer strong verbs and precise words, keep sentences direct \u2014 especially in the final pass.</li></ul>\n<h2 class=\"wg-h2\" id=\"part-3-the-anatomy-of-a-research-paper\">Part 3 \u00b7 The anatomy of a research paper</h2>\n<h3 class=\"wg-h3\">Abstract</h3>\n<p class=\"wg-p\">One paragraph, usually 300 words or fewer, in this order: purpose or problem, basic design, major findings, brief interpretation or conclusions. Write it last. Past tense, complete sentences. Leave out background detail, citations, abbreviations, and figures. Warning: never cite a source based only on its abstract. (An <strong>executive summary</strong> is different: a stand-alone mini-paper of 1\u201310 pages for decision-makers that foregrounds recommendations.)</p>\n<h3 class=\"wg-h3\">Introduction</h3>\n<p class=\"wg-p\">Move from general to specific: establish why the topic matters, summarize what is known, identify the gap or niche, then state your purpose, research question or hypothesis, rationale, and method preview \u2014 ending with a roadmap of the paper. Include just enough background (historical, social, economic, political context and foundational findings) for the reader to grasp the problem; state your delimitations (boundaries you chose). The <strong>CARS model</strong> (Swales) formalizes this in three moves: (1) establish the territory \u2014 the topic matters, here is what prior research says; (2) establish the niche \u2014 a gap, counter-claim, or open question; (3) occupy the niche \u2014 your purpose, your study, a preview of findings and structure. Avoid opening with a dictionary definition. Many writers finish the introduction late in the drafting process.</p>\n<h3 class=\"wg-h3\">Literature review</h3>\n<p class=\"wg-p\">A literature review is a summary <strong>plus a synthesis</strong>: survey, summarize, and critically evaluate the scholarly conversation so readers can see where your study fits. Choose an organizing logic \u2014 chronological, thematic, or methodological \u2014 and evaluate each source on provenance, objectivity, persuasiveness, and value. Avoid piling up unrelated sources, accepting claims uncritically, relying only on secondary coverage, or omitting contrary results. You can stop searching when the same findings and citations keep repeating.</p>\n<p class=\"wg-p\">Supporting crafts: <strong>citation tracking</strong> (follow who cited a landmark paper to find newer work and gauge impact), <strong>content alerts</strong> (table-of-contents and saved-search alerts so new articles find you), and a <strong>deliberate search strategy</strong> \u2014 key concepts, controlled vocabulary vs. keywords, Boolean AND/OR/NOT, phrase searching, truncation and wildcards, proximity operators, filters, and saved searches.</p>\n<p class=\"wg-p\">Know your source types: <strong>primary</strong> sources are original, uninterpreted records from the time or participants (interviews, diaries, records, artifacts); <strong>secondary</strong> sources interpret them later (most journal articles and books) and make up the bulk of a review; <strong>tertiary</strong> sources compile and index (encyclopedias, dictionaries, databases) and are starting points, not core evidence. Academic databases, publisher sites, and Google Scholar are the standard hunting grounds.</p>\n<h3 class=\"wg-h3\">Methodology</h3>\n<p class=\"wg-p\">Write in the past tense with replication-level detail: overall approach and why it fits the problem and design, data collection, sampling rationale, analysis approach, and anticipated limitations or confounds with how you handled them. Cite sources for method choices; skip tutorial explanations.</p>\n<p class=\"wg-p\"><strong>Qualitative designs</strong> (meaning, process, context through words and observation) are naturalistic and emergent, use purposive sampling, and analyse inductively and holistically, with reflexivity about the researcher's role. If you study a group you belong to (<strong>insiderness</strong>), state your position explicitly and guard against assumed understanding and over-rapport. Human-subjects work typically needs Institutional Review Board (IRB) approval and informed consent.</p>\n<p class=\"wg-p\"><strong>Quantitative designs</strong> measure numerically with larger, representative samples and structured instruments; descriptive designs show associations, experimental designs can support causal claims \u2014 never claim causality from a non-experimental design. Report data cleaning, missing-data handling, test choice and assumptions, descriptive statistics, and effect sizes with significance. Use tables for exact values, figures for patterns.</p>\n<h3 class=\"wg-h3\">Results</h3>\n<p class=\"wg-p\">Past tense, no interpretation. Restate the problem briefly, then present key results in the same order as the Methods (usually), with numbered tables and figures. Include negative results. Do not present raw data (appendices hold that), repeat the same data in text and table, or speculate about meaning \u2014 that is the Discussion's job. Every non-textual element should be numbered, captioned, referenced in the text in order, and understandable on its own.</p>\n<h3 class=\"wg-h3\">Discussion</h3>\n<p class=\"wg-p\">Interpret, in the same order as the Results: restate the problem and major findings, explain expected and unexpected results, compare with prior studies, consider alternative explanations, and state implications \u2014 and any new hypothesis your results suggest. <strong>Limitations</strong> belong at the start or end of the Discussion: for each one, describe it, explain why it was unavoidable, and assess its actual impact on your conclusions. Negative results are findings, not limitations. Avoid introducing new results, merely restating results, over-interpreting, or speculating without flagging it as speculation.</p>\n<h3 class=\"wg-h3\">Conclusion and appendices</h3>\n<p class=\"wg-p\">The conclusion synthesizes rather than summarizes: restate the argument, place findings in the larger field, and answer \"so what?\" \u2014 significance and future research. Specific to general. No new information, no apologies, no stock closers. Appendices hold non-essential supplements (raw data, instruments, transcripts, detailed tables): one per topic, titled, each starting on a new page, ordered as first referenced in the text. The paper must stand without them.</p>\n<h2 class=\"wg-h2\" id=\"part-4-polish-cite-and-stay-honest\">Part 4 \u00b7 Polish, cite, and stay honest</h2>\n<ul class=\"wg-ul\"><li><strong>Proofreading:</strong> revise big-picture structure first, then proofread after a break from the draft. Read aloud or on paper, check one error type at a time, search for your personal error patterns, verify homonyms, and get a second reader. Work in short, focused sessions.</li><li><strong>Frequent grammar traps:</strong> affect/effect, apostrophes, comma splices, dangling participles, sentence fragments, subject\u2013verb agreement, tense consistency, that/which, its/it's, fewer/less, who/whom, vague \"this/it\", semicolon misuse, and clumsy quote integration.</li><li><strong>Citing sources:</strong> cite every borrowed idea, fact, quotation, and paraphrase in the required style, consistently. Common knowledge is the exception; when in doubt, cite. Consistent citation shows you did the reading, lets readers verify, and protects your credibility.</li><li><strong>Plagiarism</strong> includes copying text, submitting someone else's work, pasting without attribution, and fabricating sources or data. Credit ideas and theories, non-common-knowledge facts and visuals, quotations, and paraphrases.</li><li><strong>Footnotes vs. endnotes:</strong> footnotes are visible but clutter the page; endnotes keep pages clean but force flipping. Either way, number consecutively, use notes only for supplementary material, and follow one system consistently.</li><li><strong>Generative AI and writing:</strong> follow your professor's, institution's, and target journal's rules. Verify anything AI produces (it can fabricate), disclose or cite AI assistance as required, and never submit AI output as your own analysis.</li></ul>\n<h2 class=\"wg-h2\" id=\"part-5-common-assignment-types\">Part 5 \u00b7 Common assignment types</h2>\n<ul class=\"wg-ul\"><li><strong>Annotated bibliography:</strong> a citation list with a descriptive, summative, or (most commonly assigned) evaluative note per source \u2014 its argument, method, evidence, limitations, and usefulness to your project. Open with a brief note on how sources were selected; annotations run about 300 words unless the assignment says otherwise.</li><li><strong>Analyzing a scholarly journal article:</strong> pick an empirical article and critique it in order \u2014 brief introduction (problem, design, measures or data sources, author credentials), the literature review (currency, relevance, gaps, objectivity), methods (design fit, sampling, reliability/validity, ethics, statistics and visuals), results (accuracy, alternative interpretations), discussion (meaning, generalizability, bias), writing style, and an overall evaluation. Avoid quoting; critical analysis is shown by the depth of your questions, not by retelling findings.</li><li><strong>Case analysis vs. case study:</strong> a case analysis dissects an existing case (e.g., a Harvard-style case) to recommend a resolution \u2014 background, prioritized problems, proposed solutions, action plan; it applies course theory to the case and needs no literature review or methods of your own. A case study is a research paper examining a person, place, event, or phenomenon in depth; choose the case because it is atypical, illuminates a hidden problem, challenges assumptions, supports action, or opens a new direction, and follow the standard paper structure (Introduction, Literature Review, Method with a non-random case-selection rationale, Discussion, Conclusion). Beware overgeneralization and undocumented limitations in both.</li><li><strong>Field report:</strong> links theory to observed practice. Observe under an explicit theoretical framework; take structured <strong>field notes</strong> that keep description (setting, participants, interactions, near-verbatim remarks) separate from reflection (impressions, questions, emerging interpretations), writing them promptly. Report in the past tense: objective and theory, setting, methods, description, interpretation grounded in the observed evidence, recommendations with limitations, appendix, references. <strong>Informed consent</strong> \u2014 voluntary, documented, in plain language, with the right to withdraw \u2014 is required unless your IRB rules an exemption (e.g., pure public-space observation); check first.</li><li><strong>Policy memo:</strong> a decision document for a named audience, not a thesis paper. Use headings and plain professional language: problem definition, brief methods, issue analysis, proposed solutions, strategic recommendations (who does what by when, plus the cost of inaction), and honest limitations; a cost\u2013benefit summary is optional. Evidence-based, feasible, and measurable.</li><li><strong>Research proposal:</strong> justify a study not yet run, typically 10\u201315 pages: introduction, background and significance, literature review organized by theme (cite, compare, contrast, critique, connect), design and methods argued as the best fit, anticipated implications, brief conclusion, references. Delimit the boundaries and cite the landmark studies.</li><li><strong>Book review:</strong> usually a critical 500\u20131,000 words. Identify the book's thesis, coverage, evidence, structure, and method; judge whether it achieves its purpose, contributes something, stays objective, and omits anything important \u2014 with textual evidence and comparison to related work. A <strong>multiple book review essay</strong> (2\u20136 related books) unifies them under your own thesis, block-by-book for short pieces or point-by-point for longer ones; evaluate more than you summarize. For <strong>edited volumes</strong>, analyse by themes across essays rather than chapter by chapter.</li><li><strong>Reflective paper:</strong> examine an experience through your course's concepts \u2014 what happened, what it connects to, what you take forward.</li><li><strong>Oral presentation:</strong> you are writing for listeners: define the goal, keep a few key points, forecast\u2013present\u2013summarize, signpost transitions, rehearse out loud and time yourself. Do not read an essay aloud or apologize. Slides support, never replace, the talk: few words (about 6 per line, 6 lines per slide), readable contrast, minimal abbreviations; pause so people can absorb them, and keep a non-tech backup. Nervousness is managed by preparation and rehearsal, breathing and slowing down \u2014 never by announcing it. For group projects: fix roles and contacts early, distribute dated tasks fairly, check in often, assemble and copyedit the whole for one consistent voice, and raise non-contribution immediately.</li><li><strong>Publishing your research</strong> (after the paper): choose a venue that fits the contribution, prepare the manuscript exactly to its requirements, treat peer review as an improvement process, revise and respond carefully, and build your scholarly profile as you go.</li></ul>\n<h2 class=\"wg-h2\" id=\"part-6-from-my-secret-garden-resources-a\">Part 6 \u00b7 From my Secret Garden \u2014 resources already saved</h2>\n<p class=\"wg-p\">Drawn from the \"IS Study Resource\" note in the Secret Garden (itself gathered from the CDIN page https://www.cdin.net/f172) \u2014 the slices most relevant to designing, writing, and publishing research.</p>\n<h3 class=\"wg-h3\">Methods training (GSU syllabi)</h3>\n<ul class=\"wg-ul\"><li><a href=\"https://www.cdin.net/s/ECON-9710-Econometrics-I.pdf\" target=\"_blank\" rel=\"noopener\">ECON 9710 Econometrics I</a> \u00b7 <a href=\"https://www.cdin.net/s/ECON-9720-Econometrics-II.pdf\" target=\"_blank\" rel=\"noopener\">ECON 9720 Econometrics II</a> \u00b7 <a href=\"https://www.cdin.net/s/ECON-9730-Advanced-Econometrics.pdf\" target=\"_blank\" rel=\"noopener\">ECON 9730 Advanced Econometrics</a></li><li><a href=\"https://www.cdin.net/s/ECON-8899-Causal-Inference-Syllabus-2022-Carattini.pdf\" target=\"_blank\" rel=\"noopener\">ECON 8899 Causal Inference (Carattini)</a> \u00b7 <a href=\"https://www.cdin.net/s/Econ9760-Syllabus-Spring2023.pdf\" target=\"_blank\" rel=\"noopener\">ECON 9760 (Spring 2023)</a></li><li><a href=\"https://www.cdin.net/s/MGT-9940-Design-of-Experiments.pdf\" target=\"_blank\" rel=\"noopener\">MGT 9940 Design of Experiments</a></li><li><a href=\"https://www.cdin.net/s/IFI-9000-Research-Methods-with-Analytics.pdf\" target=\"_blank\" rel=\"noopener\">IFI 9000 Research Methods with Analytics</a> \u00b7 <a href=\"https://www.cdin.net/s/IFI-9010-Advanced-Topics-in-Analytics.pdf\" target=\"_blank\" rel=\"noopener\">IFI 9010 Advanced Topics in Analytics</a></li><li><a href=\"https://www.cdin.net/s/BA-9260-Theory-Development.pdf\" target=\"_blank\" rel=\"noopener\">BA 9260 Theory Development</a> \u2014 directly useful for Part 1's theoretical-framework work.</li><li><a href=\"https://www.cdin.net/s/CIS-9200-Text-Analysis.pdf\" target=\"_blank\" rel=\"noopener\">CIS 9200 Text Analysis (Lin)</a></li></ul>\n<h3 class=\"wg-h3\">Books on the shelf</h3>\n<ul class=\"wg-ul\"><li><a href=\"https://mixtape.scunning.com/\" target=\"_blank\" rel=\"noopener\">Causal Inference: The Mixtape (Cunningham)</a> \u00b7 <a href=\"https://www.mostlyharmlesseconometrics.com/book-contents/\" target=\"_blank\" rel=\"noopener\">Mostly Harmless Econometrics</a> \u00b7 <a href=\"https://users.ssc.wisc.edu/~bhansen/econometrics/\" target=\"_blank\" rel=\"noopener\">Hansen, Econometrics</a></li><li><a href=\"https://www.amazon.com/Writing-Doctoral-Dissertation-Gordon-Davis/dp/0812098005/\" target=\"_blank\" rel=\"noopener\">Writing the Doctoral Dissertation (Davis)</a> \u2014 a systematic guide to dissertation writing.</li><li><a href=\"https://www.vvenkatesh.com/road-to-success\" target=\"_blank\" rel=\"noopener\">Road to Success (Venkatesh)</a> \u2014 succeeding in the PhD and beyond.</li></ul>\n<h3 class=\"wg-h3\">Craft of publishing</h3>\n<ul class=\"wg-ul\"><li><a href=\"https://www.apa.org/pubs/journals/features/apl-manuscript-checklist.pdf\" target=\"_blank\" rel=\"noopener\">JAP manuscript checklist (APA)</a> \u2014 a pre-submission checklist from the Journal of Applied Psychology.</li><li><a href=\"https://www.cdin.net/s/Qual-Zoom-for-Authors.pdf\" target=\"_blank\" rel=\"noopener\">MISQ Seminar: Qualitative Methods for IS (slides)</a></li><li><a href=\"https://www.cdin.net/s/The_Publication_Cycle_A_to_Z_CAM.pptx\" target=\"_blank\" rel=\"noopener\">The Publication Cycle A to Z (Robey, CIS 9390 Journal Club)</a> \u2014 how publishing works, end to end.</li><li><a href=\"https://libguides.usc.edu/writingguide/publishing\" target=\"_blank\" rel=\"noopener\">USC: Publishing Your Research</a> \u2014 venue choice, submission, peer review, revision.</li></ul>\n<h3 class=\"wg-h3\">Seminars and community</h3>\n<ul class=\"wg-ul\"><li><a href=\"https://sites.google.com/view/ocis/home\" target=\"_blank\" rel=\"noopener\">Causal Inference Seminar (OCIS)</a> \u00b7 <a href=\"https://www.janrecker.com/this-is-research-podcast/\" target=\"_blank\" rel=\"noopener\">\"this IS Research\" podcast (Recker)</a> \u00b7 <a href=\"https://www.aeaweb.org/resources/online-seminars\" target=\"_blank\" rel=\"noopener\">AEA online seminars</a></li></ul>\n<h3 class=\"wg-h3\">Venues and deadlines (from the CDIN page)</h3>\n<ul class=\"wg-ul\"><li>ICIS (December; papers due May 1) \u00b7 AMCIS (August; papers due March 1) \u00b7 CIST (October; deadline early-to-mid June) \u00b7 WITS (December, after ICIS; deadline early August) \u00b7 WISE (December; deadline August) \u00b7 AOM Annual Meeting (August; deadline around January 9\u201310, IS scholars usually in CTO or TIM). Doctoral consortiums run at ICIS, AMCIS, CIST, and AOM \u2014 ICIS's suits students who have proposed but not yet defended.</li></ul>\n<h2 class=\"wg-h2\" id=\"sources\">Sources</h2>\n<p class=\"wg-p\">Guides (consulted October 8, 2026; summaries above are in the compiler's own words):</p>\n<ul class=\"wg-ul\"><li>USC Libraries, \"Organizing Your Social Sciences Research Paper\" (Dr. Robert V. Labaree) \u2014 https://libguides.usc.edu/writingguide \u2014 including its pages on the research problem, narrowing/broadening, variables (https://libguides.usc.edu/writingguide/variables), the C.A.R.S. model (https://libguides.usc.edu/writingguide/CARS), literature search strategies (https://libguides.usc.edu/writingguide/LiteratureSearching), insiderness (https://libguides.usc.edu/writingguide/insiderness), generative AI and writing (https://libguides.usc.edu/writingguide/AIwriting), and publishing your research (https://libguides.usc.edu/writingguide/publishing).</li><li>USC Libraries, \"Organizing Your Social Sciences Research Assignments\" \u2014 https://libguides.usc.edu/writingguide/assignments \u2014 including Analyzing a Scholarly Journal Article (https://libguides.usc.edu/writingguide/assignments/AnalyzingJournal), Writing a Case Analysis Paper (https://libguides.usc.edu/writingguide/assignments/caseanalysis), and Writing a Case Study (https://libguides.usc.edu/writingguide/assignments/casestudy).</li><li>Sacred Heart University Library, \"Organizing Academic Research Papers\" (based on Dr. Labaree's USC materials) \u2014 https://library.sacredheart.edu/organizing-research-papers \u2014 its numbered sections 1\u201311 mirror the USC research-paper guide.</li><li>Center for Digital Innovation (GSU), \"Studying and Researching\" \u2014 https://www.cdin.net/f172 \u2014 conferences, doctoral consortiums, and deadlines in Part 6.</li><li>Xinyuan's Secret Garden, note \"IS Study Resource\" (saved October 4, 2026) \u2014 course, book, seminar, and publishing links in Part 6: https://xinyuan-wei-xw.github.io/xwei/notes/ (sign-in required).</li><li>Journal of Applied Psychology manuscript checklist (APA) \u2014 https://www.apa.org/pubs/journals/features/apl-manuscript-checklist.pdf</li></ul>\n<p class=\"wg-p\">Compiled for Xinyuan's Secret Garden \u00b7 October 8, 2026</p>";
