<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Dream Life · Xinyuan’s Secret Garden</title>
<link rel="stylesheet" href="/xwei/xwei.css">
<style>
.sec{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:16px 0}
.sec h3{margin:0 0 2px;font-size:1.05em}
.sec .hint{color:var(--soft);font-size:13px;margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:13.5px;cursor:pointer;font-family:inherit;color:var(--ink)}
.chip.on{background:#fdf3e3;border-color:#e8cf9f;color:#8a5a12;font-weight:700}
.affbox{background:var(--warm);border:1px solid #f0e2c8;border-radius:14px;padding:18px 20px;margin:6px 0 10px}
.afftext{font-size:18px;line-height:1.8}
.affzh{font-size:15.5px;line-height:1.85;color:#5a4632;margin-top:8px}
.storybox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:6px 0 10px}
.storytext{font-size:15.5px;line-height:1.9;white-space:pre-wrap}
.storytext:empty{display:none}
.player{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.player .btn{flex:none}
select.voicesel{width:auto;max-width:260px;padding:7px 10px;font-size:13.5px}
input[type=range].vol{width:120px;padding:0}
.srow{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:8px}
.srow .sname{flex:none;width:110px;font-weight:700;font-size:14px}
.srow .sname span{display:block;font-weight:400;font-size:12px;color:var(--soft)}
.srow input[type=range]{flex:1}
.sbtn{border:1px solid var(--line);background:#fff;border-radius:999px;width:34px;height:34px;font-size:14px;cursor:pointer;flex:none;font-family:inherit}
.sbtn.on{background:#fdf3e3;border-color:#e8cf9f}
.saveditem{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;font-family:inherit;margin-bottom:8px}
.saveditem:hover{background:#fffaf2}
.saveditem b{font-size:14px;color:var(--ink)}
.saveditem span{display:block;font-size:12.5px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap}
.rowbtns .btn{width:auto}
.note{font-size:13px;color:var(--soft)}
</style>
</head>
<body>
<div id="gate"></div>
<div id="app" style="display:none"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<script src="/xwei/xwei.js"></script>
<script>
/* 🌟 Dream Life — sleep stories, affirmations and soundscapes for the
   Secret Garden. No cloud voice, no subscription, no AI model:
   stories and affirmations are woven on your device from your own words
   in "My Life in a Few Years?", narrated by your device's built-in voice
   (speechSynthesis) and mixed with soundscapes generated by Web Audio.
   Nothing here is audible or visible until you sign in. */
var $ = function(s){ return document.querySelector(s); };
var dream = {focus:"become", lang:"en", rate:0.9, voiceURI:"", sounds:{}, savedAff:[], savedStories:[]};
var life = {oneLiner:"", sections:{}};
var saveT = null;

var THEMES = [
  {k:"work",    en:"Work",        zh:"事业"},
  {k:"home",    en:"Home",        zh:"家"},
  {k:"people",  en:"People",      zh:"身边的人"},
  {k:"rhythm",  en:"Daily rhythm",zh:"日常节奏"},
  {k:"health",  en:"Body",        zh:"身体"},
  {k:"become",  en:"Becoming",    zh:"成为谁"},
  {k:"tenYears",en:"In ten years",zh:"十年后"}
];
function pick(s){ return (s && String(s).trim()) || ""; }
function slot(key, fb){
  var v = pick(life.sections && life.sections[key]);
  if(v){
    /* first sentence only — keeps the story readable */
    var s = v.split(/[\n。！？.!?]/).filter(function(x){ return x.trim(); })[0] || v;
    return s.trim();
  }
  return fb;
}
function hash(s){ var h = 0; for(var i = 0; i < s.length; i++){ h = (h * 31 + s.charCodeAt(i)) >>> 0; } return h; }
function todayKey(){ var d = new Date(); return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate(); }

/* ---------- affirmations: templates filled with her own words ---------- */
var AFF_EN = [
  "I am becoming {become}. Every small step today is already that life.",
  "My work is {work} — and I do it in my own rhythm, one steady day at a time.",
  "Home is {home}. I am building it slowly, and it is already mine.",
  "I am surrounded by {people}. I give generously, and I receive generously.",
  "My days feel like {rhythm}. Busy when it matters, slow when I need it.",
  "My body carries me through {health}. I take care of it, and it takes care of me.",
  "Ten years from now, {tenYears}. I am already walking toward that morning.",
  "The life I want is: {one}. I do not have to earn it all today — I only have to begin.",
  "I trust my own pace. What is meant for me is already on its way.",
  "I am enough for the life I am building — and the life is already beginning."
];
var AFF_ZH = [
  "我正在成为{become}。今天的每一步，都已经是那种生活。",
  "我的工作是{work}，我按自己的节奏，一天一天稳稳地做。",
  "家是{home}。我慢慢地建造它，它已经是我的了。",
  "我身边有{people}。我慷慨地给予，也坦然地接受。",
  "我的日子是这样的：{rhythm}。该忙的时候忙，该慢的时候慢。",
  "我的身体陪我走过{health}。我照顾它，它也照顾我。",
  "十年后，{tenYears}。我已经在走向那个清晨。",
  "我想要的生活是：{one}。我不需要今天就全部实现，我只需要开始。",
  "我信任自己的节奏。属于我的，正在来的路上。",
  "我已经配得上自己正在建造的生活——而生活已经开始了。"
];
function fillAff(t){
  return t.replace("{become}", slot("become","the person I want to be"))
    .replace("{work}", slot("work","the work I love"))
    .replace("{home}", slot("home","a home that feels like mine"))
    .replace("{people}", slot("people","people I love"))
    .replace("{rhythm}", slot("rhythm","a good rhythm"))
    .replace("{health}", slot("health","a strong, cared-for body"))
    .replace("{tenYears}", slot("tenYears","an ordinary morning, ten years from now"))
    .replace("{one}", pick(life.oneLiner) || "a life that feels like mine");
}
function affirmFor(seedStr){
  var en = AFF_EN[hash(seedStr) % AFF_EN.length];
  var zh = AFF_ZH[hash(seedStr + "zh") % AFF_ZH.length];
  return {en: fillAff(en), zh: fillAff(zh)};
}

/* ---------- sleep stories: opening + theme middle + closing ---------- */
var OPEN_EN = [
  "It is late, and the day is folding itself away. You are lying down now, warm under the covers, and there is nowhere you need to be. Let your shoulders drop. Breathe in, slow. Breathe out, slower. Tonight, you get to visit the life you are building — not as a plan, not as a list, but as a day already lived.",
  "Close your eyes. The room is quiet, the light is low, and the whole day is behind you. You did enough today. Now, for a little while, you can step into the future you are quietly building — and walk around in it, the way you would walk around a home that is already yours."
];
var OPEN_ZH = [
  "夜深了，白天正慢慢收起来。你现在躺下来，暖暖地盖着被子，哪里都不用去。让肩膀松下来。慢慢吸气，再慢慢呼气。今晚，你可以去拜访自己正在建造的生活——不是计划，不是清单，而是已经过上的一天。",
  "闭上眼睛。房间很安静，光很暗，一整天都在身后了。你今天已经做得够多了。现在，你可以走进自己正在悄悄建造的未来，在里面走一走，就像走进一间已经属于你的房子。"
];
var CLOSE_EN = [
  "The day is done, and it was good. You did not have to force any of it — it simply grew, the way it grows now, one honest day at a time. Sleep now. The life you visited tonight is still there in the morning, waiting for you to take one more small step toward it.",
  "And that is the whole of it: an ordinary day, in a life that feels like yours. Nothing spectacular, nothing missing. Let the story fade now, the way dreams do. Sleep well — tomorrow you get to live one more page of it."
];
var CLOSE_ZH = [
  "这一天过完了，很好。你不需要强求任何事——它就是这样长出来的，和现在一样，一天一天，诚实地长大。睡吧。今晚你拜访过的生活，明早还在那里，等你再朝它走一小步。",
  "就是这样：平凡的一天，过着属于自己的生活。没什么轰轰烈烈，也没什么缺失。让故事像梦一样慢慢淡去吧。好好睡——明天，你又可以活出其中的一页。"
];
var MID_EN = {
  work: "In the morning you wake to work that feels like {work}. The people around you are curious and kind, and the questions you chase are the ones that actually matter to you. You lose track of time once or twice — not because you are rushed, but because the work pulls you in. When the day ends, you close your notebook knowing you moved something real, even if it was small.",
  home: "Your home is {home}. In the morning, light comes through the windows the way you always imagined, and the rooms are quiet except for the small sounds of a house being lived in. Everything has a place. Nothing is crowded. In the evening you sit in your favourite spot, and the whole house feels like an exhale.",
  people: "The people around you are {people}. Someone makes tea while you finish a thought. Dinner is unhurried — stories, laughter, a question that lingers. You do not have to perform for anyone here. You are known, and you are at ease, and that is enough.",
  rhythm: "Your days move like {rhythm}. There is a morning part for deep work, an afternoon part for people and fresh air, and an evening that belongs to you. You are busy when it matters and slow when you need it, and the week has a shape you can trust.",
  health: "Your body feels like {health}. You move every day — a walk, a stretch, something that reminds you you are alive in your skin. You eat well, you sleep deeply, and your energy is steady instead of borrowed. Your body is not a project. It is a home you take care of.",
  become: "You are becoming {become}. Not all at once — the way a tree grows, quietly, while no one is watching. Today you kept a promise to yourself. Today you chose the harder, kinder thing once. That is how it happens: one small choice, and then another, until one day you look around and realise you are already her.",
  tenYears: "Ten years from now: {tenYears}. You wake without an alarm, and the first thing you do is the thing you love most. The day unfolds the way you designed it — slowly, on purpose. It is not a fantasy. It is the same life you are living now, grown ten years taller."
};
var MID_ZH = {
  work: "早上醒来，你的工作是这样的：{work}。身边的人好奇又友善，你们追的问题，都是你真正在乎的问题。一天里有一两次，你忘了时间——不是因为赶，而是因为工作本身吸引着你。傍晚合上笔记本时，你知道自己推动了一件真实的事，哪怕很小。",
  home: "你的家是这样的：{home}。早上，光从窗户照进来，和你一直想象的一样，房间里很安静，只有房子被住着的细小声音。每样东西都有自己的位置，一点也不拥挤。晚上你坐在最喜欢的角落，整间房子像一次深深的呼气。",
  people: "你身边的人是这样的：{people}。有人在你想完一件事时泡好了茶。晚饭不赶时间——有故事，有笑声，有一个让人回味的问题。在这里，你不需要表演。你被了解着，也很自在，这就够了。",
  rhythm: "你的日子是这样流动的：{rhythm}。早上有深度工作的时间，下午留给人和新鲜空气，晚上属于你自己。该忙的时候忙，该慢的时候慢，一周有你信得过的形状。",
  health: "你的身体是这样的：{health}。你每天都动一动——散步、拉伸，做点提醒自己活在身体里的事。你吃得好，睡得沉，能量是稳的，不是借来的。身体不是一个项目，它是你照顾着的家。",
  become: "你正在成为{become}。不是一下子——像树长大一样，安静地，在没人看着的时候。今天你兑现了对自己的一个承诺，今天你选了一次更难、也更善良的事。就是这样发生的：一个小选择，再一个小选择，直到有一天你环顾四周，发现自己已经是她了。",
  tenYears: "十年后：{tenYears}。你不用闹钟就醒来，第一件事就是做你最爱的事。这一天按你设计的方式展开——慢慢地，有意识地。这不是幻想，它就是你现在过的生活，长高了十年。"
};
function buildStory(seedStr){
  var lang = dream.lang, th = dream.focus;
  var h = hash(seedStr + th);
  var open = (lang === "zh" ? OPEN_ZH : OPEN_EN)[h % 2];
  var mid = (lang === "zh" ? MID_ZH : MID_EN)[th] || (lang === "zh" ? MID_ZH.become : MID_EN.become);
  var close = (lang === "zh" ? CLOSE_ZH : CLOSE_EN)[(h >> 3) % 2];
  var text = fillAff(open) + "\n\n" + fillAff(mid) + "\n\n" + fillAff(close);
  var title = (lang === "zh" ? "今晚的故事 · " : "Tonight's story · ") +
    (THEMES.filter(function(t){ return t.k === th; })[0] || THEMES[5])[lang === "zh" ? "zh" : "en"];
  return {title: title, text: text};
}

/* ---------- narration: your device's built-in voice ---------- */
var synth = window.speechSynthesis || null;
var speaking = false, speakQueue = [], curUtter = null;
function listVoices(){
  if(!synth) return [];
  return synth.getVoices().filter(function(v){
    return v.lang && (v.lang.toLowerCase().indexOf(dream.lang === "zh" ? "zh" : "en") === 0);
  });
}
function fillVoiceSel(){
  var sel = $("#voiceSel"); if(!sel || !synth) return;
  var vs = listVoices();
  sel.innerHTML = "";
  if(!vs.length){
    var o = document.createElement("option"); o.textContent = dream.lang === "zh" ? "系统默认中文语音" : "System default voice";
    sel.appendChild(o); return;
  }
  vs.forEach(function(v){
    var o = document.createElement("option");
    o.value = v.voiceURI; o.textContent = v.name + " (" + v.lang + ")";
    if(v.voiceURI === dream.voiceURI) o.selected = true;
    sel.appendChild(o);
  });
  if(!dream.voiceURI && vs.length) dream.voiceURI = vs[0].voiceURI;
}
function stopSpeak(){
  speaking = false; speakQueue = [];
  if(synth){ try{ synth.cancel(); }catch(e){} }
  var b = $("#playBtn"); if(b) b.textContent = dream.lang === "zh" ? "▶ 播放故事" : "▶ Play story";
  var a = $("#affPlay"); if(a) a.textContent = "🔊 Listen";
}
function speakNext(){
  if(!speaking || !speakQueue.length){ stopSpeak(); return; }
  var chunk = speakQueue.shift();
  var u = new SpeechSynthesisUtterance(chunk);
  u.lang = dream.lang === "zh" ? "zh-CN" : "en-US";
  u.rate = dream.rate || 0.9;
  var vs = listVoices();
  var v = null;
  vs.forEach(function(x){ if(x.voiceURI === dream.voiceURI) v = x; });
  if(v) u.voice = v;
  u.onend = function(){ if(speaking) speakNext(); };
  u.onerror = function(){ if(speaking) speakNext(); };
  curUtter = u;
  synth.speak(u);
}
function speakText(text){
  if(!synth){
    alert(dream.lang === "zh" ? "这个浏览器不支持语音朗读，试试 Safari 或 Chrome。" : "This browser can't read aloud — try Safari or Chrome.");
    return;
  }
  stopSpeak();
  /* short chunks: long utterances get cut off in some browsers */
  speakQueue = text.split(/(?<=[。！？.!?]\s?)|\n+/).map(function(s){ return s.trim(); }).filter(Boolean);
  speaking = true;
  var b = $("#playBtn"); if(b && text === curStory.text) b.textContent = "⏸ Stop";
  speakNext();
}

/* ---------- soundscapes: generated by Web Audio, no audio files ---------- */
var actx = null, activeSounds = {};
function noiseBuf(ctx){
  var b = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
  var d = b.getChannelData(0);
  for(var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return b;
}
function loopSrc(ctx, buf){
  var s = ctx.createBufferSource(); s.buffer = buf; s.loop = true; return s;
}
function buildSound(name, ctx, out){
  var buf = noiseBuf(ctx), nodes = {stop: function(){}};
  var stopFns = [];
  function wire(src, filt, g){
    src.connect(filt); filt.connect(g); g.connect(out);
    src.start(); stopFns.push(function(){ try{ src.stop(); }catch(e){} });
  }
  if(name === "rain"){
    var lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1400;
    var g = ctx.createGain(); g.gain.value = 0.5;
    wire(loopSrc(ctx, buf), lp, g);
    var hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 3200;
    var g2 = ctx.createGain(); g2.gain.value = 0.12;
    wire(loopSrc(ctx, buf), hp, g2);
  }else if(name === "ocean"){
    var lp2 = ctx.createBiquadFilter(); lp2.type = "lowpass"; lp2.frequency.value = 420;
    var g3 = ctx.createGain(); g3.gain.value = 0.4;
    var lfo = ctx.createOscillator(); lfo.frequency.value = 0.09;
    var lg = ctx.createGain(); lg.gain.value = 0.22;
    lfo.connect(lg); lg.connect(g3.gain); lfo.start();
    stopFns.push(function(){ try{ lfo.stop(); }catch(e){} });
    wire(loopSrc(ctx, buf), lp2, g3);
  }else if(name === "wind"){
    var bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 480; bp.Q.value = 0.7;
    var g4 = ctx.createGain(); g4.gain.value = 0.35;
    var lfo2 = ctx.createOscillator(); lfo2.frequency.value = 0.06;
    var lg2 = ctx.createGain(); lg2.gain.value = 260;
    lfo2.connect(lg2); lg2.connect(bp.frequency); lfo2.start();
    stopFns.push(function(){ try{ lfo2.stop(); }catch(e){} });
    wire(loopSrc(ctx, buf), bp, g4);
  }else if(name === "fire"){
    var lp3 = ctx.createBiquadFilter(); lp3.type = "lowpass"; lp3.frequency.value = 300;
    var g5 = ctx.createGain(); g5.gain.value = 0.4;
    wire(loopSrc(ctx, buf), lp3, g5);
    /* crackles: short random pops */
    var crackleTimer = setInterval(function(){
      if(!activeSounds.fire) return;
      var s = ctx.createBufferSource(); s.buffer = buf;
      s.playbackRate.value = 0.5 + Math.random();
      var bp2 = ctx.createBiquadFilter(); bp2.type = "bandpass"; bp2.frequency.value = 1400 + Math.random() * 1600; bp2.Q.value = 4;
      var gg = ctx.createGain();
      var t = ctx.currentTime;
      gg.gain.setValueAtTime(0.25 + Math.random() * 0.3, t);
      gg.gain.exponentialRampToValueAtTime(0.001, t + 0.05 + Math.random() * 0.08);
      s.connect(bp2); bp2.connect(gg); gg.connect(out);
      s.start(t, Math.random(), 0.15);
    }, 180);
    stopFns.push(function(){ clearInterval(crackleTimer); });
  }else if(name === "night"){
    var lp4 = ctx.createBiquadFilter(); lp4.type = "lowpass"; lp4.frequency.value = 240;
    var g6 = ctx.createGain(); g6.gain.value = 0.16;
    wire(loopSrc(ctx, buf), lp4, g6);
    /* crickets: soft high chirps */
    var chirpTimer = setInterval(function(){
      if(!activeSounds.night) return;
      for(var i = 0; i < 3; i++){
        var o = ctx.createOscillator(); o.type = "sine"; o.frequency.value = 4100 + Math.random() * 300;
        var og = ctx.createGain(); var t = ctx.currentTime + i * 0.09;
        og.gain.setValueAtTime(0.0001, t);
        og.gain.exponentialRampToValueAtTime(0.05, t + 0.02);
        og.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
        o.connect(og); og.connect(out); o.start(t); o.stop(t + 0.09);
      }
    }, 1400 + Math.random() * 800);
    stopFns.push(function(){ clearInterval(chirpTimer); });
  }
  nodes.stop = function(){ stopFns.forEach(function(f){ f(); }); };
  return nodes;
}
function ensureCtx(){
  if(!actx){
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    actx = new AC();
  }
  if(actx.state === "suspended") actx.resume();
  return actx;
}
function setSound(name, on, vol){
  dream.sounds[name] = on ? (vol == null ? (dream.sounds[name] || 0.6) : vol) : 0;
  if(on){
    var ctx = ensureCtx();
    if(!ctx) return;
    if(activeSounds[name]) activeSounds[name].stop();
    var out = ctx.createGain(); out.gain.value = dream.sounds[name]; out.connect(ctx.destination);
    var built = buildSound(name, ctx, out);
    activeSounds[name] = {stop: function(){ built.stop(); try{ out.disconnect(); }catch(e){} }, out: out};
  }else if(activeSounds[name]){
    activeSounds[name].stop(); delete activeSounds[name];
  }
  persist(false);
}
function setSoundVol(name, vol){
  dream.sounds[name] = vol;
  if(activeSounds[name]) activeSounds[name].out.gain.value = vol;
  persist(false);
}
function stopAllSounds(){
  Object.keys(activeSounds).forEach(function(n){
    activeSounds[n].stop(); delete activeSounds[n];
    var b = document.querySelector('[data-sound="' + n + '"]');
    if(b){ b.classList.remove("on"); b.textContent = "▶"; }
  });
  dream.sounds = {}; persist(false);
}

/* ---------- UI ---------- */
var curStory = {title:"", text:""};
var curAff = {en:"", zh:""};
function buildUI(){
  $("#app").innerHTML =
    '<div class="topbar"><div class="wrap" style="padding-top:0;padding-bottom:0">' +
      '<a href="/xwei/" style="text-decoration:none">← Secret Garden</a>' +
      '<span class="brand">🌟 Dream Life</span><span class="sp"></span>' +
      '<span class="saved" id="saved"></span>' +
      '<button class="linkbtn" id="signOut">Sign out</button>' +
    '</div></div>' +
    '<div class="wrap">' +
      '<h1 class="page">Your dream life, read aloud</h1>' +
      '<p class="sub">Sleep stories, affirmations and soundscapes — woven on your device from your own words in “My Life in a Few Years?”, read by your device’s own voice. No cloud, no subscription, nothing leaves this garden.</p>' +
      '<div id="rulesHint" class="rules-hint" style="display:none">' +
        '<b>One last step:</b> the database rules don’t include this garden yet, so nothing can be saved. ' +
        'Open the Firebase console → project x-planner-99dd3 → Firestore Database → Rules, make sure the <b>/xwei/{uid}</b> rule allows read and write for the signed-in owner, click Publish, then come back and refresh.' +
      '</div>' +
      '<div id="lifeEmpty" class="sec" style="display:none">' +
        '<h3>🌿 First, sketch the life</h3>' +
        '<p class="hint">Stories and affirmations are woven from your “My Life in a Few Years?” page — it looks empty right now. Write even one line there, and tonight’s story will already sound like yours.</p>' +
        '<a class="btn small" href="/xwei/life/" style="text-decoration:none;display:inline-block">Open My Life in a Few Years? →</a>' +
      '</div>' +
      '<div class="sec"><h3>🎯 Tonight’s focus</h3><p class="hint">What should tonight’s story be about?</p>' +
        '<div class="chips" id="focusChips"></div>' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center">' +
          '<select id="langSel" style="width:auto"><option value="en">Story in English</option><option value="zh">故事用中文</option></select>' +
          '<select id="voiceSel" class="voicesel"></select>' +
          '<label class="note">Speed <input type="range" id="rateRange" class="vol" min="0.6" max="1.2" step="0.05" value="0.9"> <span id="rateVal">0.9×</span></label>' +
        '</div></div>' +
      '<div class="sec"><h3>💫 Tonight’s affirmation</h3><p class="hint">A new one every morning, written from your own words.</p>' +
        '<div class="affbox"><div class="afftext" id="affEn"></div><div class="affzh" id="affZh"></div></div>' +
        '<div class="rowbtns"><button class="btn small" id="affPlay">🔊 Listen</button>' +
        '<button class="btn small ghost" id="affNew">↻ Another one</button>' +
        '<button class="btn small ghost" id="affSave">♥ Save it</button></div></div>' +
      '<div class="sec"><h3>🌙 Tonight’s sleep story</h3><p class="hint">Two or three minutes, in the second person — a day in the life you are building. Press play, close your eyes.</p>' +
        '<div class="storybox"><div class="storytext" id="storyText"></div></div>' +
        '<div class="player"><button class="btn small primary" id="playBtn">▶ Play story</button>' +
        '<button class="btn small ghost" id="storyNew">↻ New story</button>' +
        '<button class="btn small ghost" id="storySave">♥ Save it</button></div></div>' +
      '<div class="sec"><h3>🎧 Soundscapes</h3><p class="hint">Generated on your device — mix them, and let them play under the story.</p>' +
        '<div id="soundList"></div>' +
        '<div class="rowbtns"><button class="btn small ghost" id="soundsOff">Stop all sounds</button></div></div>' +
      '<div class="sec"><h3>♥ Saved</h3><p class="hint">Affirmations and stories you kept.</p>' +
        '<div id="savedList"></div><p class="sub" id="savedEmpty">Nothing saved yet.</p></div>' +
      '<footer>Stories are templates filled with your own words — not an AI model, and nothing is sent anywhere.</footer>' +
    '</div>';
}
function persist(now){
  var doSave = function(){
    XW.save("dream", dream).then(function(){
      var s = $("#saved"); if(s) s.textContent = "Saved ✓";
    }).catch(function(){
      var s = $("#saved"); if(s) s.textContent = "Couldn’t save — check connection";
    });
  };
  if(now){ clearTimeout(saveT); doSave(); return; }
  clearTimeout(saveT);
  saveT = setTimeout(doSave, 900);
}
function renderFocus(){
  var box = $("#focusChips"); box.innerHTML = "";
  THEMES.forEach(function(t){
    var b = document.createElement("button");
    b.className = "chip" + (t.k === dream.focus ? " on" : "");
    b.textContent = t.en + " · " + t.zh; b.type = "button";
    b.addEventListener("click", function(){
      dream.focus = t.k; stopSpeak(); renderFocus(); newStory(todayKey()); persist(false);
    });
    box.appendChild(b);
  });
}
function renderAff(seedStr){
  curAff = affirmFor(seedStr);
  $("#affEn").textContent = curAff.en;
  $("#affZh").textContent = curAff.zh;
}
function newStory(seedStr){
  stopSpeak();
  curStory = buildStory(seedStr);
  $("#storyText").textContent = curStory.text;
}
function renderSounds(){
  var defs = [
    {k:"rain", n:"Rain", d:"soft, steady patter"},
    {k:"ocean", n:"Ocean", d:"slow waves"},
    {k:"wind", n:"Wind", d:"through the trees"},
    {k:"fire", n:"Fireplace", d:"warm crackle"},
    {k:"night", n:"Night", d:"quiet + crickets"}
  ];
  var box = $("#soundList"); box.innerHTML = "";
  defs.forEach(function(s){
    var on = (dream.sounds[s.k] || 0) > 0;
    var row = document.createElement("div"); row.className = "srow";
    var nm = document.createElement("div"); nm.className = "sname";
    nm.innerHTML = XW.esc(s.n) + "<span>" + XW.esc(s.d) + "</span>";
    var btn = document.createElement("button");
    btn.className = "sbtn" + (on ? " on" : ""); btn.textContent = on ? "⏸" : "▶";
    btn.setAttribute("data-sound", s.k); btn.type = "button";
    var vol = document.createElement("input");
    vol.type = "range"; vol.min = "0"; vol.max = "1"; vol.step = "0.05";
    vol.value = dream.sounds[s.k] || 0.6; vol.className = "vol";
    btn.addEventListener("click", function(){
      var isOn = (dream.sounds[s.k] || 0) > 0;
      if(isOn){ setSound(s.k, false); btn.classList.remove("on"); btn.textContent = "▶"; }
      else{ setSound(s.k, true, parseFloat(vol.value)); btn.classList.add("on"); btn.textContent = "⏸"; }
    });
    vol.addEventListener("input", function(){
      var v = parseFloat(vol.value);
      if(v > 0 && (dream.sounds[s.k] || 0) === 0){ setSound(s.k, true, v); btn.classList.add("on"); btn.textContent = "⏸"; }
      else setSoundVol(s.k, v);
    });
    row.appendChild(nm); row.appendChild(btn); row.appendChild(vol);
    box.appendChild(row);
  });
}
function renderSaved(){
  var box = $("#savedList"); box.innerHTML = "";
  var items = [];
  (dream.savedAff || []).forEach(function(a, i){ items.push({kind:"aff", ix:i, title:a.en, sub:a.zh, ts:a.ts}); });
  (dream.savedStories || []).forEach(function(s, i){ items.push({kind:"story", ix:i, title:s.title, sub:s.text.split("\n")[0].slice(0, 80), ts:s.ts}); });
  items.sort(function(a, b){ return (b.ts || 0) - (a.ts || 0); });
  $("#savedEmpty").style.display = items.length ? "none" : "";
  items.forEach(function(it){
    var b = document.createElement("button");
    b.className = "saveditem";
    b.innerHTML = "<b>" + XW.esc(it.title) + "</b><span>" + XW.esc(it.sub || "") + "</span>";
    b.addEventListener("click", function(){
      if(it.kind === "aff"){
        var a = dream.savedAff[it.ix];
        renderAff("saved" + it.ix);
        curAff = a; $("#affEn").textContent = a.en; $("#affZh").textContent = a.zh;
        window.scrollTo({top: 0, behavior: "smooth"});
      }else{
        var s = dream.savedStories[it.ix];
        stopSpeak(); curStory = s; $("#storyText").textContent = s.text;
        window.scrollTo({top: 0, behavior: "smooth"});
      }
    });
    box.appendChild(b);
  });
}

XW.boot(function(){
  buildUI();
  if(synth){
    fillVoiceSel();
    synth.onvoiceschanged = fillVoiceSel;
  }
  XW.load().then(function(data){
    if(data && data.life && typeof data.life === "object") life = data.life;
    if(data && data.dream && typeof data.dream === "object"){
      dream = Object.assign(dream, data.dream);
      dream.sounds = dream.sounds || {};
      dream.savedAff = dream.savedAff || [];
      dream.savedStories = dream.savedStories || [];
    }
    var hasLife = pick(life.oneLiner) || Object.keys(life.sections || {}).some(function(k){ return pick(life.sections[k]); });
    $("#lifeEmpty").style.display = hasLife ? "none" : "";
    $("#langSel").value = dream.lang || "en";
    $("#rateRange").value = dream.rate || 0.9;
    $("#rateVal").textContent = (dream.rate || 0.9) + "×";
    renderFocus(); renderAff(todayKey()); newStory(todayKey()); renderSounds(); renderSaved();
    fillVoiceSel();
    /* restore sounds that were on (only after a user gesture can audio
       actually start, so this just restores the toggles' state) */
    Object.keys(dream.sounds).forEach(function(k){
      if(dream.sounds[k] > 0){
        var b = document.querySelector('[data-sound="' + k + '"]');
        if(b){ b.classList.add("on"); b.textContent = "⏸"; }
      }
    });
  }).catch(function(){
    var s = $("#saved"); if(s) s.textContent = "Couldn’t load — check connection";
    renderFocus(); renderAff(todayKey()); newStory(todayKey()); renderSounds(); renderSaved();
  });

  $("#langSel").addEventListener("change", function(){
    dream.lang = this.value; stopSpeak();
    renderAff(todayKey()); newStory(todayKey()); fillVoiceSel(); persist(false);
  });
  $("#rateRange").addEventListener("input", function(){
    dream.rate = parseFloat(this.value);
    $("#rateVal").textContent = dream.rate + "×";
    persist(false);
  });
  $("#voiceSel").addEventListener("change", function(){
    dream.voiceURI = this.value; persist(false);
  });
  $("#affPlay").addEventListener("click", function(){
    var t = dream.lang === "zh" ? curAff.zh : curAff.en;
    if(speaking){ stopSpeak(); this.textContent = "🔊 Listen"; return; }
    speakText(t);
    this.textContent = "⏸ Stop";
    var btn = this;
    var iv = setInterval(function(){ if(!speaking){ btn.textContent = "🔊 Listen"; clearInterval(iv); } }, 500);
  });
  $("#affNew").addEventListener("click", function(){
    renderAff("shuffle" + Date.now()); persist(false);
  });
  $("#affSave").addEventListener("click", function(){
    dream.savedAff = dream.savedAff || [];
    dream.savedAff.push({en: curAff.en, zh: curAff.zh, ts: Date.now()});
    if(dream.savedAff.length > 30) dream.savedAff = dream.savedAff.slice(-30);
    renderSaved(); persist(true);
  });
  $("#playBtn").addEventListener("click", function(){
    if(speaking){ stopSpeak(); return; }
    speakText(curStory.text);
    this.textContent = "⏸ Stop";
  });
  $("#storyNew").addEventListener("click", function(){
    newStory("shuffle" + Date.now());
  });
  $("#storySave").addEventListener("click", function(){
    dream.savedStories = dream.savedStories || [];
    dream.savedStories.push({title: curStory.title, text: curStory.text, ts: Date.now()});
    if(dream.savedStories.length > 20) dream.savedStories = dream.savedStories.slice(-20);
    renderSaved(); persist(true);
  });
  $("#soundsOff").addEventListener("click", stopAllSounds);
  document.addEventListener("visibilitychange", function(){
    if(document.hidden) stopSpeak();
  });
});
</script>
</body>
</html>
