<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X Planner</title>
<!-- Firebase loads only when the page is hosted online (e.g. GitHub Pages).
     It is blocked in the Dia preview — that's fine: the planner falls back to
     local storage + Backup/Restore, and cloud sync activates once deployed. -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --paper:#f3f7fc;--paper-2:#e9f1fa;--card:#ffffff;
    --ink:#232a33;--ink-soft:#5a6875;--faint:#9fb0c2;
    --line:#d9e4f0;--line-soft:#ebf1f8;
    --blue:#3f6fb0;--blue-deep:#2b5488;--blue-bright:#4183c4;--blue-soft:#e3eefa;
    --teal:#3d95a4;--teal-soft:#def0f2;
    --slate:#788698;--slate-soft:#eef2f6;
    --gold:#c08a2e;
    --shadow:0 1px 2px rgba(28,52,84,.05),0 10px 26px rgba(28,52,84,.07);
    --radius:14px;
    --sans:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--paper);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;line-height:1.45}
  .wrap{max-width:1180px;margin:0 auto;padding:24px 24px 96px}
  button{font-family:var(--sans)}
  input,textarea{font-family:var(--sans)}

  /* ---------- top bar ---------- */
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:20px;
    flex-wrap:wrap;padding-bottom:16px;border-bottom:2px solid var(--blue-deep)}
  .brand .eyebrow{font-size:10px;letter-spacing:.26em;text-transform:uppercase;
    color:var(--blue-bright);font-weight:700}
  .brand h1{font-size:27px;line-height:1.05;letter-spacing:-.4px;font-weight:700;
    margin-top:3px;color:var(--blue-deep)}
  .zoomctl{display:flex;background:var(--paper-2);border:1px solid var(--line);
    border-radius:12px;padding:4px;gap:2px}
  .zoomctl button{border:none;background:transparent;color:var(--ink-soft);font-size:12.5px;
    font-weight:600;letter-spacing:.02em;padding:8px 15px;border-radius:9px;cursor:pointer;transition:.15s}
  .zoomctl button:hover{color:var(--blue-deep)}
  .zoomctl button.active{background:var(--card);color:var(--blue-bright);box-shadow:var(--shadow)}
  .zoomctl .arrowlab{align-self:center;font-size:14px;color:var(--faint);padding:0 2px;user-select:none}

  /* ---------- nav row ---------- */
  .navrow{display:flex;justify-content:space-between;align-items:center;gap:16px;
    margin:18px 0 18px;flex-wrap:wrap}
  .crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px}
  .crumbs .cb{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:13px;
    font-weight:600;padding:3px 6px;border-radius:7px}
  .crumbs .cb:hover{background:var(--blue-soft);color:var(--blue-bright)}
  .crumbs .sep{color:var(--faint)}
  .crumbs .cur{color:var(--blue-deep);font-weight:700;padding:3px 6px}
  .stepnav{display:flex;align-items:center;gap:9px}
  .navbtn{border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
    width:34px;height:34px;border-radius:10px;font-size:16px;cursor:pointer;display:flex;
    align-items:center;justify-content:center;transition:.15s}
  .navbtn:hover{border-color:var(--blue-bright);color:var(--blue-bright)}
  .pill{border:1px solid var(--line);background:var(--card);color:var(--ink-soft);font-size:12px;
    font-weight:600;padding:0 13px;height:34px;border-radius:10px;cursor:pointer;transition:.15s;
    display:inline-flex;align-items:center;gap:6px}
  .pill:hover{border-color:var(--blue-bright);color:var(--blue-bright)}
  .pill.print{background:var(--blue-bright);border-color:var(--blue-bright);color:#fff}
  .pill.print:hover{background:var(--blue-deep);border-color:var(--blue-deep);color:#fff}
  .title-lg{font-size:24px;font-weight:700;letter-spacing:-.3px;color:var(--blue-deep);min-width:90px;text-align:center}

  /* ---------- shared ---------- */
  .panel{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--radius);
    padding:18px;box-shadow:var(--shadow)}
  .sec-lbl{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
    color:var(--blue-deep);margin-bottom:12px;display:flex;align-items:center;gap:10px}
  .sec-lbl .dash{flex:1;height:1px;background:var(--line)}
  .divider{display:flex;align-items:center;gap:14px;margin:30px 0 20px}
  .divider .ln{flex:1;height:2px;background:var(--line)}
  .divider .dl{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--blue-bright)}
  .note{width:100%;border:none;background:transparent;resize:vertical;font-family:var(--sans);
    font-size:14.5px;line-height:1.65;color:var(--ink);min-height:70px}
  .note:focus{outline:none}
  .note::placeholder{color:var(--faint)}
  .theme-input{font-size:15px;color:var(--ink-soft);background:transparent;border:none;
    border-bottom:1.5px dashed var(--line);padding:3px 4px;width:100%;margin-bottom:6px}
  .theme-input:focus{outline:none;border-bottom-color:var(--blue-bright);color:var(--ink)}
  .theme-input::placeholder{color:var(--faint)}

  /* goals list */
  .goal-row{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
  .goal-row:last-child{border-bottom:none}
  .goal-top{display:flex;align-items:center;gap:10px}
  .goal-top .gnum{font-size:10px;font-weight:700;color:var(--faint);width:14px;flex-shrink:0}
  .goal-top input{flex:1;border:none;background:transparent;font-size:15px;color:var(--ink)}
  .goal-top input:focus{outline:none}
  .goal-top input::placeholder{color:var(--faint)}
  .gbar-row{display:flex;align-items:center;gap:10px;padding-left:24px}
  .track{flex:1;height:8px;background:var(--paper-2);border-radius:20px;overflow:hidden;cursor:pointer}
  .track .fill{height:100%;width:0;border-radius:20px;transition:width .3s cubic-bezier(.3,1,.4,1);background:var(--accent,var(--blue))}
  .gpct{font-size:11px;color:var(--ink-soft);width:34px;text-align:right}

  /* checkable priority rows (top3 / big3) */
  .prow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft)}
  .prow:last-child{border-bottom:none}
  .prow .star{color:var(--gold);font-size:14px;flex-shrink:0}
  .prow input[type=checkbox]{accent-color:var(--blue-bright);width:16px;height:16px;cursor:pointer;flex-shrink:0}
  .prow input[type=text]{flex:1;border:none;background:transparent;font-size:15px;color:var(--ink)}
  .prow input[type=text]:focus{outline:none}
  .prow input[type=text]::placeholder{color:var(--faint)}

  /* ---------- DAY ---------- */
  .day-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
  .sched{max-height:none}
  .block-row{display:grid;grid-template-columns:58px 1fr;gap:0;border-bottom:1px solid var(--line-soft);align-items:stretch}
  .block-row:last-child{border-bottom:none}
  .block-row .bt{font-size:11px;color:var(--ink-soft);padding:7px 8px 7px 0;text-align:right;
    border-right:1px solid var(--line);font-variant-numeric:tabular-nums}
  .block-row.hour .bt{font-weight:700;color:var(--blue-deep)}
  .block-row .bi{border:none;background:transparent;padding:6px 10px;font-size:13.5px;color:var(--ink);width:100%}
  .block-row .bi:focus{outline:none;background:var(--blue-soft)}
  .block-row.hour{background:var(--paper-2)}

  .stack>*+*{margin-top:16px}
  .ev{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line-soft)}
  .ev:last-of-type{border-bottom:none}
  .ev .evt{width:52px;border:none;background:transparent;font-size:12px;color:var(--blue-bright);
    font-variant-numeric:tabular-nums}
  .ev .evt:focus{outline:none}
  .ev .evx{flex:1;border:none;background:transparent;font-size:14px;color:var(--ink)}
  .ev .evx:focus{outline:none}
  .ev .del,.task .del,.mini-task .del,.prow .del{opacity:0;border:none;background:none;color:var(--faint);
    cursor:pointer;font-size:15px;line-height:1}
  .ev:hover .del,.task:hover .del,.mini-task:hover .del,.prow:hover .del{opacity:1}
  .prow .drag-handle{cursor:grab;color:var(--faint);font-size:11px;letter-spacing:2px;
    user-select:none;-webkit-user-select:none;flex-shrink:0;padding:4px 2px;touch-action:none}
  .prow .drag-handle:active{cursor:grabbing}
  .prow.dragging{opacity:.35}
  .prow.drop-target{box-shadow:inset 0 2px 0 var(--blue-bright)}
  .del:hover{color:var(--blue-bright)}
  .addbtn{margin-top:10px;border:none;background:var(--paper-2);color:var(--ink-soft);font-size:12px;
    font-weight:600;padding:7px 12px;border-radius:9px;cursor:pointer;transition:.15s}
  .addbtn:hover{background:var(--blue-soft);color:var(--blue-bright)}

  /* Eisenhower matrix */
  .matrix{display:grid;grid-template-columns:26px 1fr 1fr;grid-template-rows:26px 1fr 1fr;gap:8px;margin-top:6px;
    aspect-ratio:9/5}
  .maxis{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;
    letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
  .maxis.v{writing-mode:vertical-rl;transform:rotate(180deg)}
  .quad{border:1px solid var(--line);border-radius:12px;padding:12px;min-height:130px;display:flex;flex-direction:column;overflow:hidden}
  .quad h4{font-size:12px;font-weight:700;margin-bottom:2px}
  .quad .qsub{font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
  .quad.q0{background:linear-gradient(180deg,#fbe9e6,#fff);border-color:#c0503f}
  .quad.q0 h4{color:#b0402f}
  .quad.q1{background:linear-gradient(180deg,#e6f2ea,#fff);border-color:#4a8a5f}
  .quad.q1 h4{color:#3c7a50}
  .quad.q2{background:linear-gradient(180deg,#faf1dd,#fff);border-color:#c99022}
  .quad.q2 h4{color:#a8791b}
  .quad.q3{background:linear-gradient(180deg,#f1f4f7,#fff);border-color:var(--slate)}
  .quad.q3 h4{color:var(--slate)}
  .qtasks{list-style:none;flex:1;display:flex;flex-direction:column;gap:3px;overflow-y:auto}
  .task{display:flex;align-items:flex-start;gap:7px;font-size:13.5px;line-height:1.3;padding:3px 2px;border-radius:7px}
  .task:hover{background:rgba(65,131,196,.06)}
  .task input[type=checkbox]{margin-top:2px;accent-color:var(--blue-bright);width:14px;height:14px;cursor:pointer;flex-shrink:0}
  .task .tt{flex:1;color:var(--ink);word-break:break-word}
  .task.done .tt{text-decoration:line-through;color:var(--faint)}
  .qadd{margin-top:8px;border:none;background:rgba(255,255,255,.6);color:var(--ink-soft);font-size:11px;
    font-weight:600;padding:5px;border-radius:7px;cursor:pointer}
  .qadd:hover{color:var(--blue-bright)}
  .cd.over{background:#fbe0dc;color:#b0402f}
  .cd.soon{background:#faf1dd;color:#a8791b}
  .cd.ok{background:var(--blue-soft);color:var(--blue-deep)}
  .qtask{border:1px solid var(--line-soft);border-radius:9px;background:#fff;padding:7px 8px;margin-bottom:6px}
  .qtask.done{opacity:.6}
  .qtask .qt-top{display:flex;align-items:center;gap:7px}
  .qtask .qt-top input[type=checkbox]{accent-color:var(--blue-bright);width:14px;height:14px;flex-shrink:0;cursor:pointer}
  .qtask .qt-title{flex:1;border:none;background:transparent;font-size:13.5px;color:var(--ink);font-family:var(--sans);min-width:0}
  .qtask .qt-title:focus{outline:none}
  .qtask.done .qt-title{text-decoration:line-through;color:var(--faint)}
  .qtask .qt-del{border:none;background:none;color:var(--faint);cursor:pointer;font-size:14px}
  .qtask .qt-del:hover{color:var(--blue-bright)}
  .qtask .qt-save{border:1px solid var(--line);background:var(--card);color:var(--ink-soft);border-radius:6px;
    font-size:10.5px;padding:2px 8px;cursor:pointer;font-family:var(--sans);flex-shrink:0}
  .qtask .qt-save:hover{border-color:var(--blue-bright);color:var(--blue-bright)}
  .qtask .qt-save:disabled{opacity:.75;cursor:default}
  .qtask .qt-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:5px}
  .qtask .qt-added{font-size:10px;color:var(--faint)}
  .qtask .qt-ddl{border:1px solid var(--line);border-radius:6px;font-size:10px;padding:2px 4px;color:var(--ink-soft);font-family:var(--sans)}
  .qtask .qt-ddl:focus{outline:none;border-color:var(--blue-bright)}
  .qtask .qt-notes{width:100%;margin-top:5px;border:1px solid var(--line-soft);border-radius:7px;padding:5px 7px;
    font-size:12px;color:var(--ink-soft);font-family:var(--sans);resize:vertical;height:26px;line-height:1.4}
  .qtask .qt-notes:focus{outline:none;border-color:var(--blue-bright);height:60px}

  /* ---------- WEEK ---------- */
  .weekgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
  .daycol{background:var(--card);border:1px solid var(--line-soft);border-radius:12px;padding:10px;
    box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:200px}
  .daycol.today{border-color:var(--blue-bright);box-shadow:0 0 0 2px var(--blue-soft),var(--shadow)}
  .daycol.blankcell{display:none} /* shown only in week print, as the 8th cell */
  .daycol .dh{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:8px;
    margin-bottom:8px;border-bottom:1px solid var(--line-soft);cursor:pointer}
  .daycol .dh:hover .dn{color:var(--blue-bright)}
  .daycol .dn{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
  .daycol.today .dn{color:var(--blue-bright)}
  .daycol .dd{font-size:15px;color:var(--ink-soft);font-weight:600}
  .mini-tasks{list-style:none;flex:1;display:flex;flex-direction:column;gap:4px}
  .mini-ev{font-size:11px;color:var(--blue-bright);background:var(--blue-soft);border-radius:5px;
    padding:2px 6px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mini-task{display:flex;gap:6px;font-size:12.5px;line-height:1.25;align-items:flex-start}
  .mini-task input{margin-top:2px;accent-color:var(--blue-bright);width:13px;height:13px;flex-shrink:0;cursor:pointer}
  .mini-task .tt{flex:1;color:var(--ink);word-break:break-word}
  .mini-task.done .tt{text-decoration:line-through;color:var(--faint)}
  .mini-task .msv{border:1px solid var(--line);background:var(--card);color:var(--ink-soft);border-radius:5px;
    font-size:10px;padding:1px 6px;cursor:pointer;font-family:var(--sans);flex-shrink:0}
  .mini-task .msv:hover{border-color:var(--blue-bright);color:var(--blue-bright)}
  .mini-task .msv:disabled{opacity:.75;cursor:default}
  .mini-add{margin-top:7px;border:none;background:var(--paper-2);color:var(--ink-soft);font-size:11px;
    font-weight:600;padding:5px;border-radius:7px;cursor:pointer}
  .mini-add:hover{background:var(--blue-soft);color:var(--blue-bright)}
  .twocol{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .habit-tbl{border-collapse:collapse;width:100%}
  .habit-tbl th,.habit-tbl td{text-align:center;padding:7px 3px}
  .habit-tbl th{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
  .habit-tbl td:first-child,.habit-tbl th:first-child{text-align:left;width:34%}
  .habit-name{border:none;background:transparent;font-size:14px;color:var(--ink);width:100%}
  .habit-name:focus{outline:none}
  .hdot{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);
    cursor:pointer;display:inline-block;transition:.15s;vertical-align:middle}
  .hdot.on{background:var(--teal);border-color:var(--teal)}
  .hcount{font-size:12px;font-weight:700;color:var(--teal)}

  /* ---------- MONTH ---------- */
  .split{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
  .cal .wk,.cal .days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal .wk{margin-bottom:6px}
  .cal .wk .wd{text-align:center;font-size:10px;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;color:var(--ink-soft);padding:3px 0}
  .cell{min-height:88px;border:1px solid var(--line-soft);border-radius:10px;padding:6px 7px;cursor:pointer;
    background:var(--paper);transition:.12s;display:flex;flex-direction:column;overflow:hidden}
  .cell:hover{border-color:var(--blue-bright);transform:translateY(-1px);box-shadow:var(--shadow)}
  .cell.out{opacity:.34}
  .cell.today{background:var(--blue-soft);border-color:var(--blue-bright)}
  .cell .cn{font-size:13px;font-weight:600;color:var(--ink)}
  .cell .cev{font-size:10px;color:#fff;background:var(--blue-bright);border-radius:4px;padding:1px 5px;
    margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cell .cmore{font-size:9px;color:var(--ink-soft);margin-top:2px}
  .cell .ccount{margin-top:auto;font-size:10px;color:var(--teal);font-weight:700}

  /* ---------- YEAR ---------- */
  .months-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .mcard{background:var(--card);border:1px solid var(--line-soft);border-radius:12px;padding:13px;
    cursor:pointer;box-shadow:var(--shadow);transition:.14s;min-height:92px;display:flex;flex-direction:column}
  .mcard:hover{border-color:var(--blue-bright);transform:translateY(-2px)}
  .mcard.now{border-color:var(--blue-bright);background:var(--blue-soft)}
  .mcard .mn{font-size:17px;font-weight:700;color:var(--blue-deep)}
  .mcard .mstat{font-size:11px;color:var(--ink-soft);margin-top:2px}
  .mcard .mbar{margin-top:auto;height:6px;background:var(--paper-2);border-radius:20px;overflow:hidden}
  .mcard .mbar span{display:block;height:100%;background:var(--teal);border-radius:20px}
  .evlist{list-style:none;columns:2;column-gap:26px}
  @media(max-width:700px){.evlist{columns:1}}
  .evitem{break-inside:avoid;display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-soft);cursor:pointer}
  .evitem:hover .evttl{color:var(--blue-bright)}
  .evitem .evdate{font-size:11px;font-weight:700;color:var(--blue-bright);width:60px;flex-shrink:0;
    font-variant-numeric:tabular-nums;padding-top:1px}
  .evitem .evttl{font-size:14px;color:var(--ink)}
  .evitem .evtime{font-size:11px;color:var(--ink-soft);margin-left:6px}
  .empty{color:var(--faint);font-size:13px;font-style:italic;padding:6px 0}

  /* ---------- YEARS ---------- */
  .years-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .ycard{background:var(--card);border:1px solid var(--line-soft);border-radius:14px;padding:18px;
    cursor:pointer;box-shadow:var(--shadow);transition:.14s;min-height:120px;display:flex;flex-direction:column}
  .ycard:hover{border-color:var(--blue-bright);transform:translateY(-2px)}
  .ycard.now{border-color:var(--blue-bright);background:var(--blue-soft)}
  .ycard .yn{font-size:30px;font-weight:700;letter-spacing:-.5px;color:var(--blue-deep)}
  .ycard .ystat{font-size:11px;color:var(--ink-soft);margin-top:4px}
  .ycard .ytheme{font-size:13px;font-style:italic;color:var(--ink-soft);margin-top:8px}
  .ycard .ybar{margin-top:auto;height:6px;background:var(--paper-2);border-radius:20px;overflow:hidden}
  .ycard .ybar span{display:block;height:100%;background:var(--blue);border-radius:20px}

  /* ---------- right nav + mode toggle ---------- */
  .rightnav{display:flex;flex-direction:column;gap:10px;align-items:flex-end}
  .modetoggle{display:flex;background:var(--blue-deep);border-radius:11px;padding:3px;gap:2px}
  .modetoggle button{border:none;background:transparent;color:#c6d8ec;font-size:12.5px;font-weight:700;
    letter-spacing:.02em;padding:7px 16px;border-radius:8px;cursor:pointer;transition:.15s}
  .modetoggle button:hover{color:#fff}
  .modetoggle button.active{background:#fff;color:var(--blue-deep)}

  /* ---------- projects ---------- */
  .proj-wrap{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;align-items:start}
  .proj-list{display:flex;flex-direction:column;gap:9px}
  .proj-new{border:1px dashed var(--blue-bright);background:var(--blue-soft);color:var(--blue-deep);
    font-size:13px;font-weight:700;padding:11px;border-radius:12px;cursor:pointer}
  .proj-new:hover{background:#d6e6f7}
  .pcard{background:var(--card);border:1px solid var(--line-soft);border-radius:12px;padding:12px 13px;
    cursor:pointer;box-shadow:var(--shadow);transition:.14s}
  .pcard:hover{border-color:var(--blue-bright)}
  .pcard.sel{border-color:var(--blue-bright);box-shadow:0 0 0 2px var(--blue-soft),var(--shadow)}
  .pcard .pt{font-size:15px;font-weight:600;color:var(--ink);word-break:break-word}
  .pcard .ps{font-size:11px;color:var(--ink-soft);margin-top:3px}
  .pcard .pbar{margin-top:8px;height:5px;background:var(--paper-2);border-radius:20px;overflow:hidden}
  .pcard .pbar span{display:block;height:100%;background:var(--blue);border-radius:20px}
  .proj-detail{display:flex;flex-direction:column;gap:16px}
  .pd-head{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
  .pd-title{width:100%;border:none;background:transparent;font-size:22px;font-weight:700;color:var(--blue-deep);letter-spacing:-.3px}
  .pd-title:focus{outline:none}
  .pd-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:10px}
  .pd-field{display:flex;align-items:center;gap:7px}
  .pd-field label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
  .pd-field input,.pd-field select{border:1px solid var(--line);background:var(--paper);border-radius:8px;
    padding:6px 9px;font-size:13px;font-family:var(--sans);color:var(--ink)}
  .pd-field input:focus,.pd-field select:focus{outline:none;border-color:var(--blue-bright)}
  .pd-prog{flex:1;min-width:160px;display:flex;align-items:center;gap:10px}
  .pd-prog .track{flex:1}
  .pd-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:820px){.pd-grid{grid-template-columns:1fr}}
  .chiprow{display:flex;flex-wrap:wrap;gap:6px}
  .authchip{display:inline-flex;align-items:center;gap:6px;background:var(--blue-soft);color:var(--blue-deep);
    border-radius:20px;padding:4px 10px;font-size:13px}
  .authchip button{border:none;background:none;color:var(--blue-deep);cursor:pointer;font-size:13px;opacity:.7}
  .authchip button:hover{opacity:1}
  .miniadd{border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);font-size:12px;
    font-weight:600;border-radius:8px;padding:5px 10px;cursor:pointer}
  .miniadd:hover{border-color:var(--blue-bright);color:var(--blue-bright)}
  .tl-item,.mtg-item{border-bottom:1px solid var(--line-soft);padding:9px 0}
  .tl-item:last-child,.mtg-item:last-child{border-bottom:none}
  .tl-item{display:flex;align-items:center;gap:9px}
  .tl-item input[type=date]{border:1px solid var(--line);border-radius:7px;padding:4px 7px;font-size:12px;font-family:var(--sans)}
  .tl-item .tlx{flex:1;border:none;background:transparent;font-size:14px;color:var(--ink)}
  .tl-item .tlx:focus{outline:none}
  .mtg-item .mtg-h{display:flex;align-items:center;gap:8px;margin-bottom:5px}
  .mtg-item .mtg-h input[type=date]{border:1px solid var(--line);border-radius:7px;padding:4px 7px;font-size:12px;font-family:var(--sans)}
  .mtg-sum{width:100%;border:1px solid var(--line-soft);border-radius:8px;padding:7px 9px;font-size:13.5px;
    font-family:var(--sans);color:var(--ink);resize:vertical;min-height:38px;margin-bottom:6px}
  .mtg-min{width:100%;border:1px solid var(--line-soft);border-radius:8px;padding:7px 9px;font-size:13px;
    font-family:var(--sans);color:var(--ink-soft);resize:vertical;min-height:52px;line-height:1.55}
  .mtg-sum:focus,.mtg-min:focus{outline:none;border-color:var(--blue-bright)}
  .icon-x{border:none;background:none;color:var(--faint);cursor:pointer;font-size:15px}
  .icon-x:hover{color:var(--blue-bright)}
  .proj-empty{color:var(--ink-soft);font-size:15px;text-align:center;padding:60px 20px}

  /* ---------- deadlines bar ---------- */
  .deadbar{background:#fff;border:1px solid var(--line-soft);border-radius:14px;box-shadow:var(--shadow);
    padding:10px 14px;margin-bottom:18px;display:flex;align-items:center;gap:12px}
  .deadbar .dlab{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--blue-deep);white-space:nowrap}
  .deadchips{display:flex;gap:8px;overflow-x:auto;flex:1;padding:2px}
  .dchip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;white-space:nowrap;background:var(--paper)}
  .dchip .cd{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px}
  .dchip .cd.over{background:#fbe0dc;color:#b0402f}
  .dchip .cd.soon{background:#faf1dd;color:#a8791b}
  .dchip .cd.ok{background:var(--blue-soft);color:var(--blue-deep)}
  .dchip .dt{font-size:13px;color:var(--ink)}
  .dchip .dd{font-size:11px;color:var(--ink-soft);cursor:pointer}
  .dchip.done .dt{text-decoration:line-through;color:var(--faint)}
  .dchip input{accent-color:var(--blue-bright);width:13px;height:13px;cursor:pointer}
  .dchip .x{border:none;background:none;color:var(--faint);cursor:pointer;font-size:14px}
  .dchip .x:hover{color:var(--blue-bright)}
  .deadadd{border:1px solid var(--blue-bright);background:var(--blue-bright);color:#fff;font-size:12px;
    font-weight:600;border-radius:9px;padding:7px 12px;cursor:pointer;white-space:nowrap}
  .cell .cdl{font-size:10px;color:#fff;background:#c0503f;border-radius:4px;padding:1px 5px;margin-top:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---------- toolbar ---------- */
  .toolbar{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;align-items:center;
    max-width:1180px;margin:0 auto;padding:14px 24px 0}
  .toolbar button{font-size:12px;font-weight:600;background:var(--card);border:1px solid var(--line);
    color:var(--ink-soft);padding:8px 13px;border-radius:9px;cursor:pointer;box-shadow:var(--shadow);transition:.15s}
  .toolbar button:hover{border-color:var(--blue-bright);color:var(--blue-bright)}
  .backlab{font-size:15px;color:#0039a6;text-decoration:none;margin-right:auto;white-space:nowrap}
  .backlab:hover{text-decoration:underline}
  .savenote{font-size:11px;color:var(--teal);opacity:0;transition:.3s}.savenote.show{opacity:1}

  footer.credit{margin-top:32px;text-align:center;font-size:11px;color:var(--ink-soft);letter-spacing:.03em}
  .print-head{display:none}

  @media(max-width:860px){
    .day-grid,.split,.proj-wrap{grid-template-columns:1fr}
    .weekgrid{grid-template-columns:repeat(2,1fr)}
    .months-grid,.years-grid,.twocol{grid-template-columns:repeat(2,1fr)}
    .toolbar{position:static;justify-content:flex-end;margin-bottom:10px}
  }
  /* ---------- private lock ---------- */
  #authBox{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
  #authBox input{border:1px solid var(--line);border-radius:8px;padding:6px 9px;
    font-size:12.5px;width:150px;background:var(--card);color:var(--ink)}
  #authBox input:focus{outline:none;border-color:var(--blue-bright)}
  #authBox button{border:1px solid var(--line);background:var(--card);border-radius:8px;
    padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer}
  #authBox button:hover{border-color:var(--blue-bright);color:var(--blue-bright)}
  #authGo{background:var(--blue-bright)!important;border-color:var(--blue-bright)!important;color:#fff!important}
  #authNew{font-size:11.5px;color:var(--blue-bright);cursor:pointer;white-space:nowrap}
  #authErr{font-size:11.5px;color:#b3402e;max-width:240px}
  #authWho{font-size:12px;color:var(--ink-soft);font-weight:600}
  .lockbanner{margin:0 0 18px;padding:28px 22px;text-align:center}
  .lockbanner .lk{font-size:30px}
  .lockbanner h2{font-size:19px;color:var(--blue-deep);margin:8px 0 6px}
  .lockbanner p{font-size:13.5px;color:var(--ink-soft);max-width:540px;margin:0 auto}
  body.locked .toolbar .only-unlocked{display:none!important}

  @media print{
    .toolbar,.zoomctl,.stepnav,.addbtn,.mini-add,.qadd,.del,.drag-handle,.savenote,footer.credit,
    .navbtn,.pill{display:none!important}
    body{background:#fff}.wrap{max-width:100%;padding:0}
    .panel,.daycol,.cal,.mcard,.ycard,.quad{box-shadow:none}
    .quad,.mcard,.ycard,.evitem,.goal-row,.block-row{break-inside:avoid}
    .print-head{display:block;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--blue-deep)}
    .print-head b{font-size:18px;color:var(--blue-deep)}
    .navrow{margin-top:0}
    /* day print: task list on page 1, time blocks (7:00-22:00) on a new page */
    body[data-level="0"] .matrix-panel,body[data-level="0"] .ev-panel,
    body[data-level="0"] .notes-panel{display:none!important}
    body[data-level="0"] .day-grid{display:flex;flex-direction:column}
    body[data-level="0"] .day-grid .stack{order:1;width:100%}
    body[data-level="0"] .day-grid .sched{order:2;width:100%;break-before:page;page-break-before:always}
    body[data-level="0"] .sched .block-row{height:7mm;min-height:0}
    body[data-level="0"] .sched .block-row .bt{padding:2px 8px 2px 0;font-size:10px}
    body[data-level="0"] .sched .block-row .bi{padding:2px 10px;font-size:12px}
    /* month print: calendar only, fits on one page */
    body[data-level="2"] .split{display:block}
    body[data-level="2"] .split .side{display:none!important}
    body[data-level="2"] .cell{min-height:66px;break-inside:avoid}
    /* week print: 7 days in a 4+3 grid + one blank cell, nothing else */
    body[data-level="1"] #stage>:not(.weekgrid){display:none!important}
    body[data-level="1"] .weekgrid{grid-template-columns:repeat(4,minmax(0,1fr))}
    body[data-level="1"] .daycol{min-height:0;break-inside:avoid}
    body[data-level="1"] .daycol.blankcell{display:flex!important}
    body[data-level="1"] .msv{display:none!important}
  }
</style>
</head>
<body>
<div class="toolbar">
  <a class="backlab" href="../">← Back to Lab</a>
  <span class="savenote" id="savenote">Saved</span>
  <span id="syncStat" style="font-size:11px;color:var(--ink-soft);align-self:center"></span>
  <span id="authBox" style="display:none">
    <span id="authForm">
      <input type="email" id="authEmail" placeholder="Email" autocomplete="email">
      <input type="password" id="authPass" placeholder="Password" autocomplete="current-password">
      <button id="authGo">Unlock</button>
      <a href="#" id="authNew">new account</a>
      <a href="#" id="authCheck" title="Test whether this page's Firebase API key is accepted by Google">check key</a>
    </span>
    <span id="authOut" style="display:none">

    </span>

  </span>
  <button id="exportBtn" class="only-unlocked">⭳ Backup</button>
  <button id="importBtn" class="only-unlocked">⭱ Restore</button>
  <input type="file" id="importFile" accept="application/json,.json" style="display:none">
  <button id="downloadBtn" style="display:none">⬇ Files for GitHub</button>
  <button id="resetBtn" class="only-unlocked">Reset all</button>
</div>

<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <div class="eyebrow" id="brandDate"></div>
      <h1>X Planner</h1>
    </div>
    <div class="rightnav">
      <div class="modetoggle" id="modetoggle">
        <button data-mode="plan">Planner</button>
        <button data-mode="projects">Projects</button>
      </div>
      <div class="zoomctl" id="zoomctl">
        <button data-lvl="4">Years</button>
        <button data-lvl="3">Year</button>
        <button data-lvl="2">Month</button>
        <button data-lvl="1">Week</button>
        <button data-lvl="0">Day</button>
      </div>
    </div>
  </div>

  <div class="print-head" id="printHead"></div>

  <div class="navrow">
    <div class="crumbs" id="crumbs"></div>

      <span class="title-lg" id="mainTitle"></span>

      <button class="pill print" id="printBtn">🖨 Print / PDF</button>
    </div>
  </div>

  <div id="deadlineBar"></div>

  <div id="stage"></div>

  <footer class="credit">Autosaves to this browser</footer>
</div>

<script>
/* =============== state =============== */
const LS="planner_zoom_v2";
function loadAll(){try{return JSON.parse(localStorage.getItem(LS))||{}}catch(e){return{}}}
let DB=loadAll();
let locked=true; /* content stays hidden until password sign-in (when cloud sync is configured) */
function emptyDB(){return{days:{},events:{},weeks:{},months:{},years:{},deadlines:[],projects:[],matrix:[],
  vision:{goals:[{t:"",p:0},{t:"",p:0},{t:"",p:0}],note:""}};}
function lockBanner(){const d=document.createElement("div");d.className="panel lockbanner";
  d.innerHTML='<div class="lk">🔒</div><h2>This planner is private</h2><p>Sign in with your password in the toolbar above to view and edit your plans.<br>Without signing in, only the empty structure is visible.</p>';return d;}
function finishLocked(realDB){
  if(!realDB)return;DB=realDB;
  stage.querySelectorAll("input,textarea,button,select").forEach(el=>{el.disabled=true;});
  stage.prepend(lockBanner());
}
DB.days=DB.days||{};
DB.events=DB.events||{};
DB.weeks=DB.weeks||{};
DB.months=DB.months||{};
DB.years=DB.years||{};
DB.deadlines=DB.deadlines||[];
DB.projects=DB.projects||[];
if(DB.matrix===undefined){/* migrate any old per-day tasks into the persistent matrix */
  DB.matrix=[];for(const k in DB.days){(DB.days[k].tasks||[]).forEach(t=>{if(t&&(t.t||t.d))DB.matrix.push({t:t.t||"",d:!!t.d,quad:t.quad||0,due:""});});}}
function newMid(){return "m"+Date.now().toString(36)+Math.floor(Math.random()*46656).toString(36);}
function ensureIds(){(DB.matrix||[]).forEach(t=>{if(!t.id)t.id=newMid();});}
function purgeFromDayLists(id){for(const k in DB.days){const arr=DB.days[k]&&DB.days[k].top3;
  if(arr)for(let i=arr.length-1;i>=0;i--){if(arr[i]&&arr[i].id===id)arr.splice(i,1);}}}
ensureIds();
DB.vision=DB.vision||{goals:[{t:"",p:0},{t:"",p:0},{t:"",p:0}],note:""};

let saveTimer=null;
function save(){if(locked)return;localStorage.setItem(LS,JSON.stringify(DB));
  const n=document.getElementById("savenote");n.classList.add("show");
  clearTimeout(saveTimer);saveTimer=setTimeout(()=>n.classList.remove("show"),1000);
  pushRemote();}

/* =============== date helpers =============== */
const MON=["January","February","March","April","May","June","July","August","September","October","November","December"];
const MON3=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const pad=n=>String(n).padStart(2,"0");
const dayKey=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const monthKey=d=>d.getFullYear()+"-"+pad(d.getMonth()+1);
const yearKey=d=>String(d.getFullYear());
function mondayOf(d){const x=new Date(d);const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);x.setHours(0,0,0,0);return x;}
function sameDay(a,b){return dayKey(a)===dayKey(b)}
const NOW=new Date();NOW.setHours(0,0,0,0);
const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");

/* =============== getters =============== */
function getDay(d){const k=dayKey(d);let o=DB.days[k];
  if(!o){o=DB.days[k]={top3:[{t:"",d:false},{t:"",d:false},{t:"",d:false}],tasks:[],blocks:{},note:""};}
  o.top3=o.top3||[{t:"",d:false},{t:"",d:false},{t:"",d:false}];o.tasks=o.tasks||[];o.blocks=o.blocks||{};return o;}
function getEvents(d){const k=dayKey(d);if(!DB.events[k])DB.events[k]=[];return DB.events[k];}
function getWeek(d){const k=dayKey(mondayOf(d));let o=DB.weeks[k];
  if(!o){o=DB.weeks[k]={};}
  o.theme=o.theme||"";o.outcomes=o.outcomes||[{t:"",p:0},{t:"",p:0},{t:"",p:0}];
  o.big3=o.big3||[{t:"",d:false},{t:"",d:false},{t:"",d:false}];
  o.habits=o.habits||[{n:"",days:[0,0,0,0,0,0,0]},{n:"",days:[0,0,0,0,0,0,0]},{n:"",days:[0,0,0,0,0,0,0]},{n:"",days:[0,0,0,0,0,0,0]}];
  o.wins=o.wins||"";o.adjust=o.adjust||"";return o;}
function getMonth(d){const k=monthKey(d);if(!DB.months[k])DB.months[k]={goals:[{t:"",p:0},{t:"",p:0},{t:"",p:0}],theme:"",note:""};return DB.months[k];}
function getYear(d){const k=yearKey(d);if(!DB.years[k])DB.years[k]={goals:[{t:"",p:0},{t:"",p:0},{t:"",p:0}],theme:"",note:""};return DB.years[k];}
function statsFor(pred){let total=0,done=0;(DB.matrix||[]).forEach(x=>{if(x.due&&pred(x.due)){total++;if(x.d)done++;}});return{total,done};}

/* =============== nav =============== */
let level=1;
let focus=new Date(NOW);
let yearsStart=null;
let mode="plan";
let selProj=null;

/* =============== builders =============== */
function goalsPanel(container,obj,accent){
  obj.goals.forEach((g,i)=>{
    const row=document.createElement("div");row.className="goal-row";
    row.innerHTML=`<div class="goal-top"><span class="gnum">${i+1}</span>
      <input type="text" placeholder="Goal…" value="${esc(g.t)}"></div>
      <div class="gbar-row"><div class="track"><div class="fill" style="width:${g.p||0}%;background:${accent}"></div></div>
      <span class="gpct">${g.p||0}%</span></div>`;
    const inp=row.querySelector("input"),track=row.querySelector(".track"),fill=row.querySelector(".fill"),pct=row.querySelector(".gpct");
    inp.addEventListener("input",()=>{g.t=inp.value;save();});
    track.addEventListener("click",e=>{const r=track.getBoundingClientRect();
      g.p=Math.max(0,Math.min(100,Math.round((e.clientX-r.left)/r.width*20)*5));
      fill.style.width=g.p+"%";pct.textContent=g.p+"%";save();});
    container.appendChild(row);
  });
}
function checkRows(container,arr,ph){
  arr.forEach(t=>{
    const r=document.createElement("div");r.className="prow";
    r.innerHTML=`<input type="checkbox" ${t.d?"checked":""}><span class="star">★</span>
      <input type="text" placeholder="${ph}" value="${esc(t.t)}">`;
    const cb=r.querySelector("input[type=checkbox]"),tx=r.querySelector("input[type=text]");
    if(t.d)tx.style.cssText="text-decoration:line-through;color:var(--ink-soft)";
    cb.addEventListener("change",()=>{t.d=cb.checked;tx.style.cssText=t.d?"text-decoration:line-through;color:var(--ink-soft)":"";save();});
    tx.addEventListener("input",()=>{t.t=tx.value;save();});
    container.appendChild(r);
  });
}
/* Tasks Today list: editable rows (add/delete) + drag-to-reorder.
   Rows that came from the matrix share the same object, so edits stay in sync;
   after a JSON reload they are re-linked to the live matrix task by id. */
function tasksTodayPanel(d,syncMatrix){
  const day=getDay(d);
  day.top3.forEach((r,i)=>{if(r&&r.id){const live=(DB.matrix||[]).find(m=>m.id===r.id);
    if(live&&live!==r)day.top3[i]=live;}});
  const p=document.createElement("div");p.className="panel tasks-panel";
  p.innerHTML=`<div class="sec-lbl">Tasks today<span class="dash"></span></div>`;
  const list=document.createElement("div");p.appendChild(list);
  let mxT=null;
  function draw(){
    list.innerHTML="";
    day.top3.forEach((t,idx)=>{
      const r=document.createElement("div");r.className="prow";
      const handle=document.createElement("span");handle.className="drag-handle";
      handle.title="Drag to reorder";handle.textContent="\u22EE\u22EE";handle.draggable=true;
      const cb=document.createElement("input");cb.type="checkbox";cb.checked=!!t.d;
      const star=document.createElement("span");star.className="star";star.textContent="\u2605";
      const tx=document.createElement("input");tx.type="text";tx.placeholder="Most important\u2026";tx.value=t.t||"";
      if(t.d)tx.style.cssText="text-decoration:line-through;color:var(--ink-soft)";
      const del=document.createElement("button");del.className="del";del.textContent="\u00D7";del.title="Remove";
      cb.addEventListener("change",()=>{t.d=cb.checked;
        tx.style.cssText=t.d?"text-decoration:line-through;color:var(--ink-soft)":"";save();syncMatrix();});
      tx.addEventListener("input",()=>{t.t=tx.value;save();clearTimeout(mxT);mxT=setTimeout(syncMatrix,800);});
      del.addEventListener("click",()=>{
        day.top3.splice(idx,1);
        if(t.id){const gi=(DB.matrix||[]).findIndex(m=>m.id===t.id);if(gi>=0)DB.matrix.splice(gi,1);}
        save();draw();syncMatrix();
      });
      handle.addEventListener("dragstart",e=>{e.dataTransfer.setData("text/plain",String(idx));
        e.dataTransfer.effectAllowed="move";r.classList.add("dragging");});
      handle.addEventListener("dragend",()=>{r.classList.remove("dragging");
        list.querySelectorAll(".drop-target").forEach(x=>x.classList.remove("drop-target"));});
      r.addEventListener("dragover",e=>{e.preventDefault();e.dataTransfer.dropEffect="move";r.classList.add("drop-target");});
      r.addEventListener("dragleave",()=>{r.classList.remove("drop-target");});
      r.addEventListener("drop",e=>{
        e.preventDefault();r.classList.remove("drop-target");
        const from=parseInt(e.dataTransfer.getData("text/plain"),10);
        if(isNaN(from)||from===idx)return;
        const mv=day.top3.splice(from,1)[0];day.top3.splice(idx,0,mv);
        save();draw();
      });
      r.appendChild(handle);r.appendChild(cb);r.appendChild(star);r.appendChild(tx);r.appendChild(del);
      list.appendChild(r);
    });
  }
  draw();
  const add=document.createElement("button");add.className="addbtn";add.textContent="+ add task";
  add.addEventListener("click",()=>{day.top3.push({t:"",d:false});save();draw();
    const xs=list.querySelectorAll('input[type="text"]');if(xs.length)xs[xs.length-1].focus();});
  p.appendChild(add);
  return {el:p,redraw:draw};
}

/* =============== deadlines =============== */
function daysUntil(due){const d=new Date(due+"T00:00:00");return Math.round((d-NOW)/86400000);}
function cdText(n){if(n<0)return (-n)+"d ago";if(n===0)return "Today";if(n===1)return "Tomorrow";return "in "+n+"d";}
function cdClass(n){return n<0?"over":(n<=3?"soon":"ok");}
/* datetime (to the minute) helpers for matrix tasks */
function untilText(due){const ms=new Date(due)-new Date();const past=ms<0;let a=Math.abs(ms);
  const dd=Math.floor(a/86400000);a-=dd*86400000;const hh=Math.floor(a/3600000);a-=hh*3600000;const mm=Math.floor(a/60000);
  let s=dd>0?dd+"d "+hh+"h":(hh>0?hh+"h "+mm+"m":mm+"m");return past?s+" ago":"in "+s;}
function untilClass(due){const ms=new Date(due)-new Date();return ms<0?"over":(ms<86400000?"soon":(ms<3*86400000?"soon":"ok"));}
function fmtStamp(ms){if(!ms)return "";const d=new Date(ms);let h=d.getHours();const ap=h>=12?"PM":"AM";h=h%12||12;
  return MON3[d.getMonth()]+" "+d.getDate()+", "+h+":"+pad(d.getMinutes())+" "+ap;}
function renderDeadlines(){
  const bar=document.getElementById("deadlineBar");if(!bar)return;
  bar.className="deadbar";bar.innerHTML="";
  const lab=document.createElement("div");lab.className="dlab";lab.textContent="⏰ Deadlines";bar.appendChild(lab);
  const wrap=document.createElement("div");wrap.className="deadchips";
  const list=(DB.deadlines||[]).filter(x=>x.title);
  const active=list.filter(x=>!x.done).sort((a,b)=>(a.due||"").localeCompare(b.due||""));
  const done=list.filter(x=>x.done).sort((a,b)=>(a.due||"").localeCompare(b.due||""));
  const ordered=active.concat(done);
  if(!ordered.length){const e=document.createElement("span");e.style.cssText="font-size:13px;color:var(--faint)";e.textContent="Nothing due yet — add a deadline";wrap.appendChild(e);}
  ordered.forEach(dl=>{
    const n=dl.due?daysUntil(dl.due):null;
    const chip=document.createElement("div");chip.className="dchip"+(dl.done?" done":"");
    const cb=document.createElement("input");cb.type="checkbox";cb.checked=!!dl.done;
    cb.addEventListener("change",()=>{dl.done=cb.checked;save();renderDeadlines();});
    chip.appendChild(cb);
    if(dl.due&&!dl.done){const cd=document.createElement("span");cd.className="cd "+cdClass(n);cd.textContent=cdText(n);chip.appendChild(cd);}
    const t=document.createElement("span");t.className="dt";t.textContent=dl.title;chip.appendChild(t);
    if(dl.due){const dt=new Date(dl.due+"T00:00:00");const dd=document.createElement("span");dd.className="dd";
      dd.textContent=MON3[dt.getMonth()]+" "+dt.getDate();dd.title="Open this day";
      dd.addEventListener("click",()=>{focus=new Date(dt);setLevel(0);});chip.appendChild(dd);}
    const x=document.createElement("button");x.className="x";x.textContent="×";

/* =============== crumbs =============== */
function isoWeek(date){
  const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));
  const dayNum=(d.getUTCDay()+6)%7;d.setUTCDate(d.getUTCDate()-dayNum+3);
  const firstThu=d.getTime();d.setUTCMonth(0,1);
  if(d.getUTCDay()!==4)d.setUTCMonth(0,1+((4-d.getUTCDay())+7)%7);
  return 1+Math.ceil((firstThu-d)/604800000);
}
function currentRangeLabel(){
  const d=focus;
  if(level===0)return DOW[(d.getDay()+6)%7]+", "+MON3[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear();
  if(level===1){const m=mondayOf(d);const e=new Date(m);e.setDate(e.getDate()+6);
    const sm=m.getMonth()===e.getMonth();
    return "Week "+isoWeek(m)+" · "+MON3[m.getMonth()]+" "+m.getDate()+" – "+(sm?"":MON3[e.getMonth()]+" ")+e.getDate()+", "+e.getFullYear();}
  if(level===2)return MON[d.getMonth()]+" "+d.getFullYear();
  if(level===3)return String(d.getFullYear());
  const s=(yearsStart!==null?yearsStart:d.getFullYear()-1);return s+" – "+(s+5);
}
function renderCrumbs(){
  const c=document.getElementById("crumbs");c.innerHTML="";
  const Y=focus.getFullYear();
  function add(label,lvl,isCur){
    if(isCur){const s=document.createElement("span");s.className="cur";s.textContent=label;c.appendChild(s);}
    else{const b=document.createElement("button");b.className="cb";b.textContent=label;
      b.addEventListener("click",()=>setLevel(lvl));c.appendChild(b);
      const sep=document.createElement("span");sep.className="sep";sep.textContent="›";c.appendChild(sep);}
  }
  const span=(yearsStart!==null?yearsStart:Y-1);
  if(level>=4){add("Years",4,true);}
  else{
    add(span+"–"+(span+5),4,false);
    add(String(Y),3,level===3);
    if(level<=2)add(MON[focus.getMonth()],2,level===2);
    if(level<=1){const mon=mondayOf(focus);add("Wk "+isoWeek(mon)+" · "+MON3[mon.getMonth()]+" "+mon.getDate(),1,level===1);}
    if(level===0)add(DOW[(focus.getDay()+6)%7]+" "+focus.getDate(),0,true);
  }
}

/* =============== render / nav =============== */
const stage=document.getElementById("stage");
const pageStyle=document.createElement("style");document.head.appendChild(pageStyle);
function setLevel(l){level=l;mode="plan";render();}
function render(){
  let realDB=null;
  if(locked){realDB=DB;DB=emptyDB();}
  document.body.classList.toggle("locked",locked);
  const planMode=mode==="plan";
  document.querySelectorAll("#modetoggle button").forEach(b=>b.classList.toggle("active",b.dataset.mode===mode));
  const zc=document.getElementById("zoomctl");if(zc)zc.style.display=planMode?"":"none";
  const nr=document.querySelector(".navrow");if(nr)nr.style.display=planMode?"":"none";
  const db=document.getElementById("deadlineBar");if(db)db.style.display=planMode?"":"none";
  const bd=document.getElementById("brandDate");
  if(!planMode){
    if(bd)bd.textContent="Research projects";
    document.getElementById("printHead").innerHTML="<b>Projects</b>";
    pageStyle.textContent=`@media print{@page{size:landscape;margin:12mm}}`;
    renderProjects();finishLocked(realDB);return;
  }
  document.querySelectorAll("#zoomctl button").forEach(b=>b.classList.toggle("active",+b.dataset.lvl===level));
  renderCrumbs();
  document.body.dataset.level=level;
  [renderDay,renderWeek,renderMonth,renderYear,renderYears][level]();
  if(bd)bd.textContent=currentRangeLabel();
  renderDeadlines();
  const names=["Day","Week","Month","Year","Years"];
  document.getElementById("printHead").innerHTML=`<b>${document.getElementById("mainTitle").textContent}</b> · ${names[level]} plan`;
  pageStyle.textContent=`@media print{@page{size:${level===0?"portrait":"landscape"};margin:12mm}}`;
  finishLocked(realDB);
}
function step(dir){
  if(level===0)focus.setDate(focus.getDate()+dir);
  else if(level===1)focus.setDate(focus.getDate()+7*dir);
  else if(level===2)focus.setMonth(focus.getMonth()+dir);
  else if(level===3)focus.setFullYear(focus.getFullYear()+dir);
  else if(level===4){yearsStart=(yearsStart===null?focus.getFullYear()-1:yearsStart)+6*dir;focus.setFullYear(yearsStart+1);}
  focus=new Date(focus);render();
}
document.querySelectorAll("#zoomctl button").forEach(b=>b.addEventListener("click",()=>setLevel(+b.dataset.lvl)));

    ta.style.cssText="width:100%;height:"+(items.length>1?"32vh":"58vh")+";font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;line-height:1.4;border:1px solid #d9e4f0;border-radius:8px;padding:10px;white-space:pre;overflow:auto";
    sel.addEventListener("click",()=>{ta.focus();ta.select();
      try{document.execCommand("copy");sel.textContent="Copied ✓";}catch(e){sel.textContent="Selected — Cmd/Ctrl+C";}
      setTimeout(()=>sel.textContent="Select all",1600);});
    wrap.appendChild(bar);wrap.appendChild(ta);box.appendChild(wrap);
  });
  ov.appendChild(box);document.body.appendChild(ov);
  document.getElementById("fpClose").addEventListener("click",()=>ov.remove());
  ov.addEventListener("click",e=>{if(e.target===ov)ov.remove();});
}
function dl(name,text,type){try{const b=new Blob([text],{type});const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),1000);}catch(e){}}

});

function firebaseReady(){return typeof firebase!=="undefined"&&!firebaseConfig.apiKey.startsWith("PASTE");}
function setSync(m){const el=document.getElementById("syncStat");if(el)el.textContent=m;}
function applyRemote(d){
  applyingRemote=true;DB=d.data||{};
  DB.days=DB.days||{};DB.events=DB.events||{};DB.weeks=DB.weeks||{};
  DB.months=DB.months||{};DB.years=DB.years||{};DB.deadlines=DB.deadlines||[];DB.projects=DB.projects||[];DB.matrix=DB.matrix||[];

  ensureIds();
  localStorage.setItem(LS,JSON.stringify(DB));render();applyingRemote=false;

function pushRemote(now){
  if(!userDoc||applyingRemote)return;
  clearTimeout(pushTimer);
  const doPush=()=>{setSync("Saving…");
    userDoc.set({data:DB,ts:Date.now(),by:CLIENT_ID})
      .then(()=>setSync("Synced ✓")).catch(err=>{setSync("Sync error");console.error(err);});};
  if(now)doPush();else pushTimer=setTimeout(doPush,900);
}
function listen(){if(!userDoc)return;if(unsub)unsub();
  unsub=userDoc.onSnapshot(snap=>{const d=snap.data();
    if(!d||!d.data||d.by===CLIENT_ID)return;applyRemote(d);setSync("Synced ✓");});}
function initFirebase(){
  const box=document.getElementById("authBox");
  if(!firebaseReady()){locked=false;box.style.display="none";setSync("");return;}
  try{
    firebase.initializeApp(firebaseConfig);
    fauth=firebase.auth();fdb=firebase.firestore();box.style.display="";
    const emailEl=document.getElementById("authEmail"),passEl=document.getElementById("authPass");
    const err=m=>{document.getElementById("authErr").textContent=m||"";};
    const showForm=show=>{document.getElementById("authForm").style.display=show?"":"none";
      document.getElementById("authOut").style.display=show?"none":"";};
    const creds=()=>({em:emailEl.value.trim(),pw:passEl.value});
    document.getElementById("authGo").onclick=()=>{
      err("");const{em,pw}=creds();
      if(!em||!pw){err("Type your email and password in the two boxes, then click Unlock.");return;}
      fauth.signInWithEmailAndPassword(em,pw)
        .catch(e=>err("Sign-in failed: "+friendlyAuthError(e)));
    };
    document.getElementById("authNew").onclick=e=>{
      e.preventDefault();err("");const{em,pw}=creds();
      if(!em||!pw){err("Type the email and password you want to use, then click \u201cnew account\u201d.");return;}
      if(!confirm("Create a new planner account for "+em+"?"))return;
      fauth.createUserWithEmailAndPassword(em,pw)
        .catch(e=>err("Couldn't create account: "+friendlyAuthError(e)));
    };
    document.getElementById("authSignOut").onclick=()=>{wipeOnSignOut=true;fauth.signOut();};
    document.getElementById("authCheck").onclick=e=>{
      e.preventDefault();err("Checking the Firebase key\u2026");
      fauth.fetchSignInMethodsForEmail("key-check@example.invalid").then(()=>{
        err("Key accepted \u2014 Google recognizes this page's Firebase key. If sign-in still fails, the cause is something else (e.g. the Email/Password provider or the authorized domain).");
      }).catch(e2=>{
        const c2=(e2&&e2.code)||"";
        err(c2==="auth/api-key-not-valid"
          ? "Key rejected: "+friendlyAuthError(e2)
          : "Key accepted \u2014 Google recognizes this page's Firebase key. (Check returned: "+(c2||"ok")+")");
      });
    };
    passEl.addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("authGo").click();});
    fauth.onAuthStateChanged(u=>{
      fbUser=u;locked=!u;err("");
      if(u){
        document.getElementById("authWho").textContent=u.email||"Signed in";
        showForm(false);setSync("Syncing…");
        userDoc=fdb.collection("planners").doc(u.uid);
        userDoc.get().then(snap=>{
          if(snap.exists&&snap.data()&&snap.data().data)applyRemote(snap.data());
          else pushRemote(true);
          listen();setSync("Synced ✓");
        }).catch(e=>{setSync("Sync error");console.error(e);});
      }else{
        showForm(true);if(unsub){unsub();unsub=null;}userDoc=null;setSync("");
        if(wipeOnSignOut){wipeOnSignOut=false;try{localStorage.removeItem(LS);}catch(e){}DB=emptyDB();}
      }
      render();
    });
  }catch(e){console.error(e);locked=false;box.style.display="none";setSync("");}
}
function friendlyAuthError(e){
  const c=(e&&e.code)||"";
  if(c==="auth/user-not-found"||c==="auth/wrong-password"||c==="auth/invalid-credential")
    return "Wrong email or password. Double-check both and click Unlock again — or click \u201cnew account\u201d if this email hasn't been registered yet.";
  if(c==="auth/email-already-in-use")return "That email already has an account — type its password and click Unlock.";
  if(c==="auth/weak-password")return "Google's sign-in system needs at least 6 characters — lengthen your password and click \u201cnew account\u201d again.";
  if(c==="auth/invalid-email")return "That email looks incomplete — it should look like name@example.com. Fix it and try again.";
  if(c==="auth/api-key-not-valid")
    return "Google rejected this page's Firebase API key. Site owner checklist \u2014 Google Cloud Console \u2192 project x-planner-99dd3 \u2192 APIs & Services \u2192 Credentials \u2192 open \u201cBrowser key (auto created by Firebase)\u201d: 1) \u201cApplication restrictions\u201d \u2014 if \u201cHTTP referrers\u201d is selected, add https://xinyuan-wei-xw.github.io/* (or set it to None); 2) \u201cAPI restrictions\u201d \u2014 make sure \u201cIdentity Toolkit API\u201d is allowed. If the key was deleted or you want a fresh one: Credentials \u2192 \u201cCreate credentials\u201d \u2192 \u201cAPI key\u201d, copy the new key, and replace the apiKey value in this page's firebaseConfig. Key changes take a few minutes to take effect \u2014 then click \u201ccheck key\u201d above to test again.";
  if(c==="auth/operation-not-allowed")
    return "Email/password sign-in isn't enabled yet — enable it in Firebase console > Authentication > Sign-in method.";
  if(c==="auth/unauthorized-domain")
    return "This domain isn't authorized — add it in Firebase console > Authentication > Settings > Authorized domains.";
  return (e&&e.message)||c||"unknown error";
}
