<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>认真吃饭 Eat Well</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --cream:#faf1dd; --paper:#ffffff; --ink:#232a33; --ink-soft:#5a6875; --faint:#9fb0c2;
  --green:#4183c4; --green-deep:#2b5488; --green-soft:#e9f1fa;
  --orange:#c08a2e; --orange-soft:#faf1dd;
  --red:#c0503f; --line:#d9e4f0; --gold:#c99022;
  --shadow:0 2px 10px rgba(43,84,136,.08);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--cream);color:var(--ink);min-height:100vh}
a{color:var(--green)}
.topbar{background:var(--paper);border-bottom:1px solid var(--line);padding:10px 18px;
  display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50}
.backlink{color:#0039a6;text-decoration:none;font-size:14px;white-space:nowrap}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto}
.brand .pot{font-size:26px}
.brand h1{font-size:19px;font-weight:700}
.brand h1 small{display:block;font-size:11px;font-weight:400;color:var(--ink-soft);letter-spacing:.4px}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:none;background:none;padding:6px 13px;font-size:13px;cursor:pointer;color:var(--ink-soft);font-family:var(--sans)}
.seg button.on{background:var(--green);color:#fff}
.areabar{background:var(--paper);border-bottom:1px solid var(--line);padding:10px 18px;display:flex;gap:8px;overflow-x:auto}
.areabar button{flex-shrink:0;border:1px solid var(--line);background:var(--cream);border-radius:999px;
  padding:7px 15px;font-size:13.5px;cursor:pointer;color:var(--ink);font-family:var(--sans)}
.areabar button.on{background:var(--green);border-color:var(--green);color:#fff}
.tabs{background:var(--paper);border-bottom:1px solid var(--line);padding:0 18px;display:flex;gap:4px;position:sticky;top:57px;z-index:40}
.tabs button{border:none;background:none;padding:13px 16px;font-size:14.5px;cursor:pointer;color:var(--ink-soft);
  font-family:var(--sans);border-bottom:3px solid transparent}
.tabs button.on{color:var(--green-deep);font-weight:700;border-bottom-color:var(--green)}
.wrap{max-width:1180px;margin:0 auto;padding:20px 18px 90px}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.toolbar input[type=search]{flex:1;min-width:200px;border:1px solid var(--line);border-radius:10px;padding:9px 13px;
  font-size:14px;font-family:var(--sans);background:#fff}
.toolbar input:focus{outline:none;border-color:var(--green)}
.pill-note{font-size:12.5px;color:var(--ink-soft)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);
  display:flex;flex-direction:column;transition:transform .12s}
.card:hover{transform:translateY(-2px)}
.card .thumb{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--orange-soft);cursor:pointer}
.card .body{padding:11px 13px;display:flex;flex-direction:column;gap:8px;flex:1}
.card .nm{font-size:14.5px;font-weight:600;line-height:1.35;cursor:pointer}
.card .nm:hover{color:var(--green-deep)}
.card .row{display:flex;gap:8px;margin-top:auto}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:7px 13px;font-size:13px;
  cursor:pointer;color:var(--ink);font-family:var(--sans)}
.btn:hover{border-color:var(--green);color:var(--green-deep)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:var(--green-deep)}
.btn.sel{background:var(--green-soft);border-color:var(--green);color:var(--green-deep);font-weight:600}
.badge{display:inline-block;font-size:11px;background:var(--orange-soft);color:#a86a1f;border-radius:999px;padding:2px 9px}
.badge.lunch{background:#e4ecf9;color:#2f5da3}
/* week */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
@media(max-width:900px){.week{grid-template-columns:repeat(2,1fr)}}
.daycol{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:170px;box-shadow:var(--shadow)}
.daycol h3{font-size:13.5px;margin-bottom:8px;color:var(--green-deep)}
.daycol .slot{font-size:11px;color:var(--ink-soft);margin:7px 0 3px;text-transform:uppercase;letter-spacing:.5px}
.dishchip{background:var(--cream);border:1px solid var(--line);border-radius:9px;padding:6px 8px;font-size:12.5px;margin-bottom:6px}
.dishchip img{width:100%;border-radius:6px;margin-bottom:4px;aspect-ratio:16/9;object-fit:cover}
.dishchip .x{float:right;border:none;background:none;color:var(--faint);cursor:pointer;font-size:14px}
.empty{color:var(--faint);font-size:12.5px;font-style:italic}
/* plan list */
.planitem{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;
  display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);flex-wrap:wrap}
.planitem img{width:64px;height:64px;border-radius:10px;object-fit:cover}
.planitem .nm{font-weight:600;font-size:14.5px}
.planitem select,.planitem input[type=number]{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;font-family:var(--sans)}
.planitem label{font-size:13px;color:var(--ink-soft);display:flex;align-items:center;gap:6px}
.planitem .rm{margin-left:auto;border:none;background:none;color:var(--faint);font-size:18px;cursor:pointer}
.servrow{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:14px}
/* grocery */
.gcat{margin-bottom:22px}
.gcat h3{font-size:15px;color:var(--green-deep);margin-bottom:10px}
.gitem{background:var(--paper);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;box-shadow:var(--shadow)}
.gitem .head{padding:10px 14px;display:flex;gap:10px;align-items:center;cursor:pointer}
.gitem .head .in{font-weight:600;font-size:14px}
.gitem .head .amt{margin-left:auto;font-size:13px;color:var(--ink-soft)}
.gitem .head .chev{color:var(--faint);font-size:12px}
.gitem .kb{display:none;padding:0 14px 12px;font-size:13px;line-height:1.65;color:var(--ink)}
.gitem.open .kb{display:block}
.gitem.open .chev{transform:rotate(180deg);display:inline-block}
.kb h4{font-size:12.5px;color:var(--green-deep);margin:8px 0 2px}
.kb p{margin-bottom:4px}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(40,25,15,.45);display:none;z-index:100;overflow-y:auto;padding:26px 14px}
.overlay.show{display:block}
.modal{max-width:640px;margin:0 auto;background:var(--paper);border-radius:16px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.2)}
.modal img.hero{width:100%;max-height:300px;object-fit:cover}
.modal .mbody{padding:20px 22px}
.modal h2{font-size:20px;margin-bottom:4px}
.modal .close{float:right;border:none;background:var(--cream);border:1px solid var(--line);border-radius:50%;
  width:32px;height:32px;font-size:16px;cursor:pointer;color:var(--ink-soft)}
.ingtable{width:100%;border-collapse:collapse;margin:12px 0;font-size:13.5px}
.ingtable td{border-bottom:1px dashed var(--line);padding:6px 4px}
.ingtable td:last-child{text-align:right;color:var(--ink-soft)}
.steps{margin:10px 0 0 20px;font-size:14px;line-height:1.75}
.steps li{margin-bottom:8px}
.yt{display:inline-block;margin-top:12px;font-size:13.5px}
.loading{text-align:center;padding:40px;color:var(--ink-soft)}
.err{background:#fdeeee;border:1px solid #f3c1b8;color:#a33d31;border-radius:10px;padding:12px 16px;margin-bottom:14px;font-size:14px}
/* auth bar (same account as X Planner) */
.authbar{background:var(--paper);border-bottom:1px solid var(--line);padding:8px 18px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}
#authBox{display:inline-flex;align-items:center;gap:7px;flex-wrap:wrap}
#authBox input{border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:13px;
  font-family:var(--sans);width:170px;background:#fff}
#authBox input:focus{outline:none;border-color:var(--green)}
#authBox button{border:1px solid var(--line);background:var(--paper);border-radius:8px;
  padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink);font-family:var(--sans)}
#authBox button:hover{border-color:var(--green);color:var(--green-deep)}
#authBox a{font-size:12.5px;color:var(--green);text-decoration:none}
#authBox a:hover{text-decoration:underline}
#authErr{color:#a33d31;font-size:12.5px;flex-basis:100%}
#authWho{color:var(--green-deep);font-weight:600}
#syncStat{font-size:11.5px;color:var(--ink-soft)}
.lockpanel{background:var(--paper);border:1px solid var(--line);border-radius:14px;
  padding:34px 26px;text-align:center;box-shadow:var(--shadow);max-width:520px;margin:30px auto}
.lockpanel .big{font-size:40px;margin-bottom:10px}
.lockpanel h2{font-size:18px;margin-bottom:8px}
.lockpanel p{font-size:14px;color:var(--ink-soft);line-height:1.7}
footer.credit{text-align:center;color:var(--faint);font-size:12px;padding:26px}
</style>
</head>
<body>
<div class="topbar">
  <a class="backlink" href="../">← Back to Lab</a>
  <div class="brand"><span class="pot">🍲</span><h1><span data-t="appName">认真吃饭</span><small>Eat Well, Live Better</small></h1></div>
  <div class="seg" id="langSeg">
    <button data-lang="zh">中文</button><button data-lang="en" class="on">EN</button>
  </div>
</div>
<div class="authbar">
  <span id="authBox" style="display:none">
    <span id="authForm">
      <input type="email" id="authEmail" data-t-ph="emailPh" placeholder="Email" autocomplete="email">
      <input type="password" id="authPass" data-t-ph="passPh" placeholder="Password" autocomplete="current-password">
      <button id="authGo" data-t="unlock">Unlock</button>
      <a href="#" id="authNew" data-t="newAccount">new account</a>
      <a href="#" id="authCheck" data-t="checkKey" title="Test whether this page's Firebase API key is accepted by Google">check key</a>
    </span>
    <span id="authOut" style="display:none">
      <span id="authWho"></span>
      <button id="authSignOut" data-t="signOut">Sign out</button>
    </span>
    <span id="authErr"></span>
  </span>
  <span id="syncStat"></span>
</div>
<div class="areabar" id="areaBar"></div>
<div class="tabs" id="tabs">
  <button data-tab="browse" class="on" data-t="tabBrowse">选菜</button>
  <button data-tab="plan" data-t="tabPlan">本周计划</button>
  <button data-tab="grocery" data-t="tabGrocery">采购清单</button>
</div>
<div class="wrap">
  <div id="errBox"></div>
  <section id="tab-browse">
    <div class="toolbar">
      <input type="search" id="searchBox" data-t-ph="searchPh" placeholder="搜索菜名… Search dishes…">
      <span class="pill-note" id="browseCount"></span>
    </div>
    <div class="grid" id="dishGrid"></div>
  </section>
  <section id="tab-plan" style="display:none">
    <div class="servrow">
      <span data-t="servings">每餐份数 Servings</span>
      <input type="number" id="servings" min="1" max="8" value="2" style="width:64px;border:1px solid var(--line);border-radius:8px;padding:6px 8px">
      <span class="pill-note" data-t="servingsNote">采购量会按份数折算</span>
    </div>
    <div id="planList"></div>
    <h3 style="margin:22px 0 12px" data-t="weekView">本周一览</h3>
    <div class="week" id="weekGrid"></div>
  </section>
  <section id="tab-grocery" style="display:none">
    <div class="toolbar"><span class="pill-note" id="groceryNote"></span></div>
    <div id="groceryList"></div>
  </section>
</div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<footer class="credit">Eat Well · recipes from TheMealDB (open database)</footer>
<script>

const API="https://www.themealdb.com/api/json/v1/1";
const S={lang:"en",area:"Chinese",
 areas:["Chinese","American","Korean","Japanese","Thai","Italian","Mexican","Indian","French","Spanish","Vietnamese","British"],
 meals:[],sel:{},detail:{},servings:2,tab:"browse",q:""};
const LS="eatwell-prefs";
try{const p=JSON.parse(localStorage.getItem(LS)||"{}");
 if(p.lang)S.lang=p.lang;if(p.area)S.area=p.area;if(p.servings)S.servings=p.servings;}catch(e){}
function savePrefs(){try{localStorage.setItem(LS,JSON.stringify({lang:S.lang,area:S.area,servings:S.servings}));}catch(e){}}

const t=k=>T[S.lang][k];

 clearTimeout(pushTimer);

 if(c==="auth/too-many-requests")return S.lang==="zh"?"尝试太频繁，稍后再试。":"Too many attempts — try again in a bit.";

function initFirebase(){const box=$("authBox");if(!firebaseReady()){box.style.display="none";return;}
 try{firebase.initializeApp(firebaseConfig);fauth=firebase.auth();fdb=firebase.firestore();box.style.display="";
  const emailEl=$("authEmail"),passEl=$("authPass");
  const err=m=>{$("authErr").textContent=m||"";};
  const showForm=s=>{$("authForm").style.display=s?"":"none";$("authOut").style.display=s?"none":"";};
  const creds=()=>({em:emailEl.value.trim(),pw:passEl.value});
  $("authGo").onclick=()=>{err("");const{em,pw}=creds();
   if(!em||!pw){err(S.lang==="zh"?"输入邮箱和密码，再点“解锁”。":"Type your email and password, then click Unlock.");return;}
   fauth.signInWithEmailAndPassword(em,pw).catch(e=>err((S.lang==="zh"?"登录失败：":"Sign-in failed: ")+friendlyAuthError(e)));};
  $("authNew").onclick=e=>{e.preventDefault();err("");const{em,pw}=creds();
   if(!em||!pw){err(t("typeCreds"));return;}
   if(!confirm(t("confirmNew")(em)))return;
   fauth.createUserWithEmailAndPassword(em,pw).catch(e=>err((S.lang==="zh"?"注册失败：":"Couldn't create account: ")+friendlyAuthError(e)));};
  $("authSignOut").onclick=()=>{wipeOnSignOut=true;fauth.signOut();};
  $("authCheck").onclick=e=>{e.preventDefault();err(t("keyChecking"));
   fauth.fetchSignInMethodsForEmail("key-check@example.invalid").then(()=>err(t("keyOk")))
    .catch(e2=>{const c2=(e2&&e2.code)||"";
     err(c2==="auth/api-key-not-valid"?t("keyBad")+friendlyAuthError(e2):t("keyOk")+" (check: "+(c2||"ok")+")");});};
  passEl.addEventListener("keydown",e=>{if(e.key==="Enter")$("authGo").click();});
  fauth.onAuthStateChanged(u=>{fbUser=u;err("");
   if(u){$("authWho").textContent=u.email||"";showForm(false);setSync(t("syncing"));
    userDoc=fdb.collection("eatwell").doc(u.uid);
    userDoc.get().then(snap=>{
     if(snap.exists&&snap.data()&&snap.data().sel)applyRemote(snap.data());
     else pushRemote(true);
     listen();setSync(t("syncDone"));
    }).catch(e=>{setSync(t("syncErr"));console.error(e);});
   }else{showForm(true);if(unsub){unsub();unsub=null;}userDoc=null;setSync("");
    if(wipeOnSignOut){wipeOnSignOut=false;S.sel={};S.servings=2;savePrefs();}}
   renderAll();});
 }catch(e){console.error(e);box.style.display="none";}}
function needLogin(){if(fbUser)return true;
 const ae=$("authErr");if(ae){ae.textContent=t("needLogin");ae.scrollIntoView({block:"nearest",behavior:"smooth"});}
 return false;}
/* ================= TheMealDB ================= */
async function apiFilter(area){const r=await fetch(API+"/filter.php?a="+encodeURIComponent(area));
 if(!r.ok)throw new Error("http "+r.status);const j=await r.json();return j.meals||[];}
async function apiLookup(id){if(S.detail[id])return S.detail[id];
 const r=await fetch(API+"/lookup.php?i="+encodeURIComponent(id));
 if(!r.ok)throw new Error("http "+r.status);
 const j=await r.json();const m=(j.meals||[])[0];if(m)S.detail[id]=m;return m;}
function mealIngredients(m){const out=[];
 for(let i=1;i<=20;i++){const ing=(m["strIngredient"+i]||"").trim(),ms=(m["strMeasure"+i]||"").trim();
  if(ing)out.push({ing,ms});}return out;}

function renderAreas(){$("areaBar").innerHTML=S.areas.map(a=>
 '<button class="'+(a===S.area?"on":"")+'" data-a="'+a+'">'+a+"</button>").join("");
 $("areaBar").querySelectorAll("button").forEach(b=>b.onclick=()=>{S.area=b.dataset.a;savePrefs();renderAreas();loadArea();});}
function filteredMeals(){const q=S.q.trim().toLowerCase();if(!q)return S.meals;
 return S.meals.filter(m=>(m.strMeal||"").toLowerCase().includes(q));}
function renderGrid(){const list=filteredMeals(),g=$("dishGrid");
 $("browseCount").textContent=t("dishesCount")(list.length);
 if(!list.length){g.innerHTML='<div class="empty" style="grid-column:1/-1;padding:30px;text-align:center">'+esc(t("planEmpty"))+"</div>";return;}
 g.innerHTML=list.map(m=>{const sel=S.sel[m.idMeal];
  return '<div class="card"><img class="thumb" loading="lazy" src="'+esc(m.strMealThumb)+'" alt="" onclick="openRecipe(\''+m.idMeal+'\')">'
  +'<div class="body"><div class="nm" onclick="openRecipe(\''+m.idMeal+'\')">'+esc(m.strMeal)+'</div>'
  +'<div class="row"><button class="btn '+(sel?"sel":"primary")+'" onclick="toggleSelect(\''+m.idMeal+'\')">'
  +esc(sel?t("selected"):t("addDish"))+'</button><button class="btn" onclick="openRecipe(\''+m.idMeal+'\')">'+esc(t("recipe"))+"</button></div></div></div>";}).join("");}
async function loadArea(){const g=$("dishGrid");
 g.innerHTML='<div class="loading" style="grid-column:1/-1">'+esc(t("loading"))+"</div>";errBox("");
 try{S.meals=await apiFilter(S.area);renderGrid();}
 catch(e){errBox(t("loadFail"));g.innerHTML="";}}
function toggleSelect(id){if(!needLogin())return;
 if(S.sel[id])delete S.sel[id];
 else S.sel[id]={day:(new Date().getDay()+6)%7,dbl:false};
 pushRemote();renderGrid();renderPlan();}
async function openRecipe(id){const ov=$("overlay"),mo=$("modal");
 ov.classList.add("show");
 mo.innerHTML='<div class="mbody"><button class="close" onclick="closeRecipe()">✕</button><div class="loading">'+esc(t("loading"))+"</div></div>";
 try{const m=await apiLookup(id);if(!m)throw new Error("none");
  const ings=mealIngredients(m);
  let steps=(m.strInstructions||"").split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  if(steps.length<=1)steps=(m.strInstructions||"").split(/(?<=\.)\s+/).map(s=>s.trim()).filter(s=>s.length>3);
  mo.innerHTML='<img class="hero" src="'+esc(m.strMealThumb)+'"><div class="mbody">'
   +'<button class="close" onclick="closeRecipe()">✕</button>'
   +"<h2>"+esc(mealName(m.strMeal))+"</h2>"
   +'<div class="pill-note">'+esc([m.strArea,m.strCategory].filter(Boolean).join(" · "))+"</div>"
   +'<h4 style="margin:14px 0 4px;color:var(--green-deep)">'+esc(t("ingredients"))+"</h4>"
   +'<table class="ingtable">'+ings.map(o=>"<tr><td>"+esc(S.lang==="zh"?kbLookup(o.ing).zh:o.ing)+"</td><td>"+esc(o.ms||"—")+"</td></tr>").join("")+"</table>"
   +(S.lang==="zh"?'<div class="pill-note" style="margin-top:10px">'+esc(t("recipeNote"))+"</div>":"")
   +'<h4 style="margin:12px 0 4px;color:var(--green-deep)">'+esc(t("steps"))+"</h4>"
   +'<ol class="steps">'+steps.map(s=>"<li>"+esc(s)+"</li>").join("")+"</ol>"
   +(m.strYoutube?'<a class="yt" href="'+esc(m.strYoutube)+'" target="_blank" rel="noopener">'+esc(t("watchVideo"))+"</a>":"")
   +"</div>";
 }catch(e){mo.innerHTML='<div class="mbody"><button class="close" onclick="closeRecipe()">✕</button><div class="err">'+esc(t("noDetail"))+"</div></div>";}}
function closeRecipe(){$("overlay").classList.remove("show");}
/* ================= plan ================= */
function lockPanel(){return '<div class="lockpanel"><div class="big">🔒</div><h2>'+esc(t("lockTitle"))+"</h2><p>"+esc(t("lockBody"))+"</p></div>";}
function selEntries(){return Object.keys(S.sel).map(id=>({id,day:S.sel[id].day,dbl:!!S.sel[id].dbl}));}
function dishName(id){const d=S.detail[id];if(d)return d.strMeal;
 const m=S.meals.find(x=>x.idMeal===id);return m?m.strMeal:id;}
function dishThumb(id){const d=S.detail[id];if(d&&d.strMealThumb)return d.strMealThumb;
 const m=S.meals.find(x=>x.idMeal===id);return m?m.strMealThumb:"";}
function renderPlan(){const box=$("planList"),sv=$("servings");
 sv.value=S.servings;
 if(locked()){box.innerHTML=lockPanel();renderWeek();return;}
 const es=selEntries();
 if(!es.length){box.innerHTML='<div class="empty" style="padding:24px;text-align:center">'+esc(t("planEmpty"))+"</div>";renderWeek();return;}
 box.innerHTML=es.map(e=>'<div class="planitem"><img src="'+esc(dishThumb(e.id))+'" alt="">'
  +'<div><div class="nm">'+esc(dishName(e.id))+'</div>'
  +'<label><input type="checkbox" '+(e.dbl?"checked":"")+' onchange="setDbl(\''+e.id+'\',this.checked)"> '+esc(t("nextDayLunch"))+"</label></div>"
  +'<select onchange="setDay(\''+e.id+'\',this.value)">'+t("days").map((d,i)=>'<option value="'+i+'"'+(i===e.day?" selected":"")+">"+esc(d)+"</option>").join("")+"</select>"
  +'<button class="rm" title="'+esc(t("remove"))+'" onclick="rmDish(\''+e.id+'\')">✕</button></div>').join("");
 renderWeek();}
function setDay(id,day){S.sel[id].day=+day;pushRemote();renderPlan();}
function setDbl(id,v){S.sel[id].dbl=v;pushRemote();renderPlan();renderGrocery();}
function rmDish(id){delete S.sel[id];pushRemote();renderGrid();renderPlan();renderGrocery();}
function renderWeek(){const wg=$("weekGrid");if(!wg)return;
 if(locked()){wg.innerHTML="";return;}
 const es=selEntries(),days=t("days");
 wg.innerHTML=days.map((d,i)=>{
  const dinners=es.filter(e=>e.day===i),lunches=es.filter(e=>e.day===(i+6)%7&&e.dbl);
  const chip=e=>'<div class="dishchip">'+(dishThumb(e.id)?'<img src="'+esc(dishThumb(e.id))+'" alt="">':"")+"<button class='x' onclick=\"rmDish('"+e.id+"')\">✕</button>"+esc(dishName(e.id))+"</div>";
  return '<div class="daycol"><h3>'+esc(d)+"</h3>"
   +'<div class="slot">'+esc(t("dinner"))+"</div>"
   +(dinners.length?dinners.map(chip).join(""):'<div class="empty">—</div>')
   +'<div class="slot">'+esc(t("lunch"))+"</div>"
   +(lunches.length?lunches.map(e=>'<div class="dishchip"><span class="badge lunch">'+esc(t("lunchFrom"))+"</span><br>"+esc(dishName(e.id))+"</div>").join(""):'<div class="empty">—</div>')
   +"</div>";}).join("");}

function kbLookup(name){const n=name.toLowerCase().trim();
 if(KB[n])return KB[n];
 for(const k in KB){if(n.includes(k)||k.includes(n))return KB[k];}
 return null;}
function kbName(name){const k=kbLookup(name);return k&&k.zh?k.zh:name;}
/* ================= grocery ================= */
function parseMeasure(ms){ms=(ms||"").trim().toLowerCase();if(!ms)return{qty:null,unit:"",raw:""};
 const m=ms.match(/^(\d+)\s*\/\s*(\d+)\s*(.*)$/);
 let qty=null,rest=ms;
 if(m){qty=(+m[1])/(+m[2]);rest=m[3].trim();}
 else{const m2=ms.match(/^(\d+(?:\.\d+)?)\s*(.*)$/);if(m2){qty=+m2[1];rest=m2[2].trim();}}
 let unit=rest.replace(/[.,;]+$/,"").trim();
 const conv={"kg":{u:"g",f:1000},"l":{u:"ml",f:1000},"litre":{u:"ml",f:1000},"liter":{u:"ml",f:1000}};
 if(conv[unit]){qty=qty==null?null:qty*conv[unit].f;unit=conv[unit].u;}
 unit=unit.replace(/s$/,"");
 return{qty,unit,raw:ms};}
function fmtQty(qty,unit){if(qty==null||!isFinite(qty))return"";
 let q=Math.round(qty*10)/10;return(q+" "+unit).trim();}
async function buildGrocery(){const es=selEntries(),agg={};
 for(const e of es){let m;try{m=await apiLookup(e.id);}catch(_){continue;}if(!m)continue;
  const mult=S.servings*(e.dbl?2:1);
  for(const o of mealIngredients(m)){const p=parseMeasure(o.ms);
   const key=o.ing.toLowerCase()+"|"+p.unit;
   if(!agg[key])agg[key]={ing:o.ing,qty:0,unit:p.unit,raws:[],dishes:0,hasNum:false};
   const a=agg[key];a.dishes++;
   if(p.qty!=null&&isFinite(p.qty)){a.qty+=p.qty*mult;a.hasNum=true;}
   else if(p.raw&&!a.raws.includes(p.raw))a.raws.push(p.raw);}}
 return Object.values(agg).sort((a,b)=>a.ing.localeCompare(b.ing));}
function kbHTML(name){const k=kbLookup(name),L=S.lang;
 const buy=k?k.buy[L]:t("kbFBuy"),store=k?k.store[L]:t("kbFStore"),cook=k?k.cook[L]:t("kbFCook");
 return "<h4>"+esc(t("buyTip"))+"</h4><p>"+esc(buy)+"</p><h4>"+esc(t("storeTip"))+"</h4><p>"+esc(store)+"</p><h4>"+esc(t("cookTip"))+"</h4><p>"+esc(cook)+"</p>";}
let groceryCache=null;
async function renderGrocery(){const box=$("groceryList");
 if(locked()){box.innerHTML=lockPanel();$("groceryNote").textContent="";return;}
 const es=selEntries();
 if(!es.length){box.innerHTML='<div class="empty" style="padding:24px;text-align:center">'+esc(t("groceryEmpty"))+"</div>";$("groceryNote").textContent="";return;}
 box.innerHTML='<div class="loading">'+esc(t("loading"))+"</div>";
 $("groceryNote").textContent=t("groceryNote");
 try{const items=await buildGrocery();groceryCache=items;
  const cats={};
  for(const it of items){const k=kbLookup(it.ing);const c=k?k.cat:"catOther";
   (cats[c]=cats[c]||[]).push(it);}
  const order=["catProtein","catVeg","catStaple","catSeason","catOther"];
  box.innerHTML=order.filter(c=>cats[c]).map(c=>{
   return '<div class="gcat"><h3>'+esc(t(c))+"</h3>"+cats[c].map((it,ix)=>{
    const amt=it.hasNum?fmtQty(it.qty,it.unit):"";
    const raw=it.raws.length?it.raws.join(" · "):"";
    const show=amt||raw||"—";
    const nm=S.lang==="zh"?kbName(it.ing):it.ing;
    return '<div class="gitem" id="g_'+c+"_"+ix+'"><div class="head" onclick="this.parentNode.classList.toggle(\'open\')">'
     +'<span class="in">'+esc(nm)+'</span><span class="pill-note">'+esc(t("usedIn")(it.dishes))+'</span>'
     +'<span class="amt">'+esc(show)+'</span><span class="chev">▼</span></div>'
     +'<div class="kb"><div class="pill-note" style="margin-bottom:6px">'+esc(it.ing)+'</div>'+kbHTML(it.ing)+"</div></div>";
   }).join("")+"</div>";}).join("")
   +'<div class="pill-note" style="margin-top:8px">'+esc(t("tapForTips"))+"</div>";
 }catch(e){box.innerHTML='<div class="err">'+esc(t("loadFail"))+"</div>";}}
/* ================= tabs / language / init ================= */
function renderAll(){renderGrid();renderPlan();if(S.tab==="grocery")renderGrocery();}
function switchTab(name){S.tab=name;
 document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===name));
 ["browse","plan","grocery"].forEach(n=>$("tab-"+n).style.display=n===name?"":"none");
 if(name==="plan")renderPlan();if(name==="grocery")renderGrocery();}
function applyI18n(){document.documentElement.lang=S.lang==="zh"?"zh-CN":"en";
 document.querySelectorAll("[data-t]").forEach(el=>{const v=t(el.dataset.t);if(typeof v==="string")el.textContent=v;});
 document.querySelectorAll("[data-t-ph]").forEach(el=>{const v=t(el.dataset.tPh);if(typeof v==="string")el.placeholder=v;});
 document.querySelectorAll("#langSeg button").forEach(b=>b.classList.toggle("on",b.dataset.lang===S.lang));}
function setLang(l){S.lang=l;savePrefs();applyI18n();renderAreas();renderGrid();renderPlan();if(S.tab==="grocery")renderGrocery();}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
document.querySelectorAll("#langSeg button").forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
$("overlay").addEventListener("click",e=>{if(e.target===$("overlay"))closeRecipe();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeRecipe();});
let searchTimer=null;
$("searchBox").addEventListener("input",e=>{clearTimeout(searchTimer);
 searchTimer=setTimeout(()=>{S.q=e.target.value;renderGrid();},250);});
$("servings").addEventListener("change",e=>{const v=Math.max(1,Math.min(8,+e.target.value||2));
 S.servings=v;savePrefs();pushRemote();renderGrocery();});
applyI18n();renderAreas();loadArea();initFirebase();switchTab("browse");
