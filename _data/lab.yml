projects:
  - title: "Visitor Map"
    description: "Explore website visits by country, state or province, and city."
    figure: "/images/lab/visitor-map.svg"
    figure_alt: "World map of website visits by country"
    url: "/visitor-map/"
  - title: "[Productivity] X Planner"
    description: "A lightweight planning tool designed to help users—especially those who struggle with organization—capture tasks, set priorities, and build a manageable daily routine."
    figure: "/lab/planner/thumbnail.png"
    figure_alt: "X Planner daily planner interface"
    url: "/lab/planner/"
  - title: "[Game] Under Review"
    description: "A 3D simulation designed to help early-career researchers become familiar with the academic publishing process—from journal selection and submission to rejection, revision, and resubmission."
    figure: "/images/lab/under-review.svg"
    figure_alt: "A manuscript approaching a journal gate in UNDER REVIEW"
    url: "/lab/under-review/"
  - title: "[Life] Eat Well"
    description: "A weekly meal-planning tool for students and novice cooks who may not know how to plan meals, shop efficiently, or prepare food across a week."
    figure: "/lab/eatwell/thumbnail.png"
    figure_alt: "Eat Well meal planner interface"
    url: "/lab/eatwell/"
  - title: "Becoming a Researcher"
    draft: true
    description: "Learn through research, collaboration, and peer review in a single-player game about growing as a researcher."
    figure: "/images/lab/becoming-a-researcher.svg"
    figure_alt: "A research notebook: ask a better question, follow the evidence, carry the lesson forward"
    url: "/lab/becoming-a-researcher/"
  - title: "[Learning] IS Research Craft"
    description: "Learning how to think and work as an IS researcher."
    figure: "/lab/is-research-craft/cover.jpg"
    figure_alt: "IS Research Craft study notes illustration"
    url: "/lab/is-research-craft/"
