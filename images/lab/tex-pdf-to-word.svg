<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 506.25" role="img" aria-labelledby="tw-title tw-desc">
<title id="tw-title">Tex/PDF to Word</title>
<desc id="tw-desc">A LaTeX source document and a scanned page converting into a clean Word document.</desc>
<rect width="900" height="506.25" fill="#eef4f7"/>
<!-- source doc: .tex -->
<g>
<rect x="120" y="110" width="220" height="290" rx="10" fill="#ffffff" stroke="#d7e0e5" stroke-width="3"/>
<rect x="150" y="140" width="90" height="26" rx="6" fill="#3451b2"/>
<text x="195" y="159" text-anchor="middle" font-family="monospace" font-size="16" fill="#ffffff">.tex</text>
<rect x="150" y="185" width="160" height="10" rx="4" fill="#9aa4ab"/>
<rect x="150" y="205" width="160" height="10" rx="4" fill="#c3ccd1"/>
<rect x="150" y="225" width="120" height="10" rx="4" fill="#c3ccd1"/>
<rect x="150" y="255" width="160" height="10" rx="4" fill="#9aa4ab"/>
<rect x="150" y="275" width="140" height="10" rx="4" fill="#c3ccd1"/>
<rect x="150" y="305" width="160" height="10" rx="4" fill="#c3ccd1"/>
<rect x="150" y="325" width="100" height="10" rx="4" fill="#c3ccd1"/>
</g>
<!-- scanned page -->
<g>
<rect x="380" y="150" width="150" height="210" rx="8" fill="#ffffff" stroke="#d7e0e5" stroke-width="3" transform="rotate(4 455 255)"/>
<rect x="405" y="180" width="60" height="20" rx="5" fill="#e0a93e" transform="rotate(4 455 255)"/>
<text x="435" y="195" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffffff" transform="rotate(4 435 195)">PDF</text>
<rect x="405" y="215" width="100" height="8" rx="3" fill="#c3ccd1" transform="rotate(4 455 255)"/>
<rect x="405" y="230" width="100" height="8" rx="3" fill="#c3ccd1" transform="rotate(4 455 255)"/>
<rect x="405" y="245" width="80" height="8" rx="3" fill="#c3ccd1" transform="rotate(4 455 255)"/>
<rect x="405" y="265" width="100" height="8" rx="3" fill="#c3ccd1" transform="rotate(4 455 255)"/>
<rect x="405" y="280" width="90" height="8" rx="3" fill="#c3ccd1" transform="rotate(4 455 255)"/>
</g>
<!-- arrow -->
<g>
<line x1="560" y1="255" x2="640" y2="255" stroke="#2b2f33" stroke-width="10" stroke-linecap="round"/>
<polyline points="615,225 650,255 615,285" fill="none" stroke="#2b2f33" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<!-- word doc -->
<g>
<rect x="670" y="110" width="220" height="290" rx="10" fill="#ffffff" stroke="#d7e0e5" stroke-width="3"/>
<rect x="700" y="140" width="90" height="26" rx="6" fill="#52adc8"/>
<text x="745" y="159" text-anchor="middle" font-family="monospace" font-size="16" fill="#ffffff">.docx</text>
<rect x="700" y="185" width="160" height="14" rx="4" fill="#2b2f33"/>
<rect x="700" y="210" width="110" height="10" rx="4" fill="#3451b2"/>
<rect x="700" y="235" width="160" height="10" rx="4" fill="#c3ccd1"/>
<rect x="700" y="255" width="160" height="10" rx="4" fill="#c3ccd1"/>
<rect x="700" y="275" width="130" height="10" rx="4" fill="#c3ccd1"/>
<rect x="700" y="300" width="110" height="10" rx="4" fill="#3451b2"/>
<rect x="700" y="325" width="160" height="10" rx="4" fill="#c3ccd1"/>
<rect x="700" y="345" width="140" height="10" rx="4" fill="#c3ccd1"/>
</g>
</svg>
