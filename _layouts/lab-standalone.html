---
layout: compress
---
<!doctype html>
<html lang="en">
  <head>
    {% include head.html %}
    <style>
      .lab-standalone { max-width: 1200px; margin: 0 auto; padding: 24px; }
      .lab-standalone__nav { margin-bottom: 32px; }
      .lab-standalone__nav a { color: #0039a6; }
      .lab-standalone figure { margin: 24px 0; }
      .lab-standalone figure img { display: block; width: 100%; height: auto; }
      .lab-standalone figcaption { color: #586c86; }
      @media (max-width: 640px) { .lab-standalone { padding: 16px; } }
    </style>
  </head>
  <body>
    <main class="lab-standalone">
      <nav class="lab-standalone__nav" aria-label="Return to Lab"><a href="{{ '/lab/' | relative_url }}">&larr; Back to Lab</a></nav>
      <h1 class="page__title">{{ page.title | escape }}</h1>
      <div class="page__content">{{ content }}</div>
    </main>
  </body>
</html>
