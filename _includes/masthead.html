{% include base_path %}

<style>
.nav-flower {
  display: inline-block;
  font-size: 1em;
  margin-left: 0.15em;
  animation: nav-flower-glow 2.5s ease-in-out infinite;
}
@keyframes nav-flower-glow {
  0%, 100% { filter: drop-shadow(0 0 0 rgba(255, 90, 90, 0)); }
  50% { filter: drop-shadow(0 0 6px rgba(255, 90, 90, 0.9)); }
}
</style>

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg"><a href="{{ base_path }}/">Homepage</a></li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
            {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{{ link.title }}{% if link.title == "Lab" %} <span class="nav-flower">🌺</span>{% endif %}</a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
